// ── SLIME MOLD PAGE ───────────────────────────────────────────────────────────
const SLIME_SKILLS=[
  {from:'scout',       to:'analyst',    skill:'source_patterns',   desc:'Raw web data fingerprints'},
  {from:'analyst',     to:'synthesizer',skill:'gap_map',           desc:'Identified logical gaps'},
  {from:'orchestrator',to:'builder',   skill:'routing_heuristic',  desc:'Task decomposition rules'},
  {from:'builder',     to:'critic',     skill:'deploy_artifact',   desc:'Deployed output for review'},
  {from:'critic',      to:'synthesizer',skill:'risk_flags',        desc:'Failure modes & blockers'},
  {from:'synthesizer', to:'orchestrator',skill:'coherence_model',  desc:'Unified understanding'},
  {from:'scout',       to:'orchestrator',skill:'domain_index',     desc:'Known domain map'},
  {from:'analyst',     to:'orchestrator',skill:'confidence_score', desc:'Claim reliability rating'},
  {from:'orchestrator',to:'scout',     skill:'search_directive',   desc:'Next research target'},
  {from:'critic',      to:'builder',   skill:'constraint_update',  desc:'Learned build constraints'},
];

function SlimePage(){
  const canvasRef=useRef(null);
  const stateRef=useRef({nodes:[],trails:[],transfers:[],pheromone:{}});
  const tidRef=useRef(0);
  const[log,setLog]=useState([]);
  const[stats,setStats]=useState({transfers:0,skills:{},merges:0});

  const W=1100,H=580;

  // Initialize simulation
  useEffect(()=>{
    // Place agents in a wide circle
    const n=AGENTS.length;
    const nodes=AGENTS.map((a,i)=>{
      const angle=(i/n)*Math.PI*2-Math.PI/2;
      const r=210;
      return{...a,x:W/2+Math.cos(angle)*r,y:H/2+Math.sin(angle)*r,
        mass:a.confidence*3+1,energy:a.confidence,pulseT:Math.random()*6.28};
    });
    const pheromone={};
    SLIME_SKILLS.forEach(s=>{pheromone[`${s.from}-${s.to}`]=0;});
    stateRef.current={nodes,trails:[],transfers:[],pheromone,tick:0};
  },[]);

  // Animation loop
  useEffect(()=>{
    const canvas=canvasRef.current;if(!canvas)return;
    const ctx=canvas.getContext('2d');
    let raf,tickCount=0;

    const spawnTransfer=()=>{
      const s=SLIME_SKILLS[Math.floor(Math.random()*SLIME_SKILLS.length)];
      const key=`${s.from}-${s.to}`;
      const id=tidRef.current++;
      const st=stateRef.current;
      st.pheromone[key]=(st.pheromone[key]||0)+0.3;
      st.transfers.push({...s,id,p:0,speed:0.004+Math.random()*0.003});
      setLog(prev=>[{time:new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),skill:s.skill,from:s.from,to:s.to,desc:s.desc},...prev.slice(0,11)]);
      setStats(prev=>({
        transfers:prev.transfers+1,
        merges:prev.merges+(Math.random()<.08?1:0),
        skills:{...prev.skills,[s.skill]:(prev.skills[s.skill]||0)+1},
      }));
    };

    const interval=setInterval(spawnTransfer,1600);
    spawnTransfer();

    const draw=()=>{
      tickCount++;
      const t=tickCount;
      const st=stateRef.current;
      const{nodes,transfers,pheromone}=st;
      const nodeMap={};nodes.forEach(n=>nodeMap[n.id]=n);

      // Fade bg
      ctx.fillStyle='rgba(6,6,16,0.18)';
      ctx.fillRect(0,0,W,H);

      // Pheromone decay
      Object.keys(pheromone).forEach(k=>{pheromone[k]*=.995;});

      // Draw pheromone trails
      SLIME_SKILLS.forEach(s=>{
        const a=nodeMap[s.from],b=nodeMap[s.to];if(!a||!b)return;
        const ph=pheromone[`${s.from}-${s.to}`]||0;
        if(ph<0.01)return;
        const fa=AGENTS.find(x=>x.id===s.from);
        const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
        const dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy)||1;
        const cx=mx-dy*.12,cy=my+dx*.12;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(cx,cy,b.x,b.y);
        ctx.strokeStyle=fa?.color+'';
        ctx.globalAlpha=Math.min(ph*.6,.55);
        ctx.lineWidth=1+ph*3;
        ctx.shadowBlur=ph*12;ctx.shadowColor=fa?.color||'#fff';
        ctx.stroke();
        ctx.globalAlpha=1;ctx.shadowBlur=0;
      });

      // Advance & draw transfers
      st.transfers=st.transfers.filter(tr=>{
        tr.p+=tr.speed;
        if(tr.p>1.05)return false;
        const a=nodeMap[tr.from],b=nodeMap[tr.to];if(!a||!b)return false;
        const p=Math.min(tr.p,1);
        const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
        const dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy)||1;
        const cx2=mx-dy*.12,cy2=my+dx*.12;
        const t1=1-p;
        const px=t1*t1*a.x+2*t1*p*cx2+p*p*b.x;
        const py=t1*t1*a.y+2*t1*p*cy2+p*p*b.y;
        const fa=AGENTS.find(x=>x.id===tr.from);
        const alpha=p<.1?p/.1:p>.9?(1-p)/.1:1;
        // Glow orb
        ctx.beginPath();ctx.arc(px,py,10,0,Math.PI*2);
        ctx.fillStyle=fa?.color||'#fff';
        ctx.globalAlpha=alpha*.5;ctx.shadowBlur=20;ctx.shadowColor=fa?.color;ctx.fill();
        ctx.shadowBlur=0;
        ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);
        ctx.fillStyle=fa?.color||'#fff';ctx.globalAlpha=alpha*.9;ctx.fill();
        ctx.beginPath();ctx.arc(px,py,2,0,Math.PI*2);
        ctx.fillStyle='white';ctx.globalAlpha=alpha;ctx.fill();
        ctx.globalAlpha=1;
        // Skill label
        if(p>.15&&p<.85){
          ctx.fillStyle='rgba(8,8,20,0.85)';ctx.beginPath();ctx.roundRect(px-34,py-20,68,14,4);ctx.fill();
          ctx.fillStyle=fa?.color||'#fff';ctx.font='bold 8px Inter,sans-serif';
          ctx.textAlign='center';ctx.fillText(tr.skill,px,py-10);
        }
        // Ripple on arrival
        if(p>.88){
          const rr=(p-.88)/.12*30;
          ctx.beginPath();ctx.arc(b.x,b.y,rr,0,Math.PI*2);
          ctx.strokeStyle=fa?.color||'#fff';ctx.lineWidth=1.5;ctx.globalAlpha=(1-p/.12)*.6;ctx.stroke();
          ctx.globalAlpha=1;
        }
        return true;
      });

      // Draw agent nodes
      nodes.forEach(a=>{
        a.pulseT+=.018;
        const pulse=0.7+0.3*Math.sin(a.pulseT);
        const r=22+a.mass*3;
        // Outer aura
        const g=ctx.createRadialGradient(a.x,a.y,r*.3,a.x,a.y,r+18);
        g.addColorStop(0,a.color+'55');g.addColorStop(1,'transparent');
        ctx.beginPath();ctx.arc(a.x,a.y,r+18,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
        // Ring
        ctx.beginPath();ctx.arc(a.x,a.y,r,0,Math.PI*2);
        ctx.strokeStyle=a.color;ctx.lineWidth=2*pulse;
        ctx.shadowBlur=10*pulse;ctx.shadowColor=a.color;ctx.stroke();ctx.shadowBlur=0;
        // Fill
        ctx.beginPath();ctx.arc(a.x,a.y,r,0,Math.PI*2);
        ctx.fillStyle=a.color+'28';ctx.fill();
        // Core
        ctx.beginPath();ctx.arc(a.x,a.y,8,0,Math.PI*2);
        ctx.fillStyle=a.color;ctx.shadowBlur=12;ctx.shadowColor=a.color;ctx.fill();ctx.shadowBlur=0;
        // Icon
        ctx.font='12px serif';ctx.textAlign='center';ctx.fillStyle='white';
        ctx.globalAlpha=.9;ctx.fillText(a.icon,a.x,a.y+4);ctx.globalAlpha=1;
        // Name
        ctx.font='bold 10px Inter,sans-serif';ctx.fillStyle=a.color;
        ctx.textAlign='center';ctx.fillText(a.name.toUpperCase(),a.x,a.y+r+16);
        ctx.font='9px Inter,sans-serif';ctx.fillStyle='#4b5563';
        ctx.fillText(a.role,a.x,a.y+r+27);
        // Energy bar
        const bw=50,bx=a.x-bw/2,by=a.y+r+30;
        ctx.fillStyle='#1e1e2e';ctx.beginPath();ctx.roundRect(bx,by,bw,4,2);ctx.fill();
        ctx.fillStyle=a.color;ctx.globalAlpha=.7;
        ctx.beginPath();ctx.roundRect(bx,by,bw*a.energy,4,2);ctx.fill();ctx.globalAlpha=1;
      });

      raf=requestAnimationFrame(draw);
    };
    raf=requestAnimationFrame(draw);
    return()=>{cancelAnimationFrame(raf);clearInterval(interval);};
  },[]);

  const topSkills=Object.entries(stats.skills).sort((a,b)=>b[1]-a[1]).slice(0,5);

  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',gap:12}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexShrink:0}}>
        <div><h1 style={{fontSize:22,fontWeight:800,marginBottom:4}}>Slime Mold Protocol</h1>
          <p style={{color:'#64748b',fontSize:13}}>Agents share skills passively · pheromone trails reinforce active paths · collective memory grows</p></div>
        <div style={{display:'flex',gap:16}}>
          {[{label:'Transfers',val:stats.transfers,color:'#6366f1'},{label:'Merge Events',val:stats.merges,color:'#10b981'},{label:'Unique Skills',val:Object.keys(stats.skills).length,color:'#a855f7'}].map(s=>(
            <div key={s.label} style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:8,padding:'8px 14px',textAlign:'center'}}>
              <div style={{fontSize:18,fontWeight:800,color:s.color}}>{s.val}</div>
              <div style={{fontSize:10,color:'#4b5563'}}>{s.label}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 280px',gap:12,flex:1,minHeight:0}}>
        {/* Canvas */}
        <div style={{background:'#060610',border:'1px solid #1a1a28',borderRadius:14,overflow:'hidden',position:'relative'}}>
          <canvas ref={canvasRef} width={W} height={H} style={{display:'block',width:'100%',height:'100%'}}/>
          <div style={{position:'absolute',top:10,left:14,fontSize:9,color:'#2d2d3a',letterSpacing:'.1em',textTransform:'uppercase'}}>● Live · Slime Mold Protocol Active</div>
        </div>

        {/* Side panel */}
        <div style={{display:'flex',flexDirection:'column',gap:10,overflow:'hidden'}}>
          {/* Top skills */}
          <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:14,flexShrink:0}}>
            <div style={{fontSize:10,fontWeight:700,color:'#4b5563',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:10}}>Most Transferred Skills</div>
            {topSkills.length===0&&<div style={{fontSize:11,color:'#2d2d3a'}}>Accumulating...</div>}
            {topSkills.map(([skill,count])=>{
              const s=SLIME_SKILLS.find(x=>x.skill===skill);
              const fa=s?AGENTS.find(a=>a.id===s.from):null;
              const max=topSkills[0]?.[1]||1;
              return(
                <div key={skill} style={{marginBottom:8}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                    <span style={{fontSize:11,color:fa?.color||'#94a3b8',fontWeight:600}}>{skill}</span>
                    <span style={{fontSize:10,color:'#374151'}}>×{count}</span>
                  </div>
                  <div style={{background:'#0d0d10',borderRadius:3,height:3}}>
                    <div style={{width:`${(count/max)*100}%`,height:'100%',background:fa?.color||'#6366f1',borderRadius:3}}/>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Event log */}
          <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:14,flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
            <div style={{fontSize:10,fontWeight:700,color:'#4b5563',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:10,flexShrink:0}}>
              <span className="live-dot"/>Transfer Log
            </div>
            <div style={{overflow:'auto',flex:1}}>
              {log.map((e,i)=>{
                const fa=AGENTS.find(a=>a.id===e.from);
                const ta=AGENTS.find(a=>a.id===e.to);
                return(
                  <div key={i} style={{borderBottom:'1px solid #0f0f18',paddingBottom:8,marginBottom:8}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:2}}>
                      <span style={{fontSize:10,color:'#374151',fontFamily:'monospace'}}>{e.time}</span>
                      <span style={{fontSize:9,fontWeight:700,color:fa?.color,background:fa?.color+'22',padding:'1px 5px',borderRadius:3}}>{e.skill}</span>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:2}}>
                      <span style={{fontSize:10}}>{fa?.icon}</span>
                      <span style={{fontSize:10,color:fa?.color,fontWeight:600}}>{fa?.name}</span>
                      <span style={{fontSize:9,color:'#374151'}}>→</span>
                      <span style={{fontSize:10}}>{ta?.icon}</span>
                      <span style={{fontSize:10,color:ta?.color,fontWeight:600}}>{ta?.name}</span>
                    </div>
                    <div style={{fontSize:10,color:'#4b5563'}}>{e.desc}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── REPORTS PAGE ─────────────────────────────────────────────────────────────
function ReportsPage(){
  const[reports,setReports]=useState([]);
  const[sel,setSel]=useState(null);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    // Try to load reports from the ikigai server
    const base='http://'+window.location.hostname+':5173';
    fetch(base+'/reports/index.json').then(r=>r.json()).then(d=>{
      Promise.all((d.reports||[]).map(r=>fetch(base+'/reports/'+r.file).then(x=>x.json()))).then(loaded=>{
        setReports(loaded);setLoading(false);
      });
    }).catch(()=>{
      // Try loading directly if opened as file
      fetch('/reports/market-2026-03-30.json').then(r=>r.json()).then(d=>{
        setReports([d]);setLoading(false);
      }).catch(()=>setLoading(false));
    });
    // Also poll for new reports every 10s
    const iv=setInterval(()=>{
      fetch(base+'/reports/market-2026-03-30.json').then(r=>r.json()).then(d=>{
        setReports(prev=>{
          const exists=prev.find(p=>p.date===d.date&&p.title===d.title);
          return exists?prev:[...prev,d];
        });
      }).catch(()=>{});
    },10000);
    return()=>clearInterval(iv);
  },[]);

  // Chat state for interactive reports
  const[chatOpen,setChatOpen]=useState(false);
  const[chatInput,setChatInput]=useState('');
  const[chatMsgs,setChatMsgs]=useState([]);
  const[chatSending,setChatSending]=useState(false);
  const chatScrollRef=useRef(null);

  const sendChat=async()=>{
    if(!chatInput.trim()||chatSending)return;
    const msg=chatInput.trim();
    setChatInput('');
    setChatMsgs(prev=>[...prev,{role:'user',text:msg,time:new Date().toLocaleTimeString()}]);
    setChatSending(true);
    try{
      // Build the prompt for the researcher with context about which report and what to do
      const reportFile=sel?.date?`/Users/openclaudio/Desktop/ikigai/public/reports/${reports.indexOf(sel)>-1?'arthritis-app-2026-03-30':'market-2026-03-30'}.json`:'';
      const fullPrompt=`You are chatting with the user about the report "${sel?.title}". They say:\n\n${msg}\n\nJust answer naturally. If they're asking a question, answer it. If they want a summary, summarize. If they want your opinion, give it. Only edit the report file if they explicitly ask you to add, change, or update something in the report itself (e.g. "add a section about X", "update the MVP section", "remove the crypto part"). The report files are under /Users/openclaudio/Desktop/ikigai/public/reports/ if you need to edit.`;
      const base='http://'+window.location.hostname+':4444';
      await fetch(base+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session:'researcher',message:fullPrompt})});
      setChatMsgs(prev=>[...prev,{role:'system',text:'Thinking...',time:new Date().toLocaleTimeString(),pending:true}]);
      // Poll: snapshot event count before, then wait for new response events
      const beforeCount=(await fetch(base+'/history').then(r2=>r2.json()).catch(()=>({events:[]}))).events?.length||0;
      const pollForResponse=async()=>{
        // Wait for researcher to start
        await new Promise(r=>setTimeout(r,2000));
        let sawWorking=false;
        for(let i=0;i<90;i++){
          await new Promise(r=>setTimeout(r,1500));
          try{
            const sessData=await fetch(base+'/sessions').then(r2=>r2.json());
            const researcher=sessData.sessions?.find(s=>s.name==='researcher');
            if(researcher?.status==='working')sawWorking=true;
            // Only check for completion after we saw it working
            if(sawWorking&&researcher?.status==='idle'){
              // Grab only NEW events (after our beforeCount)
              const hist=await fetch(base+'/history').then(r2=>r2.json());
              const allEvts=hist.events||[];
              const newEvts=allEvts.slice(beforeCount);
              const researcherResps=newEvts.filter(ev=>ev.session==='researcher'&&(ev.type==='response'||ev.type==='intermediate'));
              if(researcherResps.length>0){
                const latest=researcherResps[researcherResps.length-1];
                const cleanMsg=(latest.message||'').replace(/\*\*\[researcher\]\*\*\s*/g,'').replace(/^\s*\n+/,'').slice(0,1200);
                setChatMsgs(prev=>prev.map(m=>m.pending?{role:'assistant',text:cleanMsg||'Done.',time:new Date().toLocaleTimeString()}:m));
              }else{
                setChatMsgs(prev=>prev.map(m=>m.pending?{role:'assistant',text:'Done — the researcher responded in Slack. Check there for the full answer.',time:new Date().toLocaleTimeString()}:m));
              }
              return;
            }
          }catch{}
        }
        setChatMsgs(prev=>prev.map(m=>m.pending?{role:'assistant',text:'Researcher is still working — check Slack.',time:new Date().toLocaleTimeString()}:m));
      };
      pollForResponse();
    }catch(e){
      setChatMsgs(prev=>[...prev,{role:'system',text:'Error: Could not reach researcher. Is the bridge server running?',time:new Date().toLocaleTimeString()}]);
    }
    setChatSending(false);
  };

  // Auto-refresh report when chat is open
  useEffect(()=>{
    if(!chatOpen||!sel)return;
    const iv=setInterval(()=>{
      const base='http://'+window.location.hostname+':5173';
      // Try to reload all reports
      fetch(base+'/reports/index.json').then(r2=>r2.json()).then(d=>{
        Promise.all((d.reports||[]).map(r2=>fetch(base+'/reports/'+r2.file).then(x=>x.json()))).then(loaded=>{
          setReports(loaded);
          // Update selected report if it matches
          const updated=loaded.find(l=>l.title===sel.title);
          if(updated)setSel(updated);
        });
      }).catch(()=>{});
    },5000);
    return()=>clearInterval(iv);
  },[chatOpen,sel]);

  if(sel){
    const r=sel;
    return(
      <div style={{height:'100%',display:'flex',flexDirection:'column',margin:'-32px -36px',overflow:'hidden'}}>
        <div style={{display:'flex',alignItems:'center',gap:14,padding:'14px 24px',borderBottom:'1px solid #1a1a25',background:'#0a0a0f',flexShrink:0}}>
          <button onClick={()=>{setSel(null);setChatOpen(false);setChatMsgs([]);}} style={{background:'#13131a',border:'1px solid #1e1e2e',color:'#e2e8f0',padding:'7px 14px',borderRadius:8,cursor:'pointer',fontSize:12,fontWeight:500,fontFamily:'Inter,sans-serif'}}>← Back</button>
          <span style={{fontSize:18}}>📊</span>
          <span style={{fontSize:15,fontWeight:700}}>{r.title}</span>
          <span style={{marginLeft:'auto',display:'flex',gap:8,alignItems:'center'}}>
            <button onClick={()=>setChatOpen(!chatOpen)} style={{background:chatOpen?'#6366f1':'#13131a',border:`1px solid ${chatOpen?'#6366f1':'#1e1e2e'}`,color:chatOpen?'#fff':'#64748b',padding:'7px 14px',borderRadius:8,cursor:'pointer',fontSize:12,fontWeight:600,fontFamily:'Inter,sans-serif',display:'flex',alignItems:'center',gap:6}}>💬 {chatOpen?'Close Chat':'Ask / Edit'}</button>
            <span style={{fontSize:12,color:'#64748b',fontFamily:'monospace'}}>{r.date}</span>
          </span>
        </div>
        <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        {/* Report content */}
        <div style={{flex:1,overflow:'auto',padding:'28px 36px'}}>
          <div style={{maxWidth:900,margin:'0 auto'}}>
            {/* Sections */}
            {(r.sections||[]).map((s,i)=>(
              <div key={i} style={{marginBottom:28}}>
                <div style={{fontSize:11,fontWeight:700,color:'#6366f1',letterSpacing:'.12em',textTransform:'uppercase',marginBottom:10}}>{s.title}</div>
                <div style={{fontSize:14,lineHeight:1.8,color:'#94a3b8',whiteSpace:'pre-wrap'}}>{s.content}</div>
                {s.highlights&&s.highlights.length>0&&(
                  <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:12}}>
                    {s.highlights.map((h,j)=>(
                      <span key={j} style={{fontSize:11,color:'#10b981',background:'#10b98122',border:'1px solid #10b98133',borderRadius:6,padding:'4px 10px'}}>{h}</span>
                    ))}
                  </div>
                )}
              </div>
            ))}
            {/* Outlook */}
            {r.outlook&&(
              <div style={{marginTop:32}}>
                <div style={{fontSize:11,fontWeight:700,color:'#6366f1',letterSpacing:'.12em',textTransform:'uppercase',marginBottom:10}}>Outlook</div>
                <div style={{fontSize:14,lineHeight:1.8,color:'#94a3b8',marginBottom:16}}>{r.outlook.summary}</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
                  <div style={{background:'#10b98112',border:'1px solid #10b98133',borderRadius:10,padding:16}}>
                    <div style={{fontSize:11,fontWeight:700,color:'#10b981',marginBottom:8}}>BULLISH</div>
                    {(r.outlook.bullish||[]).map((b,i)=>(
                      <div key={i} style={{fontSize:12,color:'#6ee7b7',marginBottom:4}}>▲ {b}</div>
                    ))}
                  </div>
                  <div style={{background:'#ef444412',border:'1px solid #ef444433',borderRadius:10,padding:16}}>
                    <div style={{fontSize:11,fontWeight:700,color:'#ef4444',marginBottom:8}}>BEARISH</div>
                    {(r.outlook.bearish||[]).map((b,i)=>(
                      <div key={i} style={{fontSize:12,color:'#fca5a5',marginBottom:4}}>▼ {b}</div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>

        {/* Chat panel */}
        {chatOpen&&(
          <div style={{width:380,borderLeft:'1px solid #1a1a25',background:'#0a0a0f',display:'flex',flexDirection:'column',flexShrink:0}}>
            <div style={{padding:'14px 16px',borderBottom:'1px solid #1a1a25',display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:14}}>💬</span>
              <span style={{fontSize:13,fontWeight:700}}>Chat with Report</span>
              <span style={{marginLeft:'auto',fontSize:10,color:'#06b6d4'}}>→ researcher</span>
            </div>
            <div ref={chatScrollRef} style={{flex:1,overflow:'auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:10}}>
              {chatMsgs.length===0&&(
                <div style={{textAlign:'center',padding:'40px 16px',color:'#374151'}}>
                  <div style={{fontSize:24,marginBottom:8}}>💬</div>
                  <div style={{fontSize:12,lineHeight:1.6}}>Ask questions about this report or request edits.<br/><br/>Examples:<br/>
                    <span style={{color:'#64748b'}}>"Add more detail about Hinge Health pricing"</span><br/>
                    <span style={{color:'#64748b'}}>"Expand the MVP section with a tech stack recommendation"</span><br/>
                    <span style={{color:'#64748b'}}>"What's the best exercise for hand arthritis?"</span>
                  </div>
                </div>
              )}
              {chatMsgs.map((m,i)=>(
                <div key={i} style={{alignSelf:m.role==='user'?'flex-end':'flex-start',maxWidth:'85%'}}>
                  <div style={{background:m.role==='user'?'#6366f1':'#13131a',border:m.role==='user'?'none':'1px solid #1e1e2e',borderRadius:m.role==='user'?'12px 12px 2px 12px':'12px 12px 12px 2px',padding:'10px 14px',fontSize:13,color:m.role==='user'?'#fff':'#94a3b8',lineHeight:1.5}}>{m.text}</div>
                  <div style={{fontSize:9,color:'#374151',marginTop:3,textAlign:m.role==='user'?'right':'left'}}>{m.time}</div>
                </div>
              ))}
              {chatSending&&<div style={{fontSize:12,color:'#6366f1',padding:8}}>Sending to researcher...</div>}
            </div>
            <div style={{padding:'12px 16px',borderTop:'1px solid #1a1a25'}}>
              <div style={{display:'flex',gap:8}}>
                <input value={chatInput} onChange={e=>setChatInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendChat()} placeholder="Ask or request edits..." style={{flex:1,background:'#13131a',border:'1px solid #1e1e2e',borderRadius:8,padding:'10px 14px',color:'#e2e8f0',fontSize:13,fontFamily:'Inter,sans-serif',outline:'none'}}/>
                <button onClick={sendChat} disabled={chatSending} style={{background:'#6366f1',border:'none',borderRadius:8,padding:'10px 16px',color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'Inter,sans-serif',opacity:chatSending?.5:1}}>Send</button>
              </div>
              <div style={{fontSize:9,color:'#2d2d3a',marginTop:6}}>Messages go to the researcher agent via Claude Code. Report auto-refreshes every 5s.</div>
            </div>
          </div>
        )}
        </div>
      </div>
    );
  }

  return(
    <div>
      <div style={{marginBottom:24}}><h1 style={{fontSize:22,fontWeight:800,marginBottom:4}}>Reports</h1><p style={{color:'#64748b',fontSize:13}}>Agent-generated analysis and research reports</p></div>
      {loading&&<div style={{textAlign:'center',padding:40,color:'#374151'}}>Loading reports...</div>}
      {!loading&&reports.length===0&&(
        <div style={{textAlign:'center',padding:60,color:'#374151'}}>
          <div style={{fontSize:32,marginBottom:12}}>📊</div>
          <div style={{fontWeight:600,marginBottom:4}}>No reports yet</div>
          <div style={{fontSize:13}}>Reports will appear here when agents complete analysis tasks</div>
        </div>
      )}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:14}}>
        {reports.map((r,i)=>(
          <div key={i} onClick={()=>setSel(r)} style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,overflow:'hidden',cursor:'pointer',transition:'all .25s'}}>
            <div style={{height:80,display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,rgba(99,102,241,.08),rgba(16,185,129,.05))',borderBottom:'1px solid #1e1e2e'}}>
              <span style={{fontSize:32}}>📊</span>
            </div>
            <div style={{padding:'16px 18px'}}>
              <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>{r.title||'Untitled Report'}</div>
              <div style={{fontSize:12,color:'#64748b',marginBottom:8}}>{r.date||'Unknown date'}</div>
              <div style={{fontSize:12,color:'#4b5563'}}>{r.sections?.length||0} sections · {r.outlook?'Has outlook':'No outlook'}</div>
            </div>
            <div style={{padding:'10px 18px',borderTop:'1px solid #1e1e2e',display:'flex',justifyContent:'space-between'}}>
              <span style={{fontSize:11,color:'#4b5563'}}>Agent report</span>
              <span style={{fontSize:13,color:'#6366f1'}}>→</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── EXECUTION PAGE ───────────────────────────────────────────────────────────
const BRIDGE_URL='http://'+window.location.hostname+':4444';
const EVENT_TYPE_META={
  response:     {label:'response',   color:'#10b981',icon:'✓'},
  permission_request:{label:'permission',color:'#f59e0b',icon:'🔑'},
  plan_review:  {label:'plan',       color:'#a855f7',icon:'📋'},
  intermediate: {label:'working',    color:'#6366f1',icon:'⚙'},
  session_start:{label:'start',      color:'#06b6d4',icon:'🚀'},
  user_prompt:  {label:'prompt',     color:'#ec4899',icon:'💬'},
  status_change:{label:'status',     color:'#64748b',icon:'◉'},
  elicitation:  {label:'question',   color:'#f59e0b',icon:'❓'},
};

function ExecutionPage(){
  const[tab,setTab]=useState('terminal');
  const[events,setEvents]=useState([]);
  const[sessions,setSessions]=useState([]);
  const[connected,setConnected]=useState(false);
  const[bridgeOk,setBridgeOk]=useState(null); // null=checking, true/false
  const scrollRef=useRef(null);
  const[paused,setPaused]=useState(false);
  const pausedRef=useRef(false);
  useEffect(()=>{pausedRef.current=paused;},[paused]);

  // Check bridge health + load sessions
  useEffect(()=>{
    const checkBridge=()=>{
      fetch(BRIDGE_URL+'/health').then(r=>r.json()).then(d=>{
        setBridgeOk(true);setConnected(true);
      }).catch(()=>setBridgeOk(false));
      fetch(BRIDGE_URL+'/sessions').then(r=>r.json()).then(d=>{
        if(d.sessions)setSessions(d.sessions);
      }).catch(()=>{});
    };
    checkBridge();
    const iv=setInterval(checkBridge,5000);
    return()=>clearInterval(iv);
  },[]);

  // SSE connection for real events
  useEffect(()=>{
    if(!bridgeOk)return;
    const es=new EventSource(BRIDGE_URL+'/events');
    es.onmessage=(e)=>{
      try{
        const event=JSON.parse(e.data);
        setEvents(prev=>[...prev.slice(-200),event]);
      }catch{}
    };
    es.onerror=()=>setConnected(false);
    es.onopen=()=>setConnected(true);
    return()=>es.close();
  },[bridgeOk]);

  // Load history on mount
  useEffect(()=>{
    if(!bridgeOk)return;
    fetch(BRIDGE_URL+'/history').then(r=>r.json()).then(d=>{
      if(d.events?.length)setEvents(d.events);
    }).catch(()=>{});
  },[bridgeOk]);

  // Auto-scroll terminal
  useEffect(()=>{
    if(scrollRef.current&&!paused&&tab==='terminal')scrollRef.current.scrollTop=scrollRef.current.scrollHeight;
  },[events,paused,tab]);

  // Fetch tasks from bridge
  const[tasks,setTasks]=useState([]);
  const[selTask,setSelTask]=useState(null);
  useEffect(()=>{
    const fetchTasks=()=>{
      fetch(BRIDGE_URL+'/tasks').then(r=>r.json()).then(d=>{
        if(d.tasks)setTasks(d.tasks);
      }).catch(()=>{});
    };
    fetchTasks();
    const iv=setInterval(fetchTasks,3000);
    return()=>clearInterval(iv);
  },[]);

  // Agent filter for terminal
  const[agentFilter,setAgentFilter]=useState('all');

  const tabs=[{id:'terminal',label:'Terminal',icon:'▸'},{id:'tasks',label:'Tasks',icon:'☰'},{id:'taskboard',label:'Agents',icon:'◫'},{id:'live',label:'Live View',icon:'◉'}];

  const filteredEvents=agentFilter==='all'?events:events.filter(ev=>ev.session===agentFilter);

  // Agent colors for consistent display
  const AGENT_COLORS={orchestrator:'#a855f7',researcher:'#06b6d4',aaaaaa:'#6366f1',eva:'#10b981',plase:'#ec4899','market-analysis':'#f59e0b'};

  // Derive task board from events
  const tasksBySession={};
  sessions.forEach(s=>{tasksBySession[s.name]={...s,events:[]};});
  events.forEach(ev=>{
    if(!tasksBySession[ev.session])tasksBySession[ev.session]={name:ev.session,status:'unknown',events:[]};
    tasksBySession[ev.session].events.push(ev);
    if(ev.status)tasksBySession[ev.session].status=ev.status;
  });

  // Live view: aggregate recent activity
  const recentEvents=events.slice(-30);
  const sessionActivity={};
  events.forEach(ev=>{
    if(!sessionActivity[ev.session])sessionActivity[ev.session]={count:0,lastEvent:null,tools:{},types:{}};
    const sa=sessionActivity[ev.session];
    sa.count++;
    sa.lastEvent=ev;
    if(ev.tool)sa.tools[ev.tool]=(sa.tools[ev.tool]||0)+1;
    sa.types[ev.type]=(sa.types[ev.type]||0)+1;
  });

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      {/* Header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexShrink:0}}>
        <div>
          <h1 style={{fontSize:22,fontWeight:800,marginBottom:4}}>Execution</h1>
          <p style={{color:'#64748b',fontSize:13}}>Live agent orchestration · real sessions stream here</p>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {bridgeOk===null&&<span style={{fontSize:11,color:'#4b5563'}}>Connecting...</span>}
          {bridgeOk===false&&<span style={{fontSize:11,color:'#ef4444',background:'#ef444422',padding:'3px 10px',borderRadius:6}}>Bridge offline — start server at {BRIDGE_URL}</span>}
          {bridgeOk&&connected&&<><span className="live-dot"/><span style={{fontSize:11,color:'#10b981',fontWeight:600}}>CONNECTED</span><span style={{fontSize:11,color:'#374151'}}>{sessions.length} sessions · {events.length} events</span></>}
        </div>
      </div>

      {/* Sub-tabs */}
      <div style={{display:'flex',gap:4,marginBottom:12,flexShrink:0}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{fontFamily:'Inter,sans-serif',fontSize:12,fontWeight:600,padding:'8px 16px',border:'none',borderRadius:8,background:tab===t.id?'#6366f1':'#13131a',color:tab===t.id?'#fff':'#4b5563',cursor:'pointer',display:'flex',alignItems:'center',gap:6,transition:'all .15s'}}>
            <span>{t.icon}</span>{t.label}
          </button>
        ))}
      </div>

      {/* ── TERMINAL TAB ────────────────────────────────────────────────────── */}
      {tab==='terminal'&&(
        <div style={{flex:1,display:'flex',gap:12,overflow:'hidden'}}>
          {/* Agent sidebar */}
          <div style={{width:200,background:'#0a0a0f',border:'1px solid #1a1a25',borderRadius:12,display:'flex',flexDirection:'column',flexShrink:0,overflow:'hidden'}}>
            <div style={{padding:'12px 14px',borderBottom:'1px solid #1a1a25',fontSize:10,fontWeight:700,color:'#4b5563',textTransform:'uppercase',letterSpacing:'.1em'}}>Agents</div>
            <div style={{flex:1,overflow:'auto',padding:'6px 8px'}}>
              {/* All filter */}
              <div onClick={()=>setAgentFilter('all')} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:8,cursor:'pointer',background:agentFilter==='all'?'#1a1a2e':'transparent',marginBottom:2,transition:'all .12s'}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:'#6366f1'}}/>
                <span style={{fontSize:12,fontWeight:agentFilter==='all'?700:400,color:agentFilter==='all'?'#e2e8f0':'#64748b'}}>All agents</span>
                <span style={{marginLeft:'auto',fontSize:10,color:'#374151'}}>{events.length}</span>
              </div>
              {sessions.map(s=>{
                const evCount=events.filter(ev=>ev.session===s.name).length;
                const color=AGENT_COLORS[s.name]||'#64748b';
                const statusColor=s.status==='working'?'#10b981':s.status==='waiting'?'#f59e0b':'#4b5563';
                return(
                  <div key={s.name} onClick={()=>setAgentFilter(s.name)} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:8,cursor:'pointer',background:agentFilter===s.name?color+'22':'transparent',border:agentFilter===s.name?`1px solid ${color}44`:'1px solid transparent',marginBottom:2,transition:'all .12s'}}>
                    <div style={{position:'relative'}}>
                      <div style={{width:8,height:8,borderRadius:'50%',background:color}}/>
                      <div style={{position:'absolute',bottom:-2,right:-2,width:5,height:5,borderRadius:'50%',background:statusColor,border:'1px solid #0a0a0f'}}/>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:agentFilter===s.name?700:500,color:agentFilter===s.name?'#e2e8f0':'#94a3b8',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.name}</div>
                      <div style={{fontSize:9,color:statusColor,textTransform:'uppercase',letterSpacing:'.05em'}}>{s.status}</div>
                    </div>
                    {evCount>0&&<span style={{fontSize:10,color:color,background:color+'22',borderRadius:8,padding:'1px 6px',fontWeight:700}}>{evCount}</span>}
                  </div>
                );
              })}
            </div>
            {/* Legend */}
            <div style={{padding:'10px 14px',borderTop:'1px solid #1a1a25',fontSize:9,color:'#2d2d3a'}}>
              <div style={{display:'flex',gap:8,marginBottom:3}}>
                <span><span style={{color:'#10b981'}}>●</span> working</span>
                <span><span style={{color:'#f59e0b'}}>●</span> waiting</span>
              </div>
              <div style={{display:'flex',gap:8}}>
                <span><span style={{color:'#4b5563'}}>●</span> idle</span>
                <span>{sessions.length} agents</span>
              </div>
            </div>
          </div>

          {/* Terminal */}
          <div style={{flex:1,background:'#060610',border:'1px solid #1a1a25',borderRadius:12,overflow:'hidden',display:'flex',flexDirection:'column',fontFamily:'"SF Mono","Fira Code","Consolas",monospace'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 16px',borderBottom:'1px solid #1a1a25',background:'#0a0a12',flexShrink:0}}>
              <div style={{display:'flex',gap:6}}>
                <div style={{width:10,height:10,borderRadius:'50%',background:'#ef4444'}}/>
                <div style={{width:10,height:10,borderRadius:'50%',background:'#f59e0b'}}/>
                <div style={{width:10,height:10,borderRadius:'50%',background:'#10b981'}}/>
              </div>
              <span style={{fontSize:11,color:'#374151',marginLeft:8}}>{agentFilter==='all'?'all agents':agentFilter} {bridgeOk?'(live)':'(disconnected)'}</span>
              <div style={{marginLeft:'auto',display:'flex',gap:6}}>
                <button onClick={()=>setPaused(!paused)} style={{background:paused?'#f59e0b22':'#1e1e2e',border:`1px solid ${paused?'#f59e0b44':'#2d2d3a'}`,color:paused?'#f59e0b':'#64748b',borderRadius:4,padding:'3px 8px',fontSize:10,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>{paused?'▶':'⏸'}</button>
                <button onClick={()=>setEvents([])} style={{background:'#1e1e2e',border:'1px solid #2d2d3a',color:'#64748b',borderRadius:4,padding:'3px 8px',fontSize:10,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Clear</button>
              </div>
            </div>
            <div ref={scrollRef} style={{flex:1,overflow:'auto',padding:'12px 16px'}}>
              {filteredEvents.length===0&&bridgeOk&&<div style={{color:'#2d2d3a',fontSize:12,padding:20,textAlign:'center'}}>Connected. Waiting for events{agentFilter!=='all'?' from '+agentFilter:''}...</div>}
              {filteredEvents.length===0&&!bridgeOk&&<div style={{color:'#2d2d3a',fontSize:12,padding:20,textAlign:'center'}}>Bridge server not running.<br/>Start it: <span style={{color:'#6366f1'}}>cd ~/Desktop/ikigai/server && npm start</span></div>}
              {filteredEvents.map((ev,i)=>{
                const meta=EVENT_TYPE_META[ev.type]||{label:ev.type,color:'#64748b',icon:'◈'};
                const ts=ev.timestamp?new Date(ev.timestamp).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'--';
                const agentColor=AGENT_COLORS[ev.session]||'#64748b';
                return(
                  <div key={ev.id||i} style={{display:'flex',gap:10,marginBottom:6,lineHeight:1.6}}>
                    <span style={{color:'#2d2d3a',fontSize:11,flexShrink:0,width:72,paddingTop:1}}>{ts}</span>
                    <span style={{fontSize:10,flexShrink:0,width:14,paddingTop:2}}>{meta.icon}</span>
                    <span style={{color:agentColor,fontSize:11,fontWeight:700,flexShrink:0,width:110,paddingTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.session||'system'}</span>
                    <span style={{fontSize:9,fontWeight:700,color:meta.color,background:meta.color+'18',border:`1px solid ${meta.color}33`,borderRadius:3,padding:'1px 6px',flexShrink:0,height:18,display:'flex',alignItems:'center'}}>{meta.label}</span>
                    {ev.tool&&<span style={{fontSize:9,color:'#a855f7',background:'#a855f722',borderRadius:3,padding:'1px 6px',flexShrink:0,height:18,display:'flex',alignItems:'center'}}>{ev.tool}</span>}
                    <span style={{color:'#94a3b8',fontSize:12,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.message?.replace(/\n/g,' ').slice(0,200)||'—'}</span>
                  </div>
                );
              })}
              {!paused&&filteredEvents.length>0&&<div style={{display:'flex',alignItems:'center',gap:6,marginTop:4,opacity:.5}}>
                <span style={{color:'#10b981',fontSize:11}}>▊</span>
                <span style={{color:'#374151',fontSize:11}}>awaiting next event...</span>
              </div>}
            </div>
          </div>
        </div>
      )}

      {/* ── TASKS TAB ───────────────────────────────────────────────────────── */}
      {tab==='tasks'&&(
        <div style={{flex:1,overflow:'auto'}}>
          {tasks.length===0&&(
            <div style={{textAlign:'center',padding:60,color:'#374151'}}>
              <div style={{fontSize:32,marginBottom:12}}>☰</div>
              <div style={{fontWeight:600,marginBottom:4}}>No active tasks</div>
              <div style={{fontSize:13}}>Tasks appear here when the orchestrator assigns work to agents</div>
            </div>
          )}
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {tasks.map(t=>{
              const sc={running:'#6366f1',completed:'#10b981',failed:'#ef4444'};
              const agentSession=sessions.find(s=>s.name===t.agent);
              const taskEvents=events.filter(ev=>ev.session===t.agent);
              const toolCounts={};
              taskEvents.forEach(ev=>{if(ev.tool)toolCounts[ev.tool]=(toolCounts[ev.tool]||0)+1;});
              const topTools=Object.entries(toolCounts).sort((a,b)=>b[1]-a[1]).slice(0,6);
              const isExpanded=selTask===t.id;
              return(
                <div key={t.id} style={{background:'#13131a',border:`1px solid ${isExpanded?(sc[t.status]||'#6366f1')+'66':'#1e1e2e'}`,borderRadius:12,overflow:'hidden',transition:'all .2s'}}>
                  {/* Task header — clickable */}
                  <div onClick={()=>setSelTask(isExpanded?null:t.id)} style={{padding:'16px 20px',cursor:'pointer',display:'flex',alignItems:'flex-start',gap:14}}>
                    <div style={{width:36,height:36,borderRadius:10,background:(sc[t.status]||'#6366f1')+'22',border:`1px solid ${(sc[t.status]||'#6366f1')}44`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      <span style={{fontSize:14}}>{t.status==='running'?'⚡':t.status==='completed'?'✓':'✕'}</span>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
                        <span style={{fontSize:15,fontWeight:700}}>{t.title}</span>
                        <span style={{fontSize:10,fontWeight:600,color:sc[t.status]||'#6366f1',background:(sc[t.status]||'#6366f1')+'22',padding:'3px 8px',borderRadius:6,textTransform:'uppercase',letterSpacing:'.06em'}}>{t.status}</span>
                      </div>
                      <div style={{fontSize:12,color:'#64748b',marginBottom:6}}>{t.description}</div>
                      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                        <span style={{fontSize:11,color:'#a855f7',background:'#a855f722',border:'1px solid #a855f733',borderRadius:4,padding:'2px 8px'}}>Agent: {t.agent}</span>
                        <span style={{fontSize:11,color:'#4b5563'}}>Assigned by: {t.assignedBy}</span>
                        {agentSession&&<span style={{fontSize:11}}><StatusDot status={agentSession.status==='working'?'active':agentSession.status==='waiting'?'busy':'idle'}/> {agentSession.status}</span>}

                    </div>
                    <span style={{color:'#374151',fontSize:14,transition:'transform .2s',transform:isExpanded?'rotate(180deg)':'rotate(0)'}}>{isExpanded?'▲':'▼'}</span>

                  {isExpanded&&(
                    <div style={{borderTop:'1px solid #1e1e2e'}}>
                      {/* Tool usage */}
                      {topTools.length>0&&(
                        <div style={{padding:'12px 20px',display:'flex',gap:6,flexWrap:'wrap',borderBottom:'1px solid #1e1e2e'}}>
                          <span style={{fontSize:10,color:'#4b5563',fontWeight:600,marginRight:4}}>Tools:</span>
                          {topTools.map(([tool,count])=>(
                            <span key={tool} style={{fontSize:10,color:'#a855f7',background:'#a855f722',border:'1px solid #a855f733',borderRadius:4,padding:'2px 8px'}}>{tool} ×{count}</span>
                          ))}
                        </div>
                      )}
                      {/* Event log for this task */}
                      <div style={{maxHeight:300,overflow:'auto',padding:'8px 16px',fontFamily:'"SF Mono","Fira Code",monospace'}}>
                        {taskEvents.length===0&&<div style={{fontSize:11,color:'#2d2d3a',padding:12,textAlign:'center'}}>Waiting for events from {t.agent}...</div>}
                        {taskEvents.slice(-30).map((ev,i)=>{
                          const meta=EVENT_TYPE_META[ev.type]||{label:ev.type,color:'#64748b',icon:'◈'};
                          const ts=ev.timestamp?new Date(ev.timestamp).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'--';
                          return(
                            <div key={ev.id||i} style={{display:'flex',gap:8,marginBottom:4,lineHeight:1.5}}>

                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── AGENTS TAB (was Task Board) ────────────────────────────────────── */}
      {tab==='taskboard'&&(
        <div style={{flex:1,overflow:'auto'}}>
          {Object.keys(tasksBySession).length===0&&(
            <div style={{textAlign:'center',padding:60,color:'#374151'}}>
              <div style={{fontSize:32,marginBottom:12}}>◫</div>
              <div style={{fontWeight:600,marginBottom:4}}>No active sessions</div>

          )}
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:14}}>
            {Object.values(tasksBySession).map(s=>{
              const lastEv=s.events[s.events.length-1];
              const statusColor=s.status==='working'?'#10b981':s.status==='waiting'?'#f59e0b':s.status==='idle'?'#4b5563':'#64748b';
              const toolCounts={};
              s.events.forEach(ev=>{if(ev.tool)toolCounts[ev.tool]=(toolCounts[ev.tool]||0)+1;});
              const topTools=Object.entries(toolCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
              return(
                <div key={s.name} style={{background:'#13131a',border:`1px solid ${statusColor}44`,borderRadius:12,overflow:'hidden'}}>
                  {/* Card header */}
                  <div style={{padding:'14px 18px',borderBottom:'1px solid #1e1e2e',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <StatusDot status={s.status==='working'?'active':s.status==='waiting'?'busy':'idle'}/>
                      <span style={{fontWeight:700,fontSize:14}}>{s.name}</span>
                    </div>
                    <span style={{fontSize:10,fontWeight:600,color:statusColor,background:statusColor+'22',padding:'3px 8px',borderRadius:6,textTransform:'uppercase',letterSpacing:'.06em'}}>{s.status||'unknown'}</span>
                  </div>
                  {/* Stats */}
                  <div style={{padding:'12px 18px',display:'flex',gap:16}}>
                    <div><div style={{fontSize:18,fontWeight:800,color:'#6366f1'}}>{s.events.length}</div><div style={{fontSize:10,color:'#4b5563'}}>Events</div></div>
                    <div><div style={{fontSize:18,fontWeight:800,color:'#a855f7'}}>{Object.keys(toolCounts).length}</div><div style={{fontSize:10,color:'#4b5563'}}>Tools Used</div></div>
                    {s.directory&&<div style={{flex:1,fontSize:10,color:'#2d2d3a',paddingTop:4,fontFamily:'monospace',overflow:'hidden',textOverflow:'ellipsis'}}>{s.directory}</div>}
                  </div>
                  {/* Top tools */}
                  {topTools.length>0&&(
                    <div style={{padding:'0 18px 12px',display:'flex',gap:4,flexWrap:'wrap'}}>
                      {topTools.map(([tool,count])=>(
                        <span key={tool} style={{fontSize:10,color:'#a855f7',background:'#a855f722',border:'1px solid #a855f733',borderRadius:4,padding:'2px 6px'}}>{tool} ×{count}</span>
                      ))}
                    </div>
                  )}
                  {/* Last event */}
                  {lastEv&&(
                    <div style={{padding:'10px 18px',borderTop:'1px solid #1e1e2e',fontSize:11,color:'#64748b'}}>
                      <span style={{color:'#374151'}}>Last: </span>
                      {lastEv.message?.replace(/\n/g,' ').slice(0,100)||lastEv.type}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── LIVE VIEW TAB ───────────────────────────────────────────────────── */}
      {tab==='live'&&(
        <div style={{flex:1,overflow:'auto'}}>
          {Object.keys(sessionActivity).length===0&&(
            <div style={{textAlign:'center',padding:60,color:'#374151'}}>
              <div style={{fontSize:32,marginBottom:12}}>◉</div>
              <div style={{fontWeight:600,marginBottom:4}}>No activity yet</div>
              <div style={{fontSize:13}}>High-level agent activity will appear here</div>
            </div>
          )}

          {/* Activity summary cards */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:14,marginBottom:20}}>
            {Object.entries(sessionActivity).map(([name,sa])=>{
              const topTool=Object.entries(sa.tools).sort((a,b)=>b[1]-a[1])[0];
              const topType=Object.entries(sa.types).sort((a,b)=>b[1]-a[1])[0];
              return(
                <div key={name} style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:18}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                    <span style={{fontWeight:700,fontSize:14}}>{name}</span>
                    <span style={{fontSize:20,fontWeight:800,color:'#6366f1'}}>{sa.count}</span>
                  </div>
                  <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:10}}>
                    {topTool&&<Badge color="#a855f7">Top tool: {topTool[0]}</Badge>}
                    {topType&&<Badge color={EVENT_TYPE_META[topType[0]]?.color||'#64748b'}>Most: {topType[0]}</Badge>}
                  </div>
                  {sa.lastEvent&&(
                    <div style={{fontSize:11,color:'#64748b',lineHeight:1.5}}>
                      Latest: {sa.lastEvent.message?.replace(/\n/g,' ').slice(0,120)||'—'}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Recent event timeline */}
          <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:18}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
              {events.length>0&&<span className="live-dot"/>}
              <span style={{fontSize:11,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'.08em'}}>Recent Activity</span>
            </div>
            {recentEvents.length===0&&<div style={{fontSize:12,color:'#374151',textAlign:'center',padding:20}}>Waiting for events...</div>}
            {recentEvents.slice().reverse().map((ev,i)=>{
              const meta=EVENT_TYPE_META[ev.type]||{label:ev.type,color:'#64748b',icon:'◈'};
              const ts=ev.timestamp?new Date(ev.timestamp).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'--';
              return(
                <div key={ev.id||i} style={{display:'flex',gap:12,padding:'8px 0',borderBottom:i<recentEvents.length-1?'1px solid #0f0f18':'none',alignItems:'flex-start'}}>
                  <span style={{fontSize:10,color:'#374151',width:64,flexShrink:0,fontFamily:'monospace',paddingTop:2}}>{ts}</span>
                  <div style={{width:22,height:22,borderRadius:6,background:meta.color+'22',border:`1px solid ${meta.color}44`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <span style={{fontSize:10}}>{meta.icon}</span>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:2}}>
                      <span style={{fontSize:12,fontWeight:700,color:'#6366f1'}}>{ev.session||'system'}</span>
                      <span style={{fontSize:9,color:meta.color,fontWeight:600}}>{meta.label}</span>
                      {ev.tool&&<span style={{fontSize:9,color:'#a855f7'}}>→ {ev.tool}</span>}
                    </div>
                    <div style={{fontSize:12,color:'#94a3b8',lineHeight:1.5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.message?.replace(/\n/g,' ').slice(0,200)||'—'}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

const TYPE_COLORS={system:'#6366f1',route:'#a855f7',search:'#06b6d4',data:'#06b6d4',analyze:'#f59e0b',warn:'#ef4444',merge:'#10b981',resolve:'#10b981',review:'#f59e0b',flag:'#ef4444',build:'#ec4899',deploy:'#10b981',coord:'#a855f7',spawn:'#6366f1'};

function TerminalPage(){
  const[lines,setLines]=useState([]);
  const[paused,setPaused]=useState(false);
  const scrollRef=useRef(null);
  const idxRef=useRef(0);
  const pausedRef=useRef(false);

  useEffect(()=>{pausedRef.current=paused;},[paused]);

  useEffect(()=>{
    // Initial burst
    const initial=TERMINAL_MSGS.slice(0,5).map((m,i)=>({...m,time:new Date(Date.now()-((5-i)*2000)).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),id:i}));
    setLines(initial);
    idxRef.current=5;

    const interval=setInterval(()=>{
      if(pausedRef.current)return;
      const idx=idxRef.current%TERMINAL_MSGS.length;
      const m=TERMINAL_MSGS[idx];
      const line={...m,time:new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),id:Date.now()+Math.random()};
      setLines(prev=>[...prev.slice(-80),line]);
      idxRef.current++;
    },1800+Math.random()*1200);
    return()=>clearInterval(interval);
  },[]);

  useEffect(()=>{
    if(scrollRef.current&&!paused){scrollRef.current.scrollTop=scrollRef.current.scrollHeight;}
  },[lines,paused]);

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexShrink:0}}>
        <div>
          <h1 style={{fontSize:22,fontWeight:800,marginBottom:4}}>Terminal</h1>
          <p style={{color:'#64748b',fontSize:13}}>Live agent activity feed · all coordination events stream here</p>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <span className="live-dot"/>
          <span style={{fontSize:11,color:'#10b981',fontWeight:600}}>LIVE</span>
          <button onClick={()=>setPaused(!paused)} style={{background:paused?'#f59e0b22':'#1e1e2e',border:`1px solid ${paused?'#f59e0b44':'#2d2d3a'}`,color:paused?'#f59e0b':'#64748b',borderRadius:6,padding:'5px 12px',fontSize:11,fontWeight:600,cursor:'pointer',fontFamily:'Inter,sans-serif'}}>{paused?'▶ Resume':'⏸ Pause'}</button>
          <button onClick={()=>setLines([])} style={{background:'#1e1e2e',border:'1px solid #2d2d3a',color:'#64748b',borderRadius:6,padding:'5px 12px',fontSize:11,fontWeight:600,cursor:'pointer',fontFamily:'Inter,sans-serif'}}>Clear</button>
        </div>
      </div>

      {/* Terminal window */}
      <div style={{flex:1,background:'#060610',border:'1px solid #1a1a25',borderRadius:12,overflow:'hidden',display:'flex',flexDirection:'column',fontFamily:'"SF Mono","Fira Code","Consolas",monospace'}}>
        {/* Title bar */}
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 16px',borderBottom:'1px solid #1a1a25',background:'#0a0a12',flexShrink:0}}>
          <div style={{display:'flex',gap:6}}>
            <div style={{width:10,height:10,borderRadius:'50%',background:'#ef4444'}}/>
            <div style={{width:10,height:10,borderRadius:'50%',background:'#f59e0b'}}/>
            <div style={{width:10,height:10,borderRadius:'50%',background:'#10b981'}}/>
          </div>
          <span style={{fontSize:11,color:'#374151',marginLeft:8}}>cognition-os — agent-terminal</span>
          <span style={{marginLeft:'auto',fontSize:10,color:'#1e1e2e'}}>{lines.length} events</span>
        </div>

        {/* Log area */}
        <div ref={scrollRef} style={{flex:1,overflow:'auto',padding:'12px 16px'}}>
          {lines.map(line=>{
            const a=AGENTS.find(x=>x.id===line.agent);
            const tc=TYPE_COLORS[line.type]||'#64748b';
            return(
              <div key={line.id} style={{display:'flex',gap:10,marginBottom:6,lineHeight:1.6,animation:'fadeIn .15s ease'}}>
                <span style={{color:'#2d2d3a',fontSize:11,flexShrink:0,width:72,paddingTop:1}}>{line.time}</span>
                <span style={{fontSize:11,flexShrink:0,width:14,paddingTop:1}}>{a?.icon||'◈'}</span>
                <span style={{color:a?.color||'#64748b',fontSize:11,fontWeight:700,flexShrink:0,width:90,paddingTop:1}}>{a?.name||line.agent}</span>
                <span style={{fontSize:9,fontWeight:700,color:tc,background:tc+'18',border:`1px solid ${tc}33`,borderRadius:3,padding:'1px 6px',flexShrink:0,height:18,display:'flex',alignItems:'center'}}>{line.type}</span>
                <span style={{color:'#94a3b8',fontSize:12}}>{line.msg}</span>
              </div>
            );
          })}
          {lines.length===0&&<div style={{color:'#2d2d3a',fontSize:12,padding:20,textAlign:'center'}}>Terminal cleared. Waiting for events...</div>}
          {!paused&&<div style={{display:'flex',alignItems:'center',gap:6,marginTop:4,opacity:.5}}>
            <span style={{color:'#10b981',fontSize:11}}>▊</span>
            <span style={{color:'#374151',fontSize:11,animation:'pulse 1s infinite'}}>awaiting next event...</span>
          </div>}
        </div>

        {/* Bottom bar */}
        <div style={{borderTop:'1px solid #1a1a25',padding:'8px 16px',display:'flex',gap:16,background:'#0a0a12',flexShrink:0}}>
          {AGENTS.map(a=>(
            <div key={a.id} style={{display:'flex',alignItems:'center',gap:4}}>
              <StatusDot status={a.status}/>
              <span style={{fontSize:10,color:a.status==='active'?a.color:'#2d2d3a'}}>{a.name}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

  {id:'decisions', label:'Decision Map',  icon:'⎇'},
  {id:'artifact',  label:'Artifact State',icon:'◉'},
  {id:'tasks',     label:'Tasks',         icon:'⚡'},
  {id:'ideas',     label:'Ideas Tree',    icon:'✦'},
  {id:'slime',     label:'Slime Mold',    icon:'🧫'},
  {id:'reports',   label:'Reports',        icon:'📊'},
  {id:'execution', label:'Execution',     icon:'▸'},
];

function App(){
  const[page,setPage]=useState('home');
  const[modal,setModal]=useState(null);
  const[menuOpen,setMenuOpen]=useState(false);
  const isMobile=typeof window!=='undefined'&&window.innerWidth<768;
  const pages={
    home:      <HomePage      onOpenModal={setModal}/>,
    agents:    <AgentsPage    onOpenModal={setModal}/>,
    goals:     <GoalsPage/>,
    decisions: <DecisionMapPage/>,
    artifact:  <ArtifactPage/>,
    tasks:     <TasksPage/>,
    ideas:     <IdeasPage/>,
    slime:     <SlimePage/>,
    reports:   <ReportsPage/>,
    execution: <ExecutionPage/>,
  };
  const navPage=(id)=>{setPage(id);setMenuOpen(false);};
  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden',position:'relative'}}>
      {modal&&<AgentModal agent={modal} onClose={()=>setModal(null)}/>}

      {/* Mobile header */}
      {isMobile&&(
        <div style={{position:'fixed',top:0,left:0,right:0,zIndex:50,background:'#0a0a0f',borderBottom:'1px solid #1a1a25',display:'flex',alignItems:'center',padding:'12px 16px',gap:12}}>
          <button onClick={()=>setMenuOpen(!menuOpen)} style={{background:'#13131a',border:'1px solid #1e1e2e',color:'#e2e8f0',borderRadius:6,padding:'6px 10px',fontSize:16,cursor:'pointer',lineHeight:1}}>{menuOpen?'✕':'☰'}</button>
          <div style={{fontSize:14,fontWeight:800,letterSpacing:-.3}}>Cognition <span style={{color:'#6366f1'}}>OS</span></div>
          <span style={{fontSize:11,color:'#4b5563',marginLeft:'auto'}}>{NAV.find(n=>n.id===page)?.label}</span>
        </div>
      )}

      {/* Sidebar overlay on mobile */}
      {isMobile&&menuOpen&&<div onClick={()=>setMenuOpen(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',zIndex:55}}/>}

      {/* Sidebar */}
      <div style={{
        width:isMobile?260:220,background:'#0a0a0f',borderRight:'1px solid #1a1a25',display:'flex',flexDirection:'column',flexShrink:0,
        ...(isMobile?{position:'fixed',top:0,bottom:0,left:menuOpen?0:-280,zIndex:60,transition:'left .2s ease',boxShadow:menuOpen?'4px 0 20px rgba(0,0,0,.5)':'none'}:{})
      }}>
        <div style={{padding:'24px 20px 20px',borderBottom:'1px solid #1a1a25'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div>
              <div style={{fontSize:15,fontWeight:800,letterSpacing:-.5}}>Cognition <span style={{color:'#6366f1'}}>OS</span></div>
              <div style={{fontSize:10,color:'#374151',marginTop:2,letterSpacing:'.1em',textTransform:'uppercase'}}>Alpha · v0.1</div>
            </div>
            {isMobile&&<button onClick={()=>setMenuOpen(false)} style={{background:'#1e1e2e',border:'none',color:'#64748b',borderRadius:6,padding:'4px 8px',cursor:'pointer',fontSize:14}}>✕</button>}
          </div>
        </div>
        <nav style={{padding:'12px 10px',flex:1,overflow:'auto'}}>
          {NAV.map(n=>(
            <button key={n.id} onClick={()=>navPage(n.id)} style={{width:'100%',textAlign:'left',background:page===n.id?'#1a1a2e':'transparent',border:'none',borderRadius:8,padding:isMobile?'11px 14px':'9px 12px',color:page===n.id?'#e2e8f0':'#4b5563',fontSize:isMobile?14:13,fontWeight:page===n.id?700:400,cursor:'pointer',display:'flex',alignItems:'center',gap:10,marginBottom:2,transition:'all .15s'}}>
              <span style={{fontSize:isMobile?18:15}}>{n.icon}</span>{n.label}
              {page===n.id&&<span style={{marginLeft:'auto',width:4,height:4,borderRadius:'50%',background:'#6366f1'}}/>}
            </button>
          ))}
        </nav>
        <div style={{padding:'14px 16px',borderTop:'1px solid #1a1a25'}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}><StatusDot status="active"/><span style={{fontSize:11,color:'#374151'}}>System nominal</span></div>
          <div style={{fontSize:10,color:'#1e293b',marginTop:3}}>2 agents active · 0 errors</div>
        </div>
      </div>
      <div style={{flex:1,overflow:'auto',padding:isMobile?'60px 16px 16px':'32px 36px',background:'#0d0d10'}}>{pages[page]}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
