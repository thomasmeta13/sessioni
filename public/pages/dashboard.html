function renderMd(text){
  const lines=text.split('\n');const els=[];let trows=[];let inT=false;let k=0;
  const flushT=()=>{if(trows.length){els.push(<table key={k++}><tbody>{trows}</tbody></table>);trows=[];}inT=false;};
  lines.forEach(line=>{
    if(line.startsWith('| ')){inT=true;if(line.includes('---'))return;const cells=line.split('|').filter(c=>c.trim()).map(c=>c.trim());const isH=trows.length===0;trows.push(<tr key={k++}>{cells.map((c,i)=>isH?<th key={i}>{c}</th>:<td key={i}>{c}</td>)}</tr>);}
    else{if(inT)flushT();if(line.startsWith('# '))els.push(<h1 key={k++}>{line.slice(2)}</h1>);else if(line.startsWith('## '))els.push(<h2 key={k++}>{line.slice(3)}</h2>);else if(line.startsWith('- ')){const parts=line.slice(2).split(/(\*\*.*?\*\*)/).map((p,i)=>p.startsWith('**')?<strong key={i}>{p.slice(2,-2)}</strong>:p);els.push(<ul key={k++}><li>{parts}</li></ul>);}else if(line.trim())els.push(<p key={k++} style={{marginBottom:4}}>{line}</p>);}
  });if(inT)flushT();return els;
}

function edgePath(from,to,curve=35){
  const mx=(from.x+to.x)/2,my=(from.y+to.y)/2;
  const dx=to.x-from.x,dy=to.y-from.y,len=Math.sqrt(dx*dx+dy*dy)||1;
  const nx=-dy/len*curve*.5,ny=dx/len*curve*.5;
  return`M${from.x},${from.y} Q${mx+nx},${my+ny} ${to.x},${to.y}`;
}

    const spawnTransfer=()=>{
      const t=SKILL_TRANSFERS[Math.floor(Math.random()*SKILL_TRANSFERS.length)];
      const id=transferIdRef.current++;
      setTransfers(prev=>[...prev,{...t,id,progress:0}]);
      // animate progress 0→1 over 1.8s
      const start=Date.now();
      const dur=1800;
      const tick=()=>{
        const p=Math.min(1,(Date.now()-start)/dur);
        setTransfers(prev=>prev.map(x=>x.id===id?{...x,progress:p}:x));
        if(p<1)requestAnimationFrame(tick);
        else setTransfers(prev=>prev.filter(x=>x.id!==id));
      };
      requestAnimationFrame(tick);
    };
    const interval=setInterval(spawnTransfer,2200);
    spawnTransfer();
    return()=>clearInterval(interval);
  },[]);

  useEffect(()=>{
    const ids=AGENTS.map(a=>a.id);

            const isHov=hovered===a.id;
            const isAct=a.status==='active';
            const bubble=bubbles[a.id];
            const bw=148,bh=24;
            const bx=p.x-bw/2;
            const bubUp=p.y>220;
            const by=bubUp?p.y-54:p.y+34;
            return(
              <g key={a.id} style={{cursor:'pointer'}} onMouseEnter={()=>setHovered(a.id)} onMouseLeave={()=>setHovered(null)} onClick={()=>onOpenModal(a)}>
                <circle cx={p.x} cy={p.y} r={isHov?46:30} fill={`url(#g-${a.id})`} opacity={isHov?1:.55}/>
                {isAct&&<circle cx={p.x} cy={p.y} r={24} fill="none" stroke={a.color} strokeWidth={1} strokeOpacity={.3} strokeDasharray="3 4"><animateTransform attributeName="transform" type="rotate" from={`0 ${p.x} ${p.y}`} to={`360 ${p.x} ${p.y}`} dur="9s" repeatCount="indefinite"/></circle>}
                <circle cx={p.x} cy={p.y} r={20} fill="none" stroke={a.color} strokeWidth={isHov?2:1} strokeOpacity={isHov?.9:.4} filter={isHov?"url(#glow)":"none"}/>
                <circle cx={p.x} cy={p.y} r={14} fill={a.color} fillOpacity={isHov?.28:.1}/>
                <circle cx={p.x} cy={p.y} r={6} fill={a.color} filter="url(#glow)"/>
                <text x={p.x} y={p.y+4} textAnchor="middle" fontSize={9}>{a.icon}</text>
                <text x={p.x} y={p.y+36} textAnchor="middle" fontSize={10} fontWeight={isHov?700:500} fill={isHov?a.color:'#94a3b8'} filter={isHov?"url(#glow)":"none"}>{a.name.toUpperCase()}</text>
                <text x={p.x} y={p.y+48} textAnchor="middle" fontSize={8} fill="#4b5563">{a.role}</text>
                {/* Chat bubble */}
                {bubble&&(
                  <g className="bubble-fade">
                    <rect x={bx} y={by} width={bw} height={bh} rx={5} fill="#1a1a2e" stroke={a.color} strokeWidth={1} strokeOpacity={.7}/>
                    <text x={p.x} y={by+16} textAnchor="middle" fontSize={9} fill={a.color} fontWeight={600}>{bubble.length>22?bubble.slice(0,21)+'…':bubble}</text>
                    {bubUp
                      ?<polygon points={`${p.x-4},${by+bh} ${p.x+4},${by+bh} ${p.x},${by+bh+5}`} fill="#1a1a2e"/>
                      :<polygon points={`${p.x-4},${by} ${p.x+4},${by} ${p.x},${by-5}`} fill="#1a1a2e"/>}
                  </g>
                )}
              </g>
            );
          })}

          {/* Hover edge labels */}
          {hovered&&EDGES.filter(e=>e.from===hovered||e.to===hovered).map((e,i)=>{
            const from=NODE_POS[e.from],to=NODE_POS[e.to];
            const mx=(from.x+to.x)/2,my=(from.y+to.y)/2;
            const fa=AGENTS.find(a=>a.id===e.from);
            return<g key={i}><rect x={mx-26} y={my-9} width={52} height={14} rx={4} fill="#0d0d10" fillOpacity={.9}/><text x={mx} y={my+1} textAnchor="middle" fontSize={8} fill={fa.color} fontWeight={600}>{e.label}</text></g>;
          })}

          {/* Skill transfer pulses — slime mold bleed */}
          {transfers.map(tr=>{
            const from=NODE_POS[tr.from],to=NODE_POS[tr.to];
            if(!from||!to)return null;
            const p=tr.progress;
            // quadratic bezier midpoint
            const mx=(from.x+to.x)/2,my=(from.y+to.y)/2;
            const dx=to.x-from.x,dy=to.y-from.y,len=Math.sqrt(dx*dx+dy*dy)||1;
            const cx=mx-dy*.15,cy=my+dx*.15;
            const t1=1-p;
            const px=t1*t1*from.x+2*t1*p*cx+p*p*to.x;
            const py=t1*t1*from.y+2*t1*p*cy+p*p*to.y;
            const opacity=p<.15?p/.15:p>.85?(1-p)/.15:1;
            // ripple at destination when arriving
            const arriving=p>.85;
            const rippleR=(p-.85)/.15*22;
            return(
              <g key={tr.id}>
                {/* Path glow trail */}
                <path d={`M${from.x},${from.y} Q${cx},${cy} ${to.x},${to.y}`}
                  fill="none" stroke={tr.color} strokeWidth={3} strokeOpacity={opacity*.25}
                  strokeDasharray={`${p*len*1.1} ${len*1.1}`}/>
                {/* Moving orb */}
                <circle cx={px} cy={py} r={7} fill={tr.color} fillOpacity={opacity*.7}
                  style={{filter:`drop-shadow(0 0 8px ${tr.color})`}}/>
                <circle cx={px} cy={py} r={3.5} fill="white" fillOpacity={opacity*.9}/>
                {/* Skill label on orb */}
                {p>.2&&p<.8&&(
                  <g>
                    <rect x={px-30} y={py-20} width={60} height={13} rx={4} fill="#0a0a14" fillOpacity={.85}/>
                    <text x={px} y={py-11} textAnchor="middle" fontSize={8} fill={tr.color} fontWeight={700}>{tr.skill}</text>
                  </g>
                )}
                {/* Ripple at destination */}
                {arriving&&(
                  <>
                    <circle cx={to.x} cy={to.y} r={rippleR} fill="none" stroke={tr.color} strokeWidth={1.5} strokeOpacity={(1-p/.15)*0.8}/>
                    <circle cx={to.x} cy={to.y} r={rippleR*.6} fill={tr.color} fillOpacity={.12}/>
                  </>
                )}
              </g>
            );
          })}
        </svg>
      </div>

      {/* Live skill transfer feed */}
      <div style={{background:'#0a0a0f',border:'1px solid #1a1a25',borderRadius:10,padding:'10px 16px',marginTop:10,display:'flex',gap:12,alignItems:'center',flexWrap:'wrap',minHeight:36}}>
        <span style={{fontSize:10,fontWeight:700,color:'#2d2d3a',textTransform:'uppercase',letterSpacing:'.1em',flexShrink:0}}>Skill flow</span>
        {transfers.map(tr=>{
          const fa=AGENTS.find(a=>a.id===tr.from);
          const ta=AGENTS.find(a=>a.id===tr.to);
          if(!fa||!ta)return null;
          return(
            <div key={tr.id} style={{display:'flex',alignItems:'center',gap:5,background:tr.color+'15',border:`1px solid ${tr.color}33`,borderRadius:6,padding:'3px 8px',fontSize:10}}>
              <span style={{color:fa.color}}>{fa.icon}</span>
              <span style={{color:'#4b5563'}}>→</span>
              <span style={{color:tr.color,fontWeight:700}}>{tr.skill}</span>
              <span style={{color:'#4b5563'}}>→</span>
              <span style={{color:ta.color}}>{ta.icon}</span>
            </div>
          );
        })}
        {transfers.length===0&&<span style={{fontSize:10,color:'#1e1e2e'}}>waiting for transfer...</span>}
      </div>

      <div style={{textAlign:'center',marginTop:7,fontSize:11,color:'#2d2d3a'}}>Click any node · Chat bubbles + skill transfers stream live · Slime mold protocol active</div>
    </div>
  );
}

                <div style={{height:100,display:'flex',alignItems:'center',justifyContent:'center',position:'relative',background:'linear-gradient(135deg,rgba(99,102,241,.08),rgba(139,92,246,.05))',borderBottom:'1px solid #1e1e2e'}}>

        ))}
      </div>
    </div>
  );
}

// ── DECISION MAP ──────────────────────────────────────────────────────────────
function DecisionMapPage(){
  const[zoom,setZoom]=useState(1);
  const W=900,H=510;
  const vbW=W/zoom,vbH=H/zoom,vbX=(W-vbW)/2,vbY=(H-vbH)/2;
  const rootX=450,rootY=75,branchY=265;
  const opts=[
    {id:'A',title:'Build artifact layer first',prob:62,confidence:'High',  impact:'Moderate', cost:'Low',   color:'#6366f1',agents:['analyst','synthesizer','orchestrator'],rec:true, x:155},
    {id:'B',title:'Wire live agent execution', prob:48,confidence:'Medium',impact:'High',     cost:'Medium',color:'#10b981',agents:['builder','critic','synthesizer'],        rec:false,x:450},
    {id:'C',title:'Launch economic layer',     prob:25,confidence:'Low',   impact:'Very High',cost:'High',  color:'#f59e0b',agents:['critic','orchestrator'],                 rec:false,x:745},
  ];
  const zoomLevels=[{z:.7,label:'70%'},{z:1,label:'100%'},{z:1.4,label:'140%'},{z:1.8,label:'180%'}];
  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20}}>
        <div><h1 style={{fontSize:22,fontWeight:800,marginBottom:4}}>Decision Map</h1><p style={{color:'#64748b',fontSize:13}}>Flow intensity = probability · highest flow = recommended path</p></div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <span style={{fontSize:11,color:'#4b5563',marginRight:2}}>Zoom</span>
          {zoomLevels.map(l=><button key={l.z} className={`zoom-btn${zoom===l.z?' active':''}`} onClick={()=>setZoom(l.z)}>{l.label}</button>)}
        </div>
      </div>
      <div style={{background:'#060610',border:'1px solid #1a1a28',borderRadius:16,overflow:'hidden',marginBottom:16}}>
        <svg viewBox={`${vbX} ${vbY} ${vbW} ${vbH}`} width="100%" style={{display:'block',transition:'all .4s ease'}}>
          <defs>
            <filter id="gd"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="gd2"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            {opts.map(o=><linearGradient key={o.id} id={`dl-${o.id}`} x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stopColor={o.color} stopOpacity=".35"/><stop offset="100%" stopColor={o.color} stopOpacity=".02"/></linearGradient>)}
          </defs>
          {Array.from({length:55},(_,i)=><circle key={i} cx={(i*173+20)%W} cy={(i*111+10)%H} r={.7} fill="white" opacity={.05}/>)}

          {/* Flowing paths */}
          {opts.map(o=>{
            const pathD=`M${rootX},${rootY+30} C${rootX},${rootY+130} ${o.x},${branchY-90} ${o.x},${branchY}`;
            const numP=Math.round(o.prob/16); // 1-4
            const dur=4.2-(o.prob/100)*2.2;
            const sw=.8+(o.prob/100)*3.5;
            return(
              <g key={o.id}>
                {/* Glow aura */}
                <path d={pathD} fill="none" stroke={o.color} strokeWidth={sw*4} strokeOpacity={.05} filter="url(#gd2)"/>
                {/* Main path */}
                <path d={pathD} fill="none" stroke={o.color} strokeWidth={sw} strokeOpacity={o.rec?.6:.3}/>
                {/* Recommended star */}
                {o.rec&&<>
                  <rect x={o.x-45} y={branchY-20} width={90} height={16} rx={8} fill={o.color} fillOpacity={.2} stroke={o.color} strokeWidth={1} strokeOpacity={.6}/>
                  <text x={o.x} y={branchY-9} textAnchor="middle" fontSize={8} fill={o.color} fontWeight={700}>★ RECOMMENDED</text>
                </>}
                {/* Particles */}
                {Array.from({length:numP},(_,pi)=>(
                  <circle key={pi} r={3} fill={o.color} opacity={.9} filter="url(#gd)">
                    <animateMotion dur={`${dur}s`} repeatCount="indefinite" begin={`${(pi/numP)*dur}s`} path={pathD}/>
                  </circle>
                ))}
              </g>
            );
          })}

          {/* Root */}
          <rect x={rootX-130} y={rootY-28} width={260} height={58} rx={8} fill="#13131a" stroke="#6366f133" strokeWidth={1}/>
          <circle cx={rootX-108} cy={rootY-8} r={4} fill="#10b981" opacity={.9}><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
          <text x={rootX} y={rootY+4} textAnchor="middle" fontSize={12} fontWeight={700} fill="#e2e8f0">Current Artifact State</text>
          <text x={rootX} y={rootY+19} textAnchor="middle" fontSize={9} fill="#64748b">v0.1 · Synthesis Phase · Active</text>

          {/* Option cards */}
          {opts.map(o=>{
            const bw=220,bh=198,bx=o.x-bw/2,by=branchY+5;
            const agents=o.agents.map(id=>AGENTS.find(a=>a.id===id)).filter(Boolean);
            return(
              <g key={o.id}>
                <rect x={bx} y={by} width={bw} height={bh} rx={10} fill="#13131a" stroke={o.color} strokeWidth={o.rec?1.5:1} strokeOpacity={o.rec?.7:.3}/>
                <rect x={bx} y={by} width={bw} height={bh} rx={10} fill={`url(#dl-${o.id})`} opacity={.18}/>
                <text x={o.x} y={by+24} textAnchor="middle" fontSize={14} fontWeight={800} fill={o.color} filter="url(#gd)">Option {o.id}</text>
                <text x={o.x} y={by+40} textAnchor="middle" fontSize={9} fill="#94a3b8">{o.title}</text>
                {[['Probability',`${o.prob}%`,o.color],['Confidence',o.confidence,o.confidence==='High'?'#10b981':o.confidence==='Medium'?'#f59e0b':'#ef4444'],['Impact',o.impact,'#94a3b8'],['Cost',o.cost,'#94a3b8']].map(([l,v,vc],i)=>(
                  <g key={l}><text x={bx+14} y={by+62+i*27} fontSize={10} fill="#4b5563">{l}</text><text x={bx+bw-14} y={by+62+i*27} textAnchor="end" fontSize={10} fontWeight={700} fill={vc}>{v}</text><line x1={bx+14} y1={by+66+i*27} x2={bx+bw-14} y2={by+66+i*27} stroke="#1e1e2e" strokeWidth={.5}/></g>
                ))}
                {agents.map((a,i)=><g key={a.id}><circle cx={bx+18+i*27} cy={by+bh-22} r={9} fill={a.color} fillOpacity={.2} stroke={a.color} strokeWidth={1} strokeOpacity={.5}/><text x={bx+18+i*27} y={by+bh-18} textAnchor="middle" fontSize={8}>{a.icon}</text></g>)}
              </g>
            );
          })}
        </svg>
      </div>
      <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:18}}>
        <div style={{fontSize:12,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:10}}>Orchestrator Recommendation</div>
        <div style={{fontSize:13,color:'#64748b',lineHeight:1.7}}>Highest flow on <span style={{color:'#6366f1',fontWeight:600}}>Option A (62%)</span> reflects current confidence. Suggested sequence: <span style={{color:'#6366f1'}}>A</span> → <span style={{color:'#10b981'}}>B</span> → <span style={{color:'#f59e0b'}}>C</span> as system confidence accumulates.</div>
      </div>
    </div>
  );
}

// ── ARTIFACT STATE ────────────────────────────────────────────────────────────
function ArtifactPage(){
  const[sel,setSel]=useState(CURRENT_PHASE);
  const phase=PHASE_DATA[sel];
  const phaseColor=(i)=>i<CURRENT_PHASE?'#10b981':i===CURRENT_PHASE?'#6366f1':'#1e1e2e';
  return(
    <div>
      <div style={{marginBottom:20}}><h1 style={{fontSize:22,fontWeight:800,marginBottom:4}}>Artifact State</h1><p style={{color:'#64748b',fontSize:13}}>Click any phase to inspect its state · future phases are locked</p></div>

      {/* Phase tracker */}
      <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:14,padding:'24px 24px 20px',marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center'}}>
          {PHASE_DATA.map((p,i)=>{
            const done=i<CURRENT_PHASE,active=i===CURRENT_PHASE,isLocked=p.locked,isSel=i===sel;
            return(
              <React.Fragment key={p.id}>
                <div className="phase-btn" style={{textAlign:'center',minWidth:80,opacity:isLocked?.3:1}} onClick={()=>!isLocked&&setSel(i)}>
                  <div className="phase-circle" style={{
                    width:30,height:30,borderRadius:'50%',margin:'0 auto 6px',
                    background:isSel?'#fff':done?'#10b981':active?'#6366f1':'#1e1e2e',
                    border:`2px solid ${isSel?'#fff':phaseColor(i)}`,
                    display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,color:isSel?'#000':done?'#000':active?'#fff':'#374151',
                    boxShadow:isSel?`0 0 18px rgba(255,255,255,.4)`:active?'0 0 14px #6366f1':'none',
                    fontWeight:700,
                  }}>
                    {isLocked?'🔒':done?'✓':active?'●':'○'}
                  </div>
                  <div style={{fontSize:9,fontWeight:700,color:isSel?'#e2e8f0':done?'#10b981':active?'#6366f1':'#374151',letterSpacing:'.05em'}}>{p.label.toUpperCase()}</div>
                  <div style={{fontSize:9,color:isSel?'#64748b':'#2d2d3a',marginTop:1}}>{p.time}</div>
                </div>
                {i<PHASE_DATA.length-1&&<div style={{flex:1,height:2,background:i<CURRENT_PHASE?'#10b981':'#1e1e2e',margin:'0 0 22px',transition:'background .3s'}}/>}
              </React.Fragment>
            );
          })}
        </div>
      </div>

      {/* Phase content */}
      {phase.locked?(
        <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:48,textAlign:'center'}}>
          <div style={{fontSize:32,marginBottom:12}}>🔒</div>
          <div style={{fontWeight:700,color:'#e2e8f0',marginBottom:6}}>{phase.label} phase is locked</div>
          <div style={{fontSize:13,color:'#4b5563'}}>This phase hasn't started yet. Complete earlier phases to unlock.</div>
        </div>
      ):(
        <div>
          {/* Summary */}
          <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:20,marginBottom:14}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
              {phase.current&&<span className="live-dot"/>}
              <span style={{fontSize:11,fontWeight:700,color:phase.current?'#6366f1':'#10b981',textTransform:'uppercase',letterSpacing:'.1em'}}>{phase.label} {phase.current?'· Live':''}</span>
              <span style={{fontSize:11,color:'#374151',marginLeft:'auto'}}>{phase.time}</span>
            </div>
            <div style={{fontSize:13,color:'#94a3b8',lineHeight:1.7,marginBottom:phase.note?10:0}}>{phase.summary}</div>
            {phase.note&&<div style={{fontSize:12,color:'#64748b',fontStyle:'italic',borderTop:'1px solid #1e1e2e',paddingTop:10}}>📝 {phase.note}</div>}
          </div>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
            {/* Decisions */}
            <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:18}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                <span style={{color:'#10b981'}}>✓</span>
                <span style={{fontSize:11,color:'#4b5563',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em'}}>Decisions Made</span>
                <Badge color="#10b981">{phase.decisions?.length||0}</Badge>
              </div>
              {(phase.decisions||[]).map((d,i)=><div key={i} style={{display:'flex',gap:8,marginBottom:8,fontSize:12,color:'#94a3b8'}}><span style={{color:'#10b981',fontSize:10,marginTop:2,flexShrink:0}}>●</span>{d}</div>)}
              {!phase.decisions?.length&&<div style={{fontSize:12,color:'#374151'}}>No decisions recorded yet.</div>}
            </div>
            {/* Questions */}
            <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:18}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                <span style={{color:'#f59e0b'}}>?</span>
                <span style={{fontSize:11,color:'#4b5563',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em'}}>Open Questions</span>
                <Badge color="#f59e0b">{phase.questions?.length||0}</Badge>
              </div>
              {(phase.questions||[]).map((q,i)=><div key={i} style={{display:'flex',gap:8,marginBottom:8,fontSize:12,color:'#94a3b8'}}><span style={{color:'#f59e0b',fontSize:10,marginTop:2,flexShrink:0}}>●</span>{q}</div>)}
              {!phase.questions?.length&&<div style={{fontSize:12,color:'#374151'}}>No open questions.</div>}
            </div>
          </div>

          {/* Confidence + Contributors */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
            <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:18}}>
              <div style={{fontSize:11,color:'#4b5563',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:12}}>Phase Confidence</div>
              <div style={{display:'flex',alignItems:'center',gap:14}}>
                <svg viewBox="0 0 64 64" width="64" height="64" style={{flexShrink:0}}>
                  <circle cx="32" cy="32" r="26" fill="none" stroke="#1e1e2e" strokeWidth="5"/>
                  <circle cx="32" cy="32" r="26" fill="none" stroke={phase.confidence>.7?'#10b981':'#f59e0b'} strokeWidth="5"
                    strokeDasharray={`${2*Math.PI*26*phase.confidence} ${2*Math.PI*26}`}
                    strokeLinecap="round" transform="rotate(-90 32 32)"
                    style={{filter:`drop-shadow(0 0 5px ${phase.confidence>.7?'#10b981':'#f59e0b'})`}}/>
                  <text x="32" y="37" textAnchor="middle" fontSize="13" fontWeight="800" fill="#e2e8f0">{Math.round(phase.confidence*100)}%</text>
                </svg>
                <div>
                  <div style={{fontSize:22,fontWeight:800,color:phase.confidence>.7?'#10b981':'#f59e0b'}}>{Math.round(phase.confidence*100)}%</div>
                  <div style={{fontSize:11,color:'#64748b'}}>{phase.confidence>.7?'Strong agreement':'Building consensus'}</div>
                </div>
              </div>
            </div>
            <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:18}}>
              <div style={{fontSize:11,color:'#4b5563',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:12}}>Active In This Phase</div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {(phase.contributors||[]).map(id=>{const a=AGENTS.find(x=>x.id===id);return a?(
                  <div key={id} style={{display:'flex',alignItems:'center',gap:6,background:'#0d0d10',border:`1px solid ${a.color}33`,borderRadius:7,padding:'5px 10px'}}>
                    <span style={{fontSize:13}}>{a.icon}</span>
                    <span style={{fontSize:12,fontWeight:600,color:a.color}}>{a.name}</span>
                  </div>
                ):null;})}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

                {a&&<Badge color={a.color}>{a.icon} {a.name}</Badge>}
              </div>
              {/* Progress */}
              <div style={{fontSize:11,color:'#4b5563',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:6}}>Progress</div>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
                <div style={{flex:1,background:'#0d0d10',borderRadius:4,height:6,overflow:'hidden'}}>
                  <div style={{width:`${task.progress}%`,height:'100%',background:`linear-gradient(90deg,${a?.color||'#6366f1'},#a855f7)`,borderRadius:4}}/>
                </div>
                <span style={{fontSize:13,fontWeight:700,color:a?.color||'#6366f1'}}>{task.progress}%</span>
              </div>
              {/* Log */}
              <div style={{fontSize:11,color:'#4b5563',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:8}}>Activity Log</div>
              {task.log.length===0
                ?<div style={{fontSize:12,color:'#374151'}}>No activity yet — task queued.</div>
                :task.log.map((l,i)=>(
                  <div key={i} style={{display:'flex',gap:8,marginBottom:7,fontSize:12,color:'#94a3b8'}}>
                    <span style={{color:a?.color||'#6366f1',fontSize:10,marginTop:2,flexShrink:0}}>●</span>{l}
                  </div>
                ))
              }
            </div>
          );
        })()}
      </div>
      {/* Event stream */}
      <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:20}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
          <span className="live-dot"/>
          <span style={{fontSize:11,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'.08em'}}>Event Stream</span>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:0}}>
          {EVENTS.map((e,i)=>{
            const a=AGENTS.find(x=>x.id===e.agent);
            const ec=EVENT_COLOR[e.type]||'#64748b';
            return(
              <div key={i} style={{display:'flex',gap:12,padding:'8px 0',borderBottom:i<EVENTS.length-1?'1px solid #0f0f18':'none',alignItems:'flex-start'}}>
                <span style={{fontSize:10,color:'#374151',width:36,flexShrink:0,paddingTop:2,fontFamily:'monospace'}}>{e.time}</span>
                <div style={{width:18,height:18,borderRadius:4,background:ec+'22',border:`1px solid ${ec}44`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  <span style={{fontSize:8}}>{a?.icon||'◈'}</span>
                </div>
                <div style={{flex:1}}>
                  <span style={{fontSize:11,fontWeight:700,color:a?.color||'#64748b'}}>{a?.name||e.agent}</span>
                  <span style={{fontSize:11,color:'#4b5563',margin:'0 6px'}}>·</span>
                  <span style={{fontSize:11,color:'#94a3b8'}}>{e.msg}</span>
                </div>
                <span style={{fontSize:9,color:ec,fontWeight:700,background:ec+'15',border:`1px solid ${ec}33`,borderRadius:4,padding:'1px 6px',flexShrink:0}}>{e.type}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

const TAG_COLOR={Building:'#6366f1',Create:'#ec4899',Research:'#06b6d4',Personal:'#a855f7',Finance:'#f97316'};

function IdeasPage(){
  const canvasRef=useRef(null);
  const[sel,setSel]=useState(null);
  const[filter,setFilter]=useState('All');
  const tags=['All','Building','Create','Research','Personal','Finance'];
  const nodesRef=useRef({nodes:[],edges:[]});
  const timeRef=useRef(0);
  const PANEL_W=300;

  // Build node list from IDEAS
  useEffect(()=>{
    const W=1050,H=580;
    const filtered2=filter==='All'?IDEAS:IDEAS.filter(i=>i.tag===filter);
    const nodes=[];
    const edges=[];
    filtered2.forEach((idea,i)=>{
      const angle=(i/filtered2.length)*Math.PI*2 - Math.PI/2;
      const r=230;
      nodes.push({id:idea.id,type:'topic',label:idea.title,tag:idea.tag,color:idea.color,r:36+idea.depth*6,
        x:W/2+Math.cos(angle)*r,y:H/2+Math.sin(angle)*r,vx:0,vy:0,idea});
      idea.subs.forEach((s,j)=>{
        const sid=`${idea.id}_s${j}`;
        const spread=Math.min(1.6, idea.subs.length*0.25);
        const sa=angle+(-spread/2+(j/(Math.max(idea.subs.length-1,1)))*spread);
        const sr=380+j*22;
        const typeR=s.type==='research'?10:12; // bigger hit targets
        nodes.push({id:sid,type:'sub',label:s.title,color:idea.color,r:typeR,
          done:s.done,status:s.status,subType:s.type||'task',
          x:W/2+Math.cos(sa)*sr,y:H/2+Math.sin(sa)*sr,vx:0,vy:0,parent:idea.id});
        edges.push({from:idea.id,to:sid,color:idea.color,strength:.55});
      });
    });
    const crosses=[['i1','i3'],['i1','i4'],['i4','i7'],['i5','i6']];
    crosses.forEach(([a,b])=>{ if(nodes.find(n=>n.id===a)&&nodes.find(n=>n.id===b)) edges.push({from:a,to:b,color:'#2d2d3a',strength:.18,cross:true}); });
    nodesRef.current={nodes,edges,W,H};
  },[filter]);

  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    let raf;
    const draw=(t)=>{
      timeRef.current=t;
      const{nodes,edges,W,H}=nodesRef.current||{nodes:[],edges:[],W:900,H:520};
      ctx.clearRect(0,0,W,H);
      // Background
      ctx.fillStyle='#060610';ctx.fillRect(0,0,W,H);
      // Stars
      for(let i=0;i<60;i++){ctx.beginPath();ctx.arc((i*137)%W,(i*97)%H,.7,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${.03+i%4*.01})`;ctx.fill();}

      // Spring layout
      const nodeMap={};nodes.forEach(n=>nodeMap[n.id]=n);
      edges.forEach(e=>{
        const a=nodeMap[e.from],b=nodeMap[e.to];if(!a||!b)return;
        const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
        const target=e.cross?360:160,force=(dist-target)*0.008*e.strength;
        a.vx+=dx/dist*force;a.vy+=dy/dist*force;
        b.vx-=dx/dist*force;b.vy-=dy/dist*force;
      });
      // Repulsion — much stronger, bigger radius
      for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i],b=nodes[j];
        const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
        const minDist=a.type==='topic'&&b.type==='topic'?200:120;
        if(dist<minDist){const f=((minDist-dist)/minDist)*1.4;a.vx-=dx/dist*f;a.vy-=dy/dist*f;b.vx+=dx/dist*f;b.vy+=dy/dist*f;}
      }
      // Weak center pull
      nodes.forEach(n=>{n.vx+=(W/2-n.x)*0.001;n.vy+=(H/2-n.y)*0.001;});
      // Dampen + apply
      nodes.forEach(n=>{n.vx*=.85;n.vy*=.85;n.x+=n.vx;n.y+=n.vy;n.x=Math.max(n.r+20,Math.min(W-n.r-20,n.x));n.y=Math.max(n.r+20,Math.min(H-n.r-20,n.y));});

      // Draw edges
      edges.forEach(e=>{
        const a=nodeMap[e.from],b=nodeMap[e.to];if(!a||!b)return;
        const pulse=0.25+0.3*Math.sin(t/900+a.x/120);
        // Curved path — slight arc
        const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
        const dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy)||1;
        const curvature=e.cross?0.18:0.12;
        const cx=mx-dy*curvature,cy=my+dx*curvature;
        // Glow layer
        if(!e.cross){
          ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(cx,cy,b.x,b.y);
          ctx.strokeStyle=e.color+'22';ctx.lineWidth=6;ctx.stroke();
        }
        // Main line
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(cx,cy,b.x,b.y);
        ctx.strokeStyle=e.cross?`rgba(50,50,70,${pulse*0.6})`:`${e.color}${Math.round(pulse*255).toString(16).padStart(2,'0')}`;
        ctx.lineWidth=e.cross?.8:1.5;ctx.stroke();
        // Particle on curve
        if(!e.cross){
          const p=(t/1400+a.x/400)%1;
          const t1=1-p;
          const px=t1*t1*a.x+2*t1*p*cx+p*p*b.x;
          const py=t1*t1*a.y+2*t1*p*cy+p*p*b.y;
          ctx.beginPath();ctx.arc(px,py,2.5,0,Math.PI*2);
          ctx.fillStyle=e.color;ctx.globalAlpha=.9;ctx.fill();ctx.globalAlpha=1;
          // Small trail
          const p2=Math.max(0,p-.06);const t2=1-p2;
          const px2=t2*t2*a.x+2*t2*p2*cx+p2*p2*b.x,py2=t2*t2*a.y+2*t2*p2*cy+p2*p2*b.y;
          ctx.beginPath();ctx.arc(px2,py2,1.2,0,Math.PI*2);
          ctx.fillStyle=e.color;ctx.globalAlpha=.4;ctx.fill();ctx.globalAlpha=1;
        }
      });

      // Draw nodes
      nodes.forEach(n=>{
        const isSel=sel===n.id;
        const pulse=0.4+0.25*Math.sin(t/600+n.x/80);
        if(n.type==='topic'){
          // Glow
          ctx.beginPath();ctx.arc(n.x,n.y,n.r+10,0,Math.PI*2);
          const g=ctx.createRadialGradient(n.x,n.y,n.r*.3,n.x,n.y,n.r+10);
          g.addColorStop(0,n.color+'55');g.addColorStop(1,'transparent');
          ctx.fillStyle=g;ctx.fill();
          // Ring
          ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
          ctx.strokeStyle=isSel?n.color:`${n.color}${Math.round(pulse*255).toString(16).padStart(2,'0')}`;
          ctx.lineWidth=isSel?3:1.8;ctx.stroke();
          ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
          ctx.fillStyle=n.color+(isSel?'50':'20');ctx.fill();
          // Label — up to 3 words, centered
          ctx.fillStyle=isSel?n.color:'#e2e8f0';
          ctx.font=`${isSel?700:600} ${n.r>40?11:10}px Inter,sans-serif`;
          ctx.textAlign='center';
          const words=n.label.split(' ');
          const lines=[];
          let cur='';
          words.forEach(w=>{if((cur+' '+w).trim().length>12&&cur){lines.push(cur);cur=w;}else{cur=(cur+' '+w).trim();}});
          if(cur)lines.push(cur);
          lines.slice(0,3).forEach((l,li)=>ctx.fillText(l,n.x,n.y+4-((lines.length-1)*6)+li*12));
        } else {
          // Sub-node style by status
          const sc={done:'filled',active:'ring-glow',queued:'ring'};
          ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
          const isSel2=sel===n.id;
          if(n.status==='done'){
            ctx.fillStyle=n.color+'88';ctx.fill();
            ctx.strokeStyle=n.color;ctx.lineWidth=1.5;ctx.stroke();
            ctx.fillStyle='white';ctx.font='bold 7px Inter';ctx.textAlign='center';ctx.fillText('✓',n.x,n.y+2.5);
          } else if(n.status==='active'){
            ctx.fillStyle=n.color+'30';ctx.fill();
            ctx.strokeStyle=n.color;ctx.lineWidth=isSel2?2:1.5;
            ctx.shadowBlur=8;ctx.shadowColor=n.color;ctx.stroke();ctx.shadowBlur=0;
          } else {
            ctx.fillStyle='#13131a';ctx.fill();
            ctx.strokeStyle=n.color+'55';ctx.lineWidth=1;ctx.stroke();
          }
          // Type indicator: research = dashed ring
          if(n.subType==='research'&&n.status!=='done'){
            ctx.beginPath();ctx.arc(n.x,n.y,n.r+3,0,Math.PI*2);
            ctx.strokeStyle=n.color+'44';ctx.lineWidth=1;ctx.setLineDash([2,3]);ctx.stroke();ctx.setLineDash([]);
          }
        }
      });

      raf=requestAnimationFrame(draw);
    };
    raf=requestAnimationFrame(draw);
    return()=>cancelAnimationFrame(raf);
  },[sel,filter]);

  const handleClick=(e)=>{
    const canvas=canvasRef.current;
    const rect=canvas.getBoundingClientRect();
    const scaleX=1050/rect.width;
    const mx=(e.clientX-rect.left)*scaleX,my=(e.clientY-rect.top)*scaleX;
    const{nodes}=nodesRef.current||{};
    if(!nodes)return;
    let hit=null;
    nodes.forEach(n=>{const dx=n.x-mx,dy=n.y-my;if(Math.sqrt(dx*dx+dy*dy)<n.r+8)hit=n;});
    setSel(hit?.id===sel?null:hit?.id||null);
  };

  const selNode=nodesRef.current?.nodes?.find(n=>n.id===sel);
  const selIdea=sel?IDEAS.find(i=>i.id===sel||(sel&&sel.startsWith(i.id+'_'))):null;
  const selSub=sel&&sel.includes('_s')?selIdea?.subs[parseInt(sel.split('_s')[1])]:null;
  const statusColor={done:'#10b981',active:'#6366f1',queued:'#4b5563'};

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexShrink:0}}>
        <div><h1 style={{fontSize:22,fontWeight:800,marginBottom:2}}>Ideas Graph</h1>
          <p style={{color:'#64748b',fontSize:13}}>Big nodes = topics · small nodes = tasks/research · click to inspect</p></div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',justifyContent:'flex-end'}}>
          {tags.map(t=><button key={t} onClick={()=>{setFilter(t);setSel(null);}} style={{background:filter===t?(TAG_COLOR[t]||'#6366f1'):'#13131a',border:`1px solid ${filter===t?(TAG_COLOR[t]||'#6366f1')+'88':'#1e1e2e'}`,color:filter===t?'#fff':'#4b5563',borderRadius:6,padding:'4px 10px',fontSize:11,fontWeight:600,cursor:'pointer'}}>{t}</button>)}
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 290px',gap:12,flex:1,minHeight:0}}>
        {/* Canvas */}
        <div style={{position:'relative',background:'#060610',border:'1px solid #1a1a28',borderRadius:14,overflow:'hidden'}}>
          <canvas ref={canvasRef} width={1050} height={580} style={{display:'block',width:'100%',height:'100%',cursor:'crosshair'}} onClick={handleClick}/>
          <div style={{position:'absolute',bottom:8,left:14,display:'flex',gap:12,alignItems:'center'}}>
            {[{c:'#6366f1',l:'Topic'},{'c':'#10b981','l':'Done'},{'c':'#4b5563','l':'Queued'}].map(x=>(
              <div key={x.l} style={{display:'flex',gap:5,alignItems:'center'}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:x.c}}/>
                <span style={{fontSize:9,color:'#374151'}}>{x.l}</span>
              </div>
            ))}
            <div style={{display:'flex',gap:5,alignItems:'center'}}>
              <div style={{width:10,height:4,border:'1px dashed #4b5563',borderRadius:1}}/>
              <span style={{fontSize:9,color:'#374151'}}>Research</span>
            </div>
          </div>
        </div>

        {/* Side panel */}
        <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:14,padding:18,overflow:'auto',display:'flex',flexDirection:'column',gap:14}}>
          {selIdea&&!selSub&&(
            <>

                  textAlign:'left',padding:'5px 10px',borderRadius:6,display:'flex',alignItems:'center',gap:5}}>
                ← <span style={{color:selIdea.color}}>{selIdea.title}</span>

                <div style={{fontSize:12,color:'#94a3b8',lineHeight:1.7,borderLeft:`2px solid ${selIdea.color}55`,paddingLeft:10,marginBottom:14}}>
                  {selSub.why||'No context added yet.'}

                <div style={{fontSize:10,fontWeight:700,color:'#4b5563',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:5}}>Part of</div>
