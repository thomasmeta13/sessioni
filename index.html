<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ikigai</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a10;--bg2:#12121c;--bg3:#1a1a28;
  --text:#d4d4e0;--text2:#8888a0;--text3:#55556a;
  --accent:#7c3aed;--accent2:#a78bfa;
  --green:#4ade80;--blue:#38bdf8;--amber:#fbbf24;--pink:#f472b6;--red:#ef4444;
  --radius:10px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;min-height:100vh}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}

/* Layout */
.app{max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{padding:24px 0 32px;display:flex;align-items:baseline;justify-content:space-between}
header h1{font-size:1.4rem;font-weight:600;letter-spacing:2px;color:var(--text)}
header span{font-size:0.75rem;color:var(--text3);letter-spacing:1px}

/* Project Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all 0.2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 20px rgba(124,58,237,0.08)}
.card-img{width:100%;height:140px;object-fit:cover;display:block;background:var(--bg3)}
.card-body-wrap{padding:16px 18px 18px}
.card-tag{font-size:0.65rem;text-transform:uppercase;letter-spacing:1.5px;padding:3px 8px;border-radius:4px;font-weight:600;display:inline-block;margin-bottom:10px}
.card h3{font-size:1rem;font-weight:600;margin-bottom:6px}
.card p{font-size:0.8rem;color:var(--text2);line-height:1.5}
.card-status{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:0.7rem;color:var(--text3)}
.card-status .dot{width:6px;height:6px;border-radius:50%}

/* Project Detail */
.detail{display:none}
.detail.active{display:block}
.back-btn{background:none;border:none;color:var(--text2);font-size:0.85rem;cursor:pointer;padding:8px 0;display:flex;align-items:center;gap:6px}
.back-btn:hover{color:var(--text)}
.detail-header{padding:20px 0 16px}
.detail-header h2{font-size:1.5rem;font-weight:600;margin-bottom:4px}
.detail-header .subtitle{font-size:0.85rem;color:var(--text2)}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--bg3);margin-bottom:24px}
.tab{padding:10px 18px;font-size:0.8rem;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}

/* Sections */
.section{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.section h4{font-size:0.75rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:14px}
.section p,.section li{font-size:0.85rem;line-height:1.7;color:var(--text2)}

/* Task list */
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.task:last-child{border-bottom:none}
.task-num{width:22px;height:22px;border-radius:50%;background:var(--bg3);color:var(--text3);font-size:0.7rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.task-body{flex:1}
.task-title{font-size:0.85rem;font-weight:500;margin-bottom:3px}
.task-desc{font-size:0.78rem;color:var(--text3);line-height:1.5}
.task-action{font-size:0.75rem;color:var(--green);margin-top:4px}
.task-priority{font-size:0.65rem;padding:2px 6px;border-radius:3px;margin-left:8px}
.p-high{background:rgba(239,68,68,0.12);color:var(--red)}
.p-med{background:rgba(251,191,36,0.12);color:var(--amber)}
.p-low{background:rgba(56,189,248,0.12);color:var(--blue)}

/* Notes */
.notes{white-space:pre-wrap;font-size:0.82rem;color:var(--text2);line-height:1.7;font-family:'SF Mono','Fira Code',monospace}

/* Links list */
.links{list-style:none}
.links li{padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.links li:last-child{border-bottom:none}
.links a{font-size:0.83rem}
.links .link-desc{font-size:0.75rem;color:var(--text3);margin-top:2px}

/* Reference gallery */
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ref-card{background:var(--bg);border:1px solid var(--bg3);border-radius:8px;overflow:hidden;transition:border-color 0.2s}
.ref-card:hover{border-color:var(--accent)}
.ref-card img{width:100%;height:130px;object-fit:cover;display:block;background:var(--bg3)}
.ref-card .ref-info{padding:10px 12px}
.ref-card .ref-title{font-size:0.8rem;font-weight:500;margin-bottom:4px}
.ref-card .ref-desc{font-size:0.72rem;color:var(--text3);line-height:1.4}
.ref-card .ref-tag{font-size:0.6rem;color:var(--accent2);margin-top:6px;display:inline-block}
.style-filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.style-btn{padding:6px 14px;font-size:0.75rem;border:1px solid var(--bg3);border-radius:20px;background:none;color:var(--text3);cursor:pointer;transition:all 0.15s}
.style-btn:hover,.style-btn.active{border-color:var(--accent);color:var(--accent2);background:rgba(124,58,237,0.08)}

/* Mobile */
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{white-space:nowrap;padding:10px 14px}
}
</style>
</head>

// Helpers
function task(n,title,desc,action,priority) {
  const pClass = priority==='high'?'p-high':priority==='med'?'p-med':'p-low';
  const pLabel = priority.toUpperCase();
  return `<div class="task">
    <div class="task-num">${n}</div>
    <div class="task-body">
      <div class="task-title">${title}<span class="task-priority ${pClass}">${pLabel}</span></div>
      <div class="task-desc">${desc}</div>
      <div class="task-action">→ ${action}</div>
    </div>
  </div>`;
}

// Render
const homeEl = document.getElementById('home');
const detailEl = document.getElementById('detail');

function showHome() {
  homeEl.style.display = 'grid';
  detailEl.className = 'detail';
  homeEl.innerHTML = PROJECTS.map(p => `
    <div class="card" onclick="showProject('${p.id}')">
      ${p.img ? `<img class="card-img" src="${p.img}" alt="${p.title}" onerror="this.style.display='none'"/>` : `<div class="card-img" style="background:linear-gradient(135deg,${p.tagColor}15,var(--bg3))"></div>`}
      <div class="card-body-wrap">
        <span class="card-tag" style="background:${p.tagColor}18;color:${p.tagColor}">${p.tag}</span>
        <h3>${p.title}</h3>
        <p>${p.desc}</p>
        <div class="card-status">
          <span class="dot" style="background:${p.statusColor}"></span>
          ${p.status}
        </div>
      </div>
    </div>
  `).join('');
}

function showProject(id) {
  const p = PROJECTS.find(x=>x.id===id);
  if(!p) return;
  homeEl.style.display = 'none';
  detailEl.className = 'detail active';
  document.getElementById('detail-title').textContent = p.title;
  document.getElementById('detail-subtitle').textContent = p.subtitle;

  const tabsEl = document.getElementById('detail-tabs');
  const contentEl = document.getElementById('detail-content');

  tabsEl.innerHTML = p.tabs.map((t,i) =>
    `<div class="tab${i===0?' active':''}" onclick="switchTab(this,${i},'${id}')">${t.name}</div>`
  ).join('');

  contentEl.innerHTML = p.tabs.map((t,i) =>
    `<div class="tab-content${i===0?' active':''}" data-tab="${i}">${t.content}</div>`
  ).join('');

  window.scrollTo(0,0);
}

function switchTab(el,idx,id) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelector(`.tab-content[data-tab="${idx}"]`).classList.add('active');
}

// Handle back button
window.addEventListener('popstate', showHome);

function renderRefs(filter) {
  const grid = document.getElementById('ref-grid');
  if (!grid) return;
  const filtered = filter === 'all' ? REFS : REFS.filter(r => r.style === filter);
  grid.innerHTML = filtered.map(r => `
    <a href="${r.url}" target="_blank" class="ref-card" style="text-decoration:none;color:inherit">
      ${r.img ? `<img src="${r.img}" alt="${r.title}" onerror="this.style.display='none'"/>` : ''}
      <div class="ref-info">
        <div class="ref-title">${r.title}</div>
        <div class="ref-desc">${r.desc}</div>
        <div class="ref-tag">${r.style}</div>
      </div>
    </a>
  `).join('');
}

function filterRefs(btn, filter) {
  document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderRefs(filter);
}

// Re-render refs when switching to gallery tab
const origSwitchTab = switchTab;
switchTab = function(el, idx, id) {
  origSwitchTab(el, idx, id);
  if (id === 'cyberdeck') setTimeout(() => renderRefs('all'), 10);
};

showHome();
