    // ── Spinning laser beams from center ──
    for (let i = 0; i < 6; i++) {
      const laserAngle = globalTime * 0.8 + (i / 6) * Math.PI * 2;
      const laserLen = 400 + Math.sin(globalTime * 2 + i) * 100;
      const lx = cx + Math.cos(laserAngle) * laserLen;
      const ly = cy + Math.sin(laserAngle) * laserLen;
      const hue = (i * 60 + globalTime * 30) % 360;
      ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${0.06 + beatPulse * 0.04})`;
      ctx.lineWidth = 1.5 + beatPulse * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy - 100);
      ctx.lineTo(lx, ly);
      ctx.stroke();
    }

    // ── DJ booth / stage (center-top) ──
    const stageX = cx, stageY = cy - 180;
    // Stage platform — elevated, glowing edges
    ctx.fillStyle = '#12081e';
    ctx.beginPath(); ctx.ellipse(stageX, stageY + 15, 90, 25, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a0e2a';
    ctx.beginPath(); ctx.ellipse(stageX, stageY + 12, 85, 20, 0, 0, Math.PI * 2); ctx.fill();
    // Stage edge glow
    ctx.strokeStyle = `rgba(244,114,182,${0.2 + beatPulse * 0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(stageX, stageY + 12, 85, 20, 0, 0, Math.PI * 2); ctx.stroke();

    // Speaker stacks (left and right of stage)
    for (const side of [-1, 1]) {
      const spkX = stageX + side * 100;
      const spkY = stageY + 5;
      // Speaker box
      ctx.fillStyle = '#0a0510';
      ctx.fillRect(spkX - 12, spkY - 25, 24, 35);
      ctx.strokeStyle = `rgba(192,132,252,${0.15 + beatPulse * 0.2})`;
      ctx.lineWidth = 1;
      ctx.strokeRect(spkX - 12, spkY - 25, 24, 35);
      // Speaker cone (pulses with beat)
      const coneR = 6 + beatPulse * 3;
      ctx.fillStyle = `rgba(192,132,252,${0.1 + beatPulse * 0.15})`;
      ctx.beginPath(); ctx.arc(spkX, spkY - 10, coneR + 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1025';
      ctx.beginPath(); ctx.arc(spkX, spkY - 10, coneR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(192,132,252,${0.2 + beatPulse * 0.3})`;
      ctx.beginPath(); ctx.arc(spkX, spkY - 10, 2, 0, Math.PI * 2); ctx.fill();
      // Bass waves emanating from speakers
      for (let w = 0; w < 3; w++) {
        const waveR = (globalTime * 60 + w * 25) % 80;
        const waveA = Math.max(0, 1 - waveR / 80) * 0.08 * (1 + beatPulse);
        ctx.strokeStyle = `rgba(192,132,252,${waveA})`;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(spkX, spkY - 10, waveR, 0, Math.PI * 2); ctx.stroke();
      }
    }

    // ── Giant mushroom lights (rave lights) ──
    const raveLights = [
      { x: cx - 250, y: cy - 100, hueBase: 0 },
      { x: cx + 300, y: cy - 50, hueBase: 120 },
      { x: cx - 180, y: cy + 200, hueBase: 240 },
      { x: cx + 200, y: cy + 250, hueBase: 60 },
      { x: cx, y: cy + 150, hueBase: 300 },
      { x: cx + 400, y: cy + 100, hueBase: 180 },
    ];
    raveLights.forEach((rl, i) => {
      const hue = (rl.hueBase + globalTime * 20) % 360;
      const pulse = Math.sin(globalTime * (1.5 + i * 0.3) + i * 1.5) * 0.5 + 0.5;
      const glowR = 40 + pulse * 30 + beatPulse * 20;
      // Mushroom stem
      ctx.fillStyle = `hsla(${hue}, 30%, 15%, 0.6)`;
      ctx.fillRect(rl.x - 3, rl.y, 6, 30);
      // Cap
      ctx.fillStyle = `hsla(${hue}, 60%, 40%, ${0.3 + pulse * 0.2})`;
      ctx.beginPath(); ctx.ellipse(rl.x, rl.y, 15 + pulse * 3, 8 + pulse * 2, 0, Math.PI, Math.PI * 2); ctx.fill();
      // Light cone going down
      ctx.fillStyle = `hsla(${hue}, 70%, 50%, ${0.015 + pulse * 0.02 + beatPulse * 0.02})`;
      ctx.beginPath();
      ctx.moveTo(rl.x - 12, rl.y);
      ctx.lineTo(rl.x - 50, rl.y + 120);
      ctx.lineTo(rl.x + 50, rl.y + 120);
      ctx.lineTo(rl.x + 12, rl.y);
      ctx.closePath();
      ctx.fill();
      // Cap glow
      const mg = ctx.createRadialGradient(rl.x, rl.y, 0, rl.x, rl.y, glowR);
      mg.addColorStop(0, `hsla(${hue}, 80%, 60%, ${0.08 + beatPulse * 0.06})`);
      mg.addColorStop(0.5, `hsla(${hue}, 70%, 50%, ${0.02 + beatPulse * 0.02})`);
      mg.addColorStop(1, 'transparent');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(rl.x, rl.y, glowR, 0, Math.PI * 2); ctx.fill();
    });

    // ── Bar counter (back wall) ──
    const barX = cx - 180, barY = cy - 100;
    const barW = 360;
    ctx.fillStyle = '#12081e';
    ctx.fillRect(barX, barY, barW, 18);
    ctx.strokeStyle = `rgba(192,132,252,${0.15 + beatPulse * 0.1})`;
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, 18);
    // Neon strip on bar edge
    ctx.strokeStyle = `rgba(244,114,182,${0.3 + beatPulse * 0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(barX, barY); ctx.lineTo(barX + barW, barY); ctx.stroke();
    // Bar stools
    for (let i = 0; i < 6; i++) {
      const sx = barX + 30 + i * 58;
      ctx.fillStyle = '#1a0e20';
      ctx.beginPath(); ctx.ellipse(sx, barY + 32, 9, 5, 0, 0, Math.PI * 2); ctx.fill();
    }
    // Glowing bottles
    const bottleColors = ['rgba(74,222,128,','rgba(244,114,182,','rgba(251,191,36,','rgba(125,211,252,','rgba(192,132,252,','rgba(244,63,94,'];
    for (let i = 0; i < 6; i++) {
      const bx = barX + 25 + i * 55;
      const bPulse = Math.sin(globalTime * 2 + i * 1.2) * 0.5 + 0.5;
      ctx.fillStyle = bottleColors[i] + (0.3 + bPulse * 0.2) + ')';
      ctx.fillRect(bx - 2, barY - 14, 4, 14);
      ctx.beginPath(); ctx.arc(bx, barY - 14, 3, 0, Math.PI * 2); ctx.fill();
      const bg = ctx.createRadialGradient(bx, barY - 7, 0, bx, barY - 7, 18);
      bg.addColorStop(0, bottleColors[i] + (0.06 + bPulse * 0.06) + ')');
      bg.addColorStop(1, 'transparent');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(bx, barY - 7, 18, 0, Math.PI * 2); ctx.fill();
    }

    // ── Dance floor (center) — pulsing tiles ──
    const floorX = cx - 100, floorY = cy + 20;
    const tileSize = 25;
    for (let tx = 0; tx < 8; tx++) {
      for (let ty = 0; ty < 5; ty++) {
        const tileX = floorX + tx * tileSize;
        const tileY = floorY + ty * tileSize;
        const tilePulse = Math.sin(globalTime * 3 + tx * 0.8 + ty * 0.6) * 0.5 + 0.5;
        const tileHue = (tx * 30 + ty * 45 + globalTime * 50) % 360;
        ctx.fillStyle = `hsla(${tileHue}, 60%, 40%, ${0.04 + tilePulse * 0.06 + beatPulse * 0.05})`;
        ctx.fillRect(tileX + 1, tileY + 1, tileSize - 2, tileSize - 2);
        ctx.strokeStyle = `hsla(${tileHue}, 50%, 50%, ${0.06 + tilePulse * 0.04})`;
        ctx.lineWidth = 0.5;
        ctx.strokeRect(tileX + 1, tileY + 1, tileSize - 2, tileSize - 2);
      }
    }

    // ── Floating particles (rave dust) ──
    for (let i = 0; i < 40; i++) {
      const px = ((Math.sin(globalTime * 0.3 + i * 3.7) + 1) / 2) * WORLD_W;
      const py = ((Math.cos(globalTime * 0.25 + i * 2.3) + 1) / 2) * WORLD_H;
      const hue = (i * 37 + globalTime * 20) % 360;
      const sparkle = Math.sin(globalTime * 4 + i * 2) * 0.5 + 0.5;
      ctx.fillStyle = `hsla(${hue}, 80%, 70%, ${sparkle * 0.12})`;
      ctx.beginPath(); ctx.arc(px, py, 1 + sparkle * 1.5, 0, Math.PI * 2); ctx.fill();
    }

    // ── Neon signs ──
    // "THE BOG" sign
    ctx.fillStyle = `rgba(244,114,182,${0.15 + beatPulse * 0.15})`;
    ctx.font = 'bold 16px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('THE BOG', cx, cy - 260);
    // Glow behind text
    const signG = ctx.createRadialGradient(cx, cy - 265, 0, cx, cy - 265, 60);
    signG.addColorStop(0, `rgba(244,114,182,${0.03 + beatPulse * 0.03})`);
    signG.addColorStop(1, 'transparent');
    ctx.fillStyle = signG;
    ctx.beginPath(); ctx.arc(cx, cy - 265, 60, 0, Math.PI * 2); ctx.fill();
    ctx.textAlign = 'start';

    // ── Sketchy corner (darker, no lights) ──
    const darkX = cx - 350, darkY = cy + 100;
    const dg = ctx.createRadialGradient(darkX, darkY, 0, darkX, darkY, 120);
    dg.addColorStop(0, 'rgba(0,0,0,0.25)');
    dg.addColorStop(1, 'transparent');
    ctx.fillStyle = dg;
    ctx.beginPath(); ctx.arc(darkX, darkY, 120, 0, Math.PI * 2); ctx.fill();

    // ── VIP area glow (right side) ──
    const vipG = ctx.createRadialGradient(cx + 350, cy, 0, cx + 350, cy, 80);
    vipG.addColorStop(0, `rgba(251,191,36,${0.02 + beatPulse * 0.02})`);
    vipG.addColorStop(1, 'transparent');
    ctx.fillStyle = vipG;
    ctx.beginPath(); ctx.arc(cx + 350, cy, 80, 0, Math.PI * 2); ctx.fill();
  }
}

function drawBug(bug) {
  const w=Math.sin(bug.wingPhase);
  if (bug.type==='fly') {
    ctx.fillStyle='#3a3a3a';
    ctx.beginPath(); ctx.arc(0,0,2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#555';
    ctx.beginPath(); ctx.arc(0,-2,1.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(200,220,210,${0.25+Math.abs(w)*0.2})`;
    ctx.beginPath(); ctx.ellipse(-3,-1,3+Math.abs(w),1.5,-0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3,-1,3+Math.abs(w),1.5,0.3,0,Math.PI*2); ctx.fill();
  } else if (bug.type==='dragonfly') {
    ctx.fillStyle='#38bdf8';
    ctx.fillRect(-1,-5,2,10);
    ctx.fillStyle='#7dd3fc';
    ctx.beginPath(); ctx.arc(0,-5,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(125,211,252,${0.2+Math.abs(w)*0.15})`;
    ctx.beginPath(); ctx.ellipse(-5,-2,6+w*2,2,-0.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5,-2,6-w*2,2,0.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-4,1,5-w,1.5,-0.1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4,1,5+w,1.5,0.1,0,Math.PI*2); ctx.fill();
  } else if (bug.type==='beetle') {
    ctx.fillStyle='#92400e';
    ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fbbf24';
    ctx.beginPath(); ctx.arc(-1.5,0,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(1.5,0,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#f59e0b';
    ctx.beginPath(); ctx.arc(0,0,2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#92400e'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(0,-3); ctx.lineTo(0,3); ctx.stroke();
    ctx.strokeStyle='#78350f'; ctx.lineWidth=0.5;
    for (let l=-1;l<=1;l++) {
      ctx.beginPath(); ctx.moveTo(-4,l*2.5); ctx.lineTo(-6,l*3+w); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(4,l*2.5); ctx.lineTo(6,l*3-w); ctx.stroke();
    }
  } else if (bug.type==='moth') {
    ctx.fillStyle='#c084fc';
    ctx.beginPath(); ctx.arc(0,0,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(192,132,252,${0.25+Math.abs(w)*0.2})`;
    ctx.beginPath(); ctx.ellipse(-3,0,4+w*1.5,3,-0.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3,0,4-w*1.5,3,0.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(147,51,234,0.5)';
    ctx.beginPath(); ctx.arc(-4,0,1.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,0,1.5,0,Math.PI*2); ctx.fill();
  }
}

function drawFrog() {
  const bob = frog.isMoving ? Math.sin(frog.walkPhase)*2 : Math.sin(frog.breathe)*0.8;
  const breatheScale = 1 + Math.sin(frog.breathe)*0.015;
  ctx.save();
  ctx.translate(frog.x, frog.y + bob + frog.hopHeight);
  ctx.rotate(frog.rotation);

  // Shadow (moves based on hop height)
  const shadowScale = 1 + frog.hopHeight * 0.02;
  const shadowAlpha = 0.3 + frog.hopHeight * 0.01;
  ctx.fillStyle=`rgba(0,12,0,${Math.max(0.05,shadowAlpha)})`;
  ctx.beginPath();
  ctx.ellipse(0, -frog.hopHeight+14, 14*frog.scaleX*shadowScale, 5*shadowScale, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.scale(frog.scaleX*breatheScale, frog.scaleY/breatheScale);

  // Back legs
  const legPhase = frog.isMoving ? frog.walkPhase : 0;
  const legKick = Math.sin(legPhase*2)*4;
  const legSpread = frog.isFlopping ? 1.3 : 1;
  // Left back leg
  ctx.fillStyle='#15803d';
  ctx.save();
  ctx.translate(-8*legSpread, 6);
  ctx.rotate(Math.sin(legPhase)*0.3);
  ctx.beginPath(); ctx.ellipse(0,0,5,3.5,0,0,Math.PI*2); ctx.fill();
  // Foot with toes
  ctx.fillStyle='#166534';
  ctx.beginPath(); ctx.ellipse(-4,2+legKick*0.3,4,2,-0.5,0,Math.PI*2); ctx.fill();
  // Toes
  ctx.fillStyle='#14532d';
  for (let t=0;t<3;t++) {
    ctx.beginPath(); ctx.ellipse(-6-t*1.5,3+t*1+legKick*0.3,2,1,-0.3-t*0.2,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  // Right back leg
  ctx.fillStyle='#15803d';
  ctx.save();
  ctx.translate(8*legSpread, 6);
  ctx.rotate(-Math.sin(legPhase)*0.3);
  ctx.beginPath(); ctx.ellipse(0,0,5,3.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#166534';
  ctx.beginPath(); ctx.ellipse(4,2-legKick*0.3,4,2,0.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#14532d';
  for (let t=0;t<3;t++) {
    ctx.beginPath(); ctx.ellipse(6+t*1.5,3+t*1-legKick*0.3,2,1,0.3+t*0.2,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Body
  const bodyG=ctx.createRadialGradient(0,-2,2,0,2,16);
  bodyG.addColorStop(0,'#4ade80');
  bodyG.addColorStop(0.5,'#22c55e');
  bodyG.addColorStop(1,'#15803d');
  ctx.fillStyle=bodyG;
  ctx.beginPath(); ctx.ellipse(0,0,13,11+frog.cheekPuff*2,0,0,Math.PI*2); ctx.fill();

  // Belly
  const bellyG=ctx.createRadialGradient(0,3,0,0,3,10);
  bellyG.addColorStop(0,'#bbf7d0');
  bellyG.addColorStop(1,'#86efac');
  ctx.fillStyle=bellyG;
  ctx.beginPath(); ctx.ellipse(0,3,8+frog.cheekPuff,7,0,0,Math.PI*2); ctx.fill();

  // Spots with subtle animation
  ctx.fillStyle='rgba(21,128,61,0.35)';
  ctx.beginPath(); ctx.arc(-5+Math.sin(globalTime*0.5)*0.5,-4,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4,-6,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(7,-1,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-8,1,1.2,0,Math.PI*2); ctx.fill();

  // Body highlight
  ctx.fillStyle='rgba(187,247,208,0.08)';
  ctx.beginPath(); ctx.ellipse(-3,-5,6,4,-0.3,0,Math.PI*2); ctx.fill();

  // Front legs
  ctx.fillStyle='#16a34a';
  ctx.save();
  ctx.translate(-8, 4);
  ctx.rotate(-Math.sin(legPhase)*0.2);
  ctx.beginPath(); ctx.ellipse(0,0,3.5,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#15803d';
  ctx.beginPath(); ctx.ellipse(-2,1,2,1.5,-0.2,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle='#16a34a';
  ctx.save();
  ctx.translate(8, 4);
  ctx.rotate(Math.sin(legPhase)*0.2);
  ctx.beginPath(); ctx.ellipse(0,0,3.5,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#15803d';
  ctx.beginPath(); ctx.ellipse(2,1,2,1.5,0.2,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Eye bumps
  const eyeStretchY = 1 + frog.eyeStretch * 0.3;
  ctx.fillStyle='#22c55e';
  ctx.beginPath(); ctx.ellipse(-7,-11,7.5,6.5*eyeStretchY,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7,-11,7.5,6.5*eyeStretchY,0,0,Math.PI*2); ctx.fill();
  // Bump highlight
  ctx.fillStyle='rgba(74,222,128,0.2)';
  ctx.beginPath(); ctx.ellipse(-8,-13,3,2.5,-0.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6,-13,3,2.5,0.3,0,Math.PI*2); ctx.fill();

  // Eye whites
  const blinkH=1-frog.eyeBlink;
  ctx.fillStyle='#f0fdf4';
  ctx.beginPath(); ctx.ellipse(-7,-12,5.5,5*blinkH*eyeStretchY,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7,-12,5.5,5*blinkH*eyeStretchY,0,0,Math.PI*2); ctx.fill();

  if (blinkH>0.15) {
    const pd = frog.pupilDilate;
    // Iris
    ctx.fillStyle='#166534';
    ctx.beginPath(); ctx.ellipse(-7+frog.lookX,-12+frog.lookY,3.5*pd,3.5*blinkH*pd,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7+frog.lookX,-12+frog.lookY,3.5*pd,3.5*blinkH*pd,0,0,Math.PI*2); ctx.fill();
    // Pupil
    ctx.fillStyle='#052e16';
    ctx.beginPath(); ctx.ellipse(-7+frog.lookX*1.2,-12+frog.lookY,2*pd,2.5*blinkH*pd,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7+frog.lookX*1.2,-12+frog.lookY,2*pd,2.5*blinkH*pd,0,0,Math.PI*2); ctx.fill();
    // Shine
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(-8.5+frog.lookX*0.3,-14,1.8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5.5+frog.lookX*0.3,-14,1.8,0,Math.PI*2); ctx.fill();
    // Secondary shine
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.arc(-5.5+frog.lookX*0.5,-10.5,0.8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8.5+frog.lookX*0.5,-10.5,0.8,0,Math.PI*2); ctx.fill();
  }

  // Eyelids when blinking
  if (frog.eyeBlink > 0.1) {
    ctx.fillStyle='#1a9a4a';
    ctx.beginPath(); ctx.ellipse(-7,-12,5.8,5*frog.eyeBlink,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7,-12,5.8,5*frog.eyeBlink,0,0,Math.PI*2); ctx.fill();
  }

  // Mouth
  if (frog.mouthOpen > 0.1) {
    // Open mouth
    ctx.fillStyle='#1a0505';
    ctx.beginPath(); ctx.ellipse(0,-3,4*frog.mouthOpen,3*frog.mouthOpen,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ef4444';
    ctx.beginPath(); ctx.ellipse(0,-2,3*frog.mouthOpen,1.5*frog.mouthOpen,0,0,Math.PI*2); ctx.fill();
  } else if (frog.gulpTimer > 0) {
    // Gulp expression
    const gp = frog.gulpTimer / 0.3;
    ctx.strokeStyle='#15803d';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(0,-3,4+gp*2,0.3,Math.PI-0.3); ctx.stroke();
    // Throat bulge
    ctx.fillStyle='rgba(187,247,208,0.15)';
    ctx.beginPath(); ctx.ellipse(0,2,6,4+gp*3,0,0,Math.PI*2); ctx.fill();
  } else {
    // Resting smile
    ctx.strokeStyle='#15803d';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(0,-4,5,0.2,Math.PI-0.2); ctx.stroke();
  }

  // Cheeks
  if (combo>2 || frog.cheekPuff > 0.1) {
    const blush = Math.max(frog.cheekPuff*0.4, Math.min(combo*0.04,0.25));
    ctx.fillStyle=`rgba(251,113,133,${blush})`;
    ctx.beginPath(); ctx.ellipse(-10,-5,3.5,2.5,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10,-5,3.5,2.5,0,0,Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

// ─── DOOM MODE (FIRST-PERSON RAYCASTER) ───
let tripActive = false;
let tripTime = 0;
let tripFadeIn = 0;
const tripDuration = 90; // 90 seconds — a full song

const MS = 24; // map size
const tripMap = (function(){
  // Generate a more interesting map
  const m = new Array(MS*MS).fill(0);
  // Outer walls
  for(let i=0;i<MS;i++) { m[i]=1; m[(MS-1)*MS+i]=1; m[i*MS]=1; m[i*MS+MS-1]=1; }
  // Inner structures — rooms and corridors
  // Central arena
  for(let i=8;i<16;i++) { m[6*MS+i]=2; m[17*MS+i]=2; }
  for(let i=6;i<18;i++) { m[i*MS+8]=2; m[i*MS+15]=2; }
  // Openings in central arena
  m[6*MS+11]=0; m[6*MS+12]=0; m[17*MS+11]=0; m[17*MS+12]=0;
  m[11*MS+8]=0; m[12*MS+8]=0; m[11*MS+15]=0; m[12*MS+15]=0;
  // Side rooms
  for(let i=2;i<6;i++) { m[3*MS+i]=3; m[7*MS+i]=3; }
  for(let i=3;i<8;i++) { m[i*MS+2]=3; m[i*MS+5]=3; }
  m[5*MS+2]=0; m[5*MS+5]=0; // doors
  // Pillars scattered
  m[10*MS+11]=3; m[10*MS+12]=3; m[13*MS+11]=3; m[13*MS+12]=3;
  // Corridors
  for(let i=18;i<22;i++) { m[4*MS+i]=2; m[8*MS+i]=2; }
  for(let i=4;i<9;i++) m[i*MS+18]=2;
  m[6*MS+18]=0; // opening
  // More rooms
  for(let i=18;i<22;i++) { m[14*MS+i]=3; m[20*MS+i]=3; }
  for(let i=14;i<21;i++) { m[i*MS+18]=3; m[i*MS+21]=3; }
  m[17*MS+18]=0; m[17*MS+21]=0;
  return m;
})();

// Camera uses direction + plane vectors (lodev-style) for proper strafing
const tripCam = {
  x:4, y:4,
  dirX:-1, dirY:0,    // direction vector
  planeX:0, planeY:0.66, // camera plane (FOV ~66deg)
  bobPhase:0, hp:100,
};
// Velocity-based movement with acceleration
const tripVel = { forward:0, strafe:0, turn:0 };
const TRIP_ACCEL=10, TRIP_DECEL=8, TRIP_MAX_SPEED=4, TRIP_TURN_SPEED=2.5;

let tripEnemies = [];
const tripTongue = { active:false, timer:0, cooldown:0 };
let tripKills = 0;
let tripHue = 0;
let tripFlash = 0;
const tripTouch = {
  moveId:null, moveSX:0, moveSY:0, moveDx:0, moveDy:0,
  lookId:null, lookSX:0, lookSY:0, lookDx:0, lookDy:0,
};
let zBuf = [];

// Procedural textures (no image assets needed)
const TEX_SIZE = 64;
const textures = [];
function generateTextures() {
  // Texture 0: Brick wall
  const brick = new Uint8Array(TEX_SIZE * TEX_SIZE * 3);
  for (let y = 0; y < TEX_SIZE; y++) {
    for (let x = 0; x < TEX_SIZE; x++) {
      const i = (y * TEX_SIZE + x) * 3;
      const bH = TEX_SIZE / 4, bW = TEX_SIZE / 2;
      const row = Math.floor(y / bH);
      const bx = (x + (row % 2) * (bW / 2)) % bW;
      const by = y % bH;
      const mortar = bx < 1 || by < 1;
      const noise = (Math.random() * 16 - 8) | 0;
      if (mortar) { brick[i] = 40; brick[i+1] = 35; brick[i+2] = 45; }
      else { brick[i] = 80 + noise; brick[i+1] = 30 + noise; brick[i+2] = 50 + noise; }
    }
  }
  textures.push(brick);
  // Texture 1: Stone blocks
  const stone = new Uint8Array(TEX_SIZE * TEX_SIZE * 3);
  for (let y = 0; y < TEX_SIZE; y++) {
    for (let x = 0; x < TEX_SIZE; x++) {
      const i = (y * TEX_SIZE + x) * 3;
      const grid = (x % 16 < 1 || y % 16 < 1) ? 1 : 0;
      const noise = (Math.random() * 12 - 6) | 0;
      if (grid) { stone[i] = 25; stone[i+1] = 30; stone[i+2] = 35; }
      else { stone[i] = 55 + noise; stone[i+1] = 60 + noise; stone[i+2] = 70 + noise; }
    }
  }
  textures.push(stone);
  // Texture 2: Organic / vine wall
  const vine = new Uint8Array(TEX_SIZE * TEX_SIZE * 3);
  for (let y = 0; y < TEX_SIZE; y++) {
    for (let x = 0; x < TEX_SIZE; x++) {
      const i = (y * TEX_SIZE + x) * 3;
      const v = Math.sin(x * 0.3) * Math.cos(y * 0.2) * 30;
      vine[i] = 20 + v; vine[i+1] = 50 + v + (Math.random() * 10); vine[i+2] = 25 + v;
    }
  }
  textures.push(vine);
}
generateTextures();

// Rotate camera direction + plane
function tripRotate(angle) {
  const c = Math.cos(angle), s = Math.sin(angle);
  const dx = tripCam.dirX, dy = tripCam.dirY;
  tripCam.dirX = dx * c - dy * s;
  tripCam.dirY = dx * s + dy * c;
  const px = tripCam.planeX, py = tripCam.planeY;
  tripCam.planeX = px * c - py * s;
  tripCam.planeY = px * s + py * c;
}

// AI states
const AI = { IDLE:0, CHASE:1, ATTACK:2, PAIN:3 };

function startTrip() {
  tripActive=true; tripTime=0; tripFadeIn=1; tripKills=0; tripFlash=0;
  tripCam.x=4; tripCam.y=4; tripCam.dirX=1; tripCam.dirY=0;
  tripCam.planeX=0; tripCam.planeY=0.66;
  tripCam.hp=100; tripCam.bobPhase=0;
  tripVel.forward=0; tripVel.strafe=0; tripVel.turn=0;
  tripTongue.active=false; tripTongue.cooldown=0;
  tripEnemies=[];
  for(let i=0;i<12;i++) {
    let ex,ey,attempts=0;
    do { ex=2+Math.random()*(MS-4); ey=2+Math.random()*(MS-4); attempts++; }
    while(tripMap[Math.floor(ey)*MS+Math.floor(ex)]!==0 && attempts<50);
    const types=['beetle','moth','toad','fly'];
    const type=types[Math.floor(Math.random()*types.length)];
    tripEnemies.push({
      x:ex, y:ey, alive:true, hp:type==='toad'?4:type==='beetle'?3:2,
      hurtTimer:0, moveTimer:Math.random()*2, type,
      moveSpeed: type==='fly'?3:type==='moth'?2:type==='toad'?0.8:1.5,
      attackTimer: 2+Math.random()*3, deathTimer:0,
      state: AI.IDLE, lostTimer:0,
    });
  }
  if(musicStarted) {
    const t=audioCtx.currentTime;
    layers.sub.osc.type='square';
    layers.sub.osc.frequency.setTargetAtTime(35,t,0.2);
    layers.sub.gain.gain.setTargetAtTime(0.5,t,0.2);
    layers.pad.osc.type='sawtooth';
    layers.pad.osc.frequency.setTargetAtTime(80,t,0.2);
    layers.pad.filter.frequency.setTargetAtTime(1200,t,0.2);
    layers.pluck.gain.gain.setTargetAtTime(0.15,t,0.1);
    masterGain.gain.setTargetAtTime(0.85,t,0.2);
    intensityTarget=0.8;
  }
}

function endTrip() {
  tripActive=false;
  // Restore music based on current zone
  if(musicStarted) {
    const t=audioCtx.currentTime;
    if(currentZone===1) {
      layers.sub.osc.type='sine';
      layers.sub.osc.frequency.setTargetAtTime(45,t,0.5);
      layers.sub.gain.gain.setTargetAtTime(0.3,t,0.3);
      layers.pad.osc.type='triangle';
      layers.pad.osc.frequency.setTargetAtTime(110,t,0.5);
      layers.pad.filter.frequency.setTargetAtTime(400,t,0.3);
      layers.pad.gain.gain.setTargetAtTime(0.18,t,0.3);
      masterGain.gain.setTargetAtTime(0.7,t,0.5);
    } else {
      layers.sub.osc.type='sawtooth';
      layers.sub.osc.frequency.setTargetAtTime(55,t,0.5);
      layers.pad.osc.frequency.setTargetAtTime(146.83,t,0.5);
      layers.pad.filter.frequency.setTargetAtTime(700,t,0.3);
      masterGain.gain.setTargetAtTime(0.75,t,0.5);
    }
  }
  // Add kills to score
  document.getElementById('score').textContent = 'BUGS: '+score;
}

function updateTrip(dt) {
  tripTime+=dt;
  tripFadeIn=Math.max(0,tripFadeIn-dt*1.5);
  tripHue=(tripHue+dt*20)%360;
  tripFlash=Math.max(0,tripFlash-dt*4);

  const allDead=tripEnemies.every(e=>!e.alive);
  if(tripTime>tripDuration || allDead || tripCam.hp<=0) {
    tripFadeIn+=dt*2;
    if(tripFadeIn>=1){endTrip();return;}
  }

  // ── Input ──
  let inputFwd=0, inputStrafe=0, inputTurn=0;
  if(isMobile) {
    inputFwd = -tripTouch.moveDy;
    inputStrafe = tripTouch.moveDx;
    inputTurn = tripTouch.lookDx;
  } else {
    if(keys['w']||keys['arrowup']) inputFwd=1;
    if(keys['s']||keys['arrowdown']) inputFwd=-1;
    if(keys['a']) inputStrafe=-1;
    if(keys['d']) inputStrafe=1;
    if(keys['arrowleft']) inputTurn=-1;
    if(keys['arrowright']) inputTurn=1;
  }

  // ── Acceleration-based movement ──
  // Forward/back
  if(inputFwd!==0) {
    tripVel.forward+=inputFwd*TRIP_ACCEL*dt;
    tripVel.forward=Math.max(-TRIP_MAX_SPEED,Math.min(TRIP_MAX_SPEED,tripVel.forward));
  } else {
    const s=Math.sign(tripVel.forward);
    tripVel.forward-=s*TRIP_DECEL*dt;
    if(Math.sign(tripVel.forward)!==s) tripVel.forward=0;
  }
  // Strafe
  if(inputStrafe!==0) {
    tripVel.strafe+=inputStrafe*TRIP_ACCEL*dt;
    tripVel.strafe=Math.max(-TRIP_MAX_SPEED,Math.min(TRIP_MAX_SPEED,tripVel.strafe));
  } else {
    const s=Math.sign(tripVel.strafe);
    tripVel.strafe-=s*TRIP_DECEL*dt;
    if(Math.sign(tripVel.strafe)!==s) tripVel.strafe=0;
  }

  // Turn (rotation via vector math)
  const turnAmt = inputTurn * TRIP_TURN_SPEED * dt * (isMobile ? 2.5 : 1);
  if(turnAmt) tripRotate(turnAmt);

  // Apply velocity using direction + plane vectors (proper strafing)
  const moveX = tripCam.dirX * tripVel.forward * dt + tripCam.planeX * tripVel.strafe * dt;
  const moveY = tripCam.dirY * tripVel.forward * dt + tripCam.planeY * tripVel.strafe * dt;

  // Collision with radius (wall-sliding)
  const R=0.25;
  const nx=tripCam.x+moveX, ny=tripCam.y+moveY;
  if(tripMap[Math.floor(tripCam.y)*MS+Math.floor(nx+R*Math.sign(moveX))]===0) tripCam.x=nx;
  if(tripMap[Math.floor(ny+R*Math.sign(moveY))*MS+Math.floor(tripCam.x)]===0) tripCam.y=ny;

  // Head bob
  if(Math.abs(tripVel.forward)>0.3||Math.abs(tripVel.strafe)>0.3) tripCam.bobPhase+=dt*8;

  // ── Tongue ──
  tripTongue.cooldown=Math.max(0,tripTongue.cooldown-dt);
  if(tripTongue.active) { tripTongue.timer-=dt; if(tripTongue.timer<=0) tripTongue.active=false; }

  // ── Enemy AI (state machine) ──
  tripEnemies.forEach(e => {
    if(!e.alive) { e.deathTimer=Math.min(1,e.deathTimer+dt*3); return; }
    e.hurtTimer=Math.max(0,e.hurtTimer-dt);
    const dx=tripCam.x-e.x, dy=tripCam.y-e.y;
    const dist=Math.sqrt(dx*dx+dy*dy);

    if(e.state===AI.PAIN) {
      e.hurtTimer-=dt;
      if(e.hurtTimer<=0) e.state=AI.CHASE;
      return;
    }

    if(e.state===AI.IDLE) {
      if(dist<8) e.state=AI.CHASE;
    }

    if(e.state===AI.CHASE) {
      e.moveTimer-=dt;
      if(e.moveTimer<=0) {
        e.moveTimer=0.3+Math.random()*0.5;
        if(dist>1.2) {
          const step=e.moveSpeed*dt*2;
          const enx=e.x+(dx/dist)*step;
          const eny=e.y+(dy/dist)*step;
          // Wall-slide collision for enemies too
          if(tripMap[Math.floor(e.y)*MS+Math.floor(enx)]===0) e.x=enx;
          if(tripMap[Math.floor(eny)*MS+Math.floor(e.x)]===0) e.y=eny;
        }
      }
      if(dist<1.5) { e.state=AI.ATTACK; e.attackTimer=0.5; }
      if(dist>12) e.state=AI.IDLE;
    }

    if(e.state===AI.ATTACK) {
      e.attackTimer-=dt;
      if(e.attackTimer<=0) {
        if(dist<2) {
          tripCam.hp-=10;
          tripFlash=1;
          screenShake=0.3;
          sfx(120,60,0.2,0.25);
        }
        e.attackTimer=1+Math.random()*1.5;
        if(dist>2) e.state=AI.CHASE;
      }
    }
  });

  updateMusic(dt);
}

function tripShoot() {
  if(tripTongue.active||tripTongue.cooldown>0) return;
  tripTongue.active=true;
  tripTongue.timer=0.25;
  tripTongue.cooldown=0.35;
  sfx(500,150,0.1,0.3);
  screenShake=0.1;

  // Hit detection — check enemies near crosshair
  let hitAny=false;
  const camAngle=Math.atan2(tripCam.dirY,tripCam.dirX);
  tripEnemies.forEach(e => {
    if(!e.alive) return;
    const dx=e.x-tripCam.x, dy=e.y-tripCam.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    let ad=Math.atan2(dy,dx)-camAngle;
    while(ad>Math.PI) ad-=Math.PI*2;
    while(ad<-Math.PI) ad+=Math.PI*2;
    if(Math.abs(ad)<0.25 && dist<10) {
      e.hp--;
      e.hurtTimer=0.25;
      e.state=AI.PAIN;
      hitAny=true;
      sfx(250+Math.random()*200,100,0.12,0.25);
      screenShake=0.2;
      if(e.hp<=0) {
        e.alive=false;
        tripKills++;
        score+=2; // Bonus bugs for kills
        sfx(150,500,0.25,0.25);
        sfx(100,300,0.3,0.15);
        screenShake=0.35;
        tripFlash=0.5;
        intensityTarget=Math.min(1,intensityTarget+0.15);
      }
    }
  });
  if(!hitAny) sfx(200,100,0.05,0.1); // whiff
}

function drawTrip() {
  const sw=W, sh=H;
  const numRays=Math.min(Math.floor(sw/2),320);
  const sliceW=sw/numRays;
  const halfH=sh/2;
  const bob=Math.sin(tripCam.bobPhase)*4;
  const bobH=halfH+bob;
  zBuf=new Array(numRays);
  const camAngle=Math.atan2(tripCam.dirY,tripCam.dirX);

  // ── Sky ──
  const skyG=ctx.createLinearGradient(0,0,0,bobH);
  skyG.addColorStop(0,`hsl(${(tripHue+180)%360},40%,3%)`);
  skyG.addColorStop(1,`hsl(${(tripHue+200)%360},60%,8%)`);
  ctx.fillStyle=skyG;
  ctx.fillRect(0,0,sw,bobH);

  // ── Floor ──
  const flG=ctx.createLinearGradient(0,bobH,0,sh);
  flG.addColorStop(0,`hsl(${tripHue},50%,6%)`);
  flG.addColorStop(1,`hsl(${tripHue},40%,2%)`);
  ctx.fillStyle=flG;
  ctx.fillRect(0,bobH,sw,sh-bobH);

  // ── Floor detail (distance stripes) ──
  for(let fy=bobH+10;fy<sh;fy+=8) {
    const floorDist=(sh-bobH)/(fy-bobH+1);
    const stripe=(Math.floor(floorDist*3+tripTime*2))%2;
    if(stripe) {
      ctx.fillStyle=`hsla(${(tripHue+floorDist*15)%360},30%,8%,0.15)`;
      ctx.fillRect(0,fy,sw,4);
    }
  }

  // ── Cast rays (DDA with camera plane — lodev style) ──
  for(let i=0;i<numRays;i++) {
    const cameraX = 2*i/numRays - 1; // -1 to 1
    const rayDirX = tripCam.dirX + tripCam.planeX * cameraX;
    const rayDirY = tripCam.dirY + tripCam.planeY * cameraX;
    let mapX=Math.floor(tripCam.x), mapY=Math.floor(tripCam.y);
    const ddX=Math.abs(1/rayDirX), ddY=Math.abs(1/rayDirY);
    let stepX, stepY, sideDistX, sideDistY;

    if(rayDirX<0) { stepX=-1; sideDistX=(tripCam.x-mapX)*ddX; }
    else { stepX=1; sideDistX=(mapX+1-tripCam.x)*ddX; }
    if(rayDirY<0) { stepY=-1; sideDistY=(tripCam.y-mapY)*ddY; }
    else { stepY=1; sideDistY=(mapY+1-tripCam.y)*ddY; }

    let hit=0, side=0, dist=0;
    for(let s=0;s<64;s++) {
      if(sideDistX<sideDistY) { sideDistX+=ddX; mapX+=stepX; side=0; }
      else { sideDistY+=ddY; mapY+=stepY; side=1; }
      if(mapX<0||mapX>=MS||mapY<0||mapY>=MS) { hit=1; break; }
      const cell=tripMap[mapY*MS+mapX];
      if(cell>0) { hit=cell; break; }
    }

    // Perpendicular distance (no fisheye with plane vectors)
    if(side===0) dist=(mapX-tripCam.x+(1-stepX)/2)/rayDirX;
    else dist=(mapY-tripCam.y+(1-stepY)/2)/rayDirY;
    dist=Math.max(0.1,dist);
    zBuf[i]=dist;

    const wallH=sh/dist;
    const wallTop=bobH-wallH/2;

    // ── Textured wall rendering ──
    // Calculate exact hit position for texture X coordinate
    let wallX; // fractional position along the wall
    if(side===0) wallX=tripCam.y+dist*rayDirY;
    else wallX=tripCam.x+dist*rayDirX;
    wallX-=Math.floor(wallX); // 0-1

    const texIdx=Math.min(hit-1,textures.length-1);
    const tex=textures[texIdx];
    const texX=Math.floor(wallX*TEX_SIZE);

    const darkness=Math.max(0.15,1-dist/10);
    const sideShade=side?0.6:1;
    const light=darkness*sideShade;

    // Draw textured column
    const drawStart=Math.max(0,Math.floor(wallTop));
    const drawEnd=Math.min(sh,Math.floor(wallTop+wallH));
    const step=TEX_SIZE/wallH;
    let texPos=(drawStart-wallTop)*step;

    for(let y=drawStart;y<drawEnd;y++) {
      const texY=Math.floor(texPos)&(TEX_SIZE-1);
      texPos+=step;
      const ti=(texY*TEX_SIZE+texX)*3;
      // Apply trippy hue shift
      const hShift=tripHue*0.7;
      let r=tex[ti]*light, g=tex[ti+1]*light, b=tex[ti+2]*light;
      // Rotate colors for trip effect
      const cr=r*Math.cos(hShift*0.017)+g*Math.sin(hShift*0.017);
      const cg=g*Math.cos(hShift*0.017)-r*Math.sin(hShift*0.017)*0.5;
      const cb=b+Math.sin(hShift*0.01+dist)*30*light;
      ctx.fillStyle=`rgb(${Math.max(0,cr)|0},${Math.max(0,cg)|0},${Math.max(0,Math.min(255,cb))|0})`;
      ctx.fillRect(i*sliceW,y,sliceW+1,1);
    }

    // Edge glow
    ctx.fillStyle=`rgba(${120+tripHue%80},60,${180-tripHue%60},${light*0.08})`;
    ctx.fillRect(i*sliceW,drawStart,sliceW+1,1);
    ctx.fillRect(i*sliceW,drawEnd-1,sliceW+1,1);
  }

  // ── Enemies (billboard sprites — inverse determinant projection) ──
  const sorted=tripEnemies.map(e=>{
    const dx=e.x-tripCam.x, dy=e.y-tripCam.y;
    return{...e, dist:Math.sqrt(dx*dx+dy*dy), angle:Math.atan2(dy,dx), dx, dy};
  }).sort((a,b)=>b.dist-a.dist);

  sorted.forEach(e=>{
    if(e.deathTimer>=1) return;
    // Inverse camera matrix transform (lodev-style)
    const invDet=1/(tripCam.planeX*tripCam.dirY-tripCam.dirX*tripCam.planeY);
    const transformX=invDet*(tripCam.dirY*e.dx-tripCam.dirX*e.dy);
    const transformY=invDet*(-tripCam.planeY*e.dx+tripCam.planeX*e.dy);
    if(transformY<=0.1) return; // Behind camera
    let ad=e.angle-camAngle;
    while(ad>Math.PI) ad-=Math.PI*2;
    while(ad<-Math.PI) ad+=Math.PI*2;

    const screenX=Math.floor((sw/2)*(1+transformX/transformY));
    const spriteScale = e.alive ? 1 : Math.max(0,1-e.deathTimer);
    let spriteH=Math.abs(Math.floor(sh/transformY))*0.55*spriteScale;
    let spriteW=spriteH*0.5;
    const spriteY=bobH-spriteH/2 + (e.alive?0:e.deathTimer*spriteH*0.3);

    // Z-clip: check center column against z-buffer
    const rayIdx=Math.floor((screenX/sw)*numRays);
    if(rayIdx>=0&&rayIdx<numRays&&transformY>zBuf[rayIdx]) return;

    const eHues={beetle:60,moth:280,toad:120,fly:0};
    const eHue=(tripHue+(eHues[e.type]||0))%360;
    const alpha=e.hurtTimer>0?0.4+Math.sin(tripTime*30)*0.6: e.alive?1:1-e.deathTimer;
    ctx.globalAlpha=alpha;

    // Shadow on floor
    ctx.fillStyle=`rgba(0,0,0,${0.2/e.dist})`;
    ctx.beginPath();ctx.ellipse(screenX,bobH+spriteH*0.4,spriteW*0.6,spriteH*0.08,0,0,Math.PI*2);ctx.fill();

    // Body
    const eG=ctx.createRadialGradient(screenX,spriteY+spriteH*0.45,0,screenX,spriteY+spriteH*0.45,spriteW*0.6);
    eG.addColorStop(0,`hsl(${eHue},60%,45%)`);
    eG.addColorStop(1,`hsl(${eHue},50%,25%)`);
    ctx.fillStyle=eG;
    ctx.beginPath();ctx.ellipse(screenX,spriteY+spriteH*0.45,spriteW*0.5,spriteH*0.4,0,0,Math.PI*2);ctx.fill();

    if(e.type==='toad') {
      // Toad — bigger, wider mouth
      ctx.fillStyle=`hsl(${eHue},40%,35%)`;
      ctx.beginPath();ctx.ellipse(screenX,spriteY+spriteH*0.5,spriteW*0.55,spriteH*0.35,0,0,Math.PI*2);ctx.fill();
      // Warts
      ctx.fillStyle=`hsl(${eHue},30%,30%)`;
      for(let w=0;w<4;w++){
        ctx.beginPath();ctx.arc(screenX+(Math.sin(w*2.5)-0.5)*spriteW*0.4,spriteY+spriteH*(0.3+w*0.08),spriteW*0.06,0,Math.PI*2);ctx.fill();
      }
    }

    // Eyes
    const eyeW=spriteW*0.18, eyeSpan=spriteW*0.22;
    ctx.fillStyle=`hsl(${eHue},90%,75%)`;
    ctx.beginPath();ctx.arc(screenX-eyeSpan,spriteY+spriteH*0.3,eyeW,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(screenX+eyeSpan,spriteY+spriteH*0.3,eyeW,0,Math.PI*2);ctx.fill();
    // Pupils
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(screenX-eyeSpan,spriteY+spriteH*0.3,eyeW*0.45,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(screenX+eyeSpan,spriteY+spriteH*0.3,eyeW*0.45,0,Math.PI*2);ctx.fill();
    // Eye shine
    ctx.fillStyle=`rgba(255,255,255,0.6)`;
    ctx.beginPath();ctx.arc(screenX-eyeSpan-eyeW*0.2,spriteY+spriteH*0.28,eyeW*0.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(screenX+eyeSpan-eyeW*0.2,spriteY+spriteH*0.28,eyeW*0.2,0,Math.PI*2);ctx.fill();

    // Mouth
    if(e.type==='toad') {
      ctx.strokeStyle=`hsl(${eHue},40%,20%)`;ctx.lineWidth=spriteW*0.04;
      ctx.beginPath();ctx.arc(screenX,spriteY+spriteH*0.55,spriteW*0.25,0.2,Math.PI-0.2);ctx.stroke();
    }

    // Glow aura
    const gR=spriteW*0.8;
    const gg=ctx.createRadialGradient(screenX,spriteY+spriteH*0.4,0,screenX,spriteY+spriteH*0.4,gR);
    gg.addColorStop(0,`hsla(${eHue},80%,50%,0.08)`);
    gg.addColorStop(1,'transparent');
    ctx.fillStyle=gg;
    ctx.beginPath();ctx.arc(screenX,spriteY+spriteH*0.4,gR,0,Math.PI*2);ctx.fill();

    ctx.globalAlpha=1;
  });

  // ── Tongue weapon ──
  // Always show frog hands at bottom
  const handY=sh-40+bob*0.5;
  const handW=40, handH=30;
  // Left hand
  ctx.fillStyle='#22c55e';
  ctx.beginPath();ctx.ellipse(sw*0.3,handY,handW,handH,0.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#15803d';
  ctx.beginPath();ctx.ellipse(sw*0.3-8,handY+5,8,5,-0.3,0,Math.PI*2);ctx.fill();
  // Right hand
  ctx.fillStyle='#22c55e';
  ctx.beginPath();ctx.ellipse(sw*0.7,handY,handW,handH,-0.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#15803d';
  ctx.beginPath();ctx.ellipse(sw*0.7+8,handY+5,8,5,0.3,0,Math.PI*2);ctx.fill();

  // Tongue attack
  if(tripTongue.active) {
    const t01=1-tripTongue.timer/0.25;
    const extend=t01<0.5?easeOutBack(t01*2):1-(t01-0.5)*2; // shoot out then retract
    const tongueEndY=handY-extend*sh*0.5;
    const wobble=Math.sin(tripTime*25)*5*extend;
    // Shadow
    ctx.strokeStyle='rgba(0,0,0,0.2)';
    ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(sw/2+2,handY-10);
    ctx.quadraticCurveTo(sw/2+wobble+2,handY-extend*sh*0.25+2,sw/2+wobble+2,tongueEndY+2);
    ctx.stroke();
    // Tongue
    ctx.strokeStyle='#f87171';
    ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(sw/2,handY-10);
    ctx.quadraticCurveTo(sw/2+wobble,handY-extend*sh*0.25,sw/2+wobble,tongueEndY);
    ctx.stroke();
    // Center line
    ctx.strokeStyle='#fca5a5';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(sw/2,handY-10);
    ctx.quadraticCurveTo(sw/2+wobble,handY-extend*sh*0.25,sw/2+wobble,tongueEndY);
    ctx.stroke();
    // Tip
    ctx.fillStyle='#ef4444';
    ctx.beginPath();ctx.arc(sw/2+wobble,tongueEndY,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fca5a5';
    ctx.beginPath();ctx.arc(sw/2+wobble-2,tongueEndY-2,3,0,Math.PI*2);ctx.fill();
    ctx.lineCap='butt';
  }

  // ── Crosshair ──
  const chA=0.35+Math.sin(tripTime*3)*0.1;
  ctx.strokeStyle=`rgba(134,239,172,${chA})`;
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(sw/2-10,sh/2);ctx.lineTo(sw/2-3,sh/2);
  ctx.moveTo(sw/2+3,sh/2);ctx.lineTo(sw/2+10,sh/2);
  ctx.moveTo(sw/2,sh/2-10);ctx.lineTo(sw/2,sh/2-3);
  ctx.moveTo(sw/2,sh/2+3);ctx.lineTo(sw/2,sh/2+10);
  ctx.stroke();
  ctx.fillStyle=`rgba(134,239,172,${chA+0.1})`;
  ctx.beginPath();ctx.arc(sw/2,sh/2,1.5,0,Math.PI*2);ctx.fill();

  // ── Post-processing ──
  // Scanlines
  ctx.fillStyle='rgba(0,0,0,0.04)';
  for(let sy=0;sy<sh;sy+=2) ctx.fillRect(0,sy,sw,1);
  // Color tint
  ctx.fillStyle=`hsla(${tripHue},80%,50%,0.01)`;
  ctx.fillRect(0,0,sw,sh);
  // Vignette
  const vg=ctx.createRadialGradient(sw/2,sh/2,sw*0.22,sw/2,sh/2,sw*0.65);
  vg.addColorStop(0,'transparent');
  vg.addColorStop(1,'rgba(0,0,0,0.75)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,sw,sh);
  // Damage flash
  if(tripFlash>0) {
    ctx.fillStyle=`rgba(220,38,38,${tripFlash*0.25})`;
    ctx.fillRect(0,0,sw,sh);
  }

  // ── HUD ──
  // Health bar
  const hbW=120, hbH=8, hbX=20, hbY=sh-30;
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.fillRect(hbX-1,hbY-1,hbW+2,hbH+2);
  const hpPct=Math.max(0,tripCam.hp/100);
  const hpHue=hpPct>0.5?120:hpPct>0.25?40:0;
  ctx.fillStyle=`hsl(${hpHue},70%,45%)`;
  ctx.fillRect(hbX,hbY,hbW*hpPct,hbH);
  // HP text
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.font='10px Courier New';
  ctx.fillText(`HP ${Math.ceil(tripCam.hp)}`,hbX,hbY-4);

  // Kill counter
  ctx.fillStyle=`hsla(${tripHue},80%,60%,0.7)`;
  ctx.font='12px Courier New';
  ctx.fillText(`KILLS: ${tripKills}/${tripEnemies.length}`,20,25);
  const timeLeft=Math.max(0,Math.ceil(tripDuration-tripTime));
  const minutes=Math.floor(timeLeft/60);
  const seconds=timeLeft%60;
  ctx.fillText(`${minutes}:${seconds<10?'0':''}${seconds}`,20,42);

  // ── Mobile dual-stick UI ──
  if(isMobile) {
    // Left stick (move)
    if(tripTouch.moveId!==null) {
      const bx=tripTouch.moveSX, by=tripTouch.moveSY;
      ctx.strokeStyle='rgba(134,239,172,0.12)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(bx,by,JOY_RADIUS,0,Math.PI*2);ctx.stroke();
      const knx=bx+tripTouch.moveDx*JOY_RADIUS, kny=by+tripTouch.moveDy*JOY_RADIUS;
      ctx.fillStyle='rgba(134,239,172,0.2)';
      ctx.beginPath();ctx.arc(knx,kny,18,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(134,239,172,0.25)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(knx,kny,18,0,Math.PI*2);ctx.stroke();
    }
    // Right stick (look) + shoot button
    if(tripTouch.lookId!==null) {
      const bx=tripTouch.lookSX, by=tripTouch.lookSY;
      ctx.strokeStyle='rgba(239,68,68,0.12)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(bx,by,JOY_RADIUS,0,Math.PI*2);ctx.stroke();
      const knx=bx+tripTouch.lookDx*JOY_RADIUS, kny=by+tripTouch.lookDy*JOY_RADIUS;
      ctx.fillStyle='rgba(239,68,68,0.2)';
      ctx.beginPath();ctx.arc(knx,kny,18,0,Math.PI*2);ctx.fill();
    }
    // Shoot button
    const shootX=sw-60, shootY=sh-60;
    const shootAlpha=tripTongue.cooldown>0?0.15:0.3;
    ctx.strokeStyle=`rgba(239,68,68,${shootAlpha})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(shootX,shootY,32,0,Math.PI*2);ctx.stroke();
    const sG=ctx.createRadialGradient(shootX,shootY,0,shootX,shootY,32);
    sG.addColorStop(0,`rgba(239,68,68,${shootAlpha*0.5})`);sG.addColorStop(1,'transparent');
    ctx.fillStyle=sG;
    ctx.beginPath();ctx.arc(shootX,shootY,32,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(239,68,68,${shootAlpha+0.15})`;
    ctx.font='9px Courier New';ctx.textAlign='center';
    ctx.fillText('TONGUE',shootX,shootY+3);ctx.textAlign='start';
  }

  // ── Fade ──
  if(tripFadeIn>0) {
    ctx.fillStyle=`rgba(0,0,0,${tripFadeIn})`;
    ctx.fillRect(0,0,sw,sh);
    if(tripFadeIn>0.5&&tripTime<2) {
      ctx.fillStyle=`rgba(239,68,68,${(tripFadeIn-0.5)*1.5})`;
      ctx.font='20px Courier New';ctx.textAlign='center';
      ctx.fillText('D O N\'T   F I G H T   I T',sw/2,sh/2);
      ctx.textAlign='start';
    }
  }
}

// ─── HEX PUZZLE MINIGAME (Hextris-style) ───
let hexActive = false;
let hexTime = 0;
let hexFade = 0;
let hexScore = 0;
let hexCombo = 0;
let hexComboTimer = 0;
let hexGameOver = false;
let hexGameOverTimer = 0;

const HEX_SIDES = 6;
const HEX_COLORS = ['#4ade80','#c084fc','#f59e0b','#38bdf8','#f472b6'];
const HEX_MAX_ROWS = 8;
let hexRotation = 0; // current rotation angle
let hexTargetRotation = 0;
let hexPosition = 0; // which face is "up" (0-5)
let hexBlocks = []; // blocks[lane] = array of settled blocks
let hexFalling = []; // blocks currently falling
let hexParticles = [];
let hexSpawnTimer = 0;
let hexSpawnRate = 2; // seconds between spawns
let hexSpeed = 1.5;
let hexPulse = 0;
let hexShake = 0;

const hexSideLen = 60; // size of center hex
const hexBlockH = 18;

function startHex() {
  hexActive = true;
  hexTime = 0;
  hexFade = 1;
  hexScore = 0;
  hexCombo = 0;
  hexGameOver = false;
  hexGameOverTimer = 0;
  hexRotation = 30;
  hexTargetRotation = 30;
  hexPosition = 0;
  hexBlocks = [];
  for (let i = 0; i < HEX_SIDES; i++) hexBlocks.push([]);
  hexFalling = [];
  hexParticles = [];
  hexSpawnTimer = 1;
  hexSpawnRate = 2.2;
  hexSpeed = 1.2;
  hexPulse = 0;
  hexShake = 0;
  // Music shift
  if (musicStarted) {
    const t = audioCtx.currentTime;
    layers.sub.osc.type = 'triangle';
    layers.sub.osc.frequency.setTargetAtTime(65, t, 0.3);
    layers.pad.osc.type = 'sine';
    layers.pad.osc.frequency.setTargetAtTime(196, t, 0.3);
    layers.pad2.osc.frequency.setTargetAtTime(247, t, 0.3);
    layers.pad.filter.frequency.setTargetAtTime(600, t, 0.2);
    layers.pad.gain.gain.setTargetAtTime(0.15, t, 0.2);
    masterGain.gain.setTargetAtTime(0.6, t, 0.3);
  }
}

function endHex() {
  hexActive = false;
  score += Math.floor(hexScore / 10);
  document.getElementById('score').textContent = 'BUGS: ' + score;
  // Restore music
  if (musicStarted) {
    const t = audioCtx.currentTime;
    layers.sub.osc.type = 'sine';
    layers.sub.osc.frequency.setTargetAtTime(45, t, 0.5);
    layers.pad.osc.type = 'triangle';
    layers.pad.osc.frequency.setTargetAtTime(110, t, 0.5);
    layers.pad.filter.frequency.setTargetAtTime(400, t, 0.3);
    masterGain.gain.setTargetAtTime(0.7, t, 0.5);
  }
}

function hexRotate(dir) {
  if (hexGameOver) return;
  hexPosition = ((hexPosition + dir) + HEX_SIDES) % HEX_SIDES;
  hexTargetRotation -= dir * 60;
  sfx(280, 220, 0.06, 0.12);
  // All settled blocks rotate with the hex
  hexBlocks.forEach(lane => lane.forEach(b => b.targetAngle -= dir * 60));
}

// Wave pattern system (like Hextris)
let hexWaveType = 'random';
let hexWaveCt = 0;
function hexSpawnWave() {
  const spd = hexSpeed;
  const c = () => HEX_COLORS[Math.floor(Math.random()*HEX_COLORS.length)];
  const spawn = (lane, color) => {
    const angle = 90-(30+60*lane);
    hexFalling.push({ lane, color, angle, targetAngle:angle, dist:350, speed:spd, settled:false, opacity:1, deleted:0, tint:0 });
  };

  if (hexWaveType === 'random') {
    spawn(Math.floor(Math.random()*HEX_SIDES), c());
    hexWaveCt++;
    if (hexWaveCt > 5) {
      const patterns = ['double','spiral','circle','random','random'];
      hexWaveType = patterns[Math.floor(Math.random()*patterns.length)];
      hexWaveCt = 0;
    }
  } else if (hexWaveType === 'double') {
    const lane = Math.floor(Math.random()*HEX_SIDES);
    const col = c();
    spawn(lane, col);
    spawn((lane+1)%HEX_SIDES, c());
    hexWaveCt++;
    if (hexWaveCt > 3) { hexWaveType='random'; hexWaveCt=0; }
  } else if (hexWaveType === 'spiral') {
    spawn(hexWaveCt%HEX_SIDES, c());
    hexWaveCt++;
    if (hexWaveCt > 6) { hexWaveType='random'; hexWaveCt=0; }
  } else if (hexWaveType === 'circle') {
    const col = c();
    const numC = 1+Math.floor(Math.random()*2);
    const cols = [col]; for (let i=1;i<numC;i++) cols.push(c());
    for (let i=0;i<HEX_SIDES;i++) spawn(i, cols[i%numC]);
    hexWaveCt += 10;
    hexWaveType='random'; hexWaveCt=0;
  }
}

// Flood-fill matching (like actual Hextris)
function hexFloodFill(side, index, color, found) {
  // Check up/down in same lane and adjacent lanes at same index
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]]; // [side offset, index offset]
  for (const [ds, di] of dirs) {
    if (Math.abs(ds)===Math.abs(di)) continue; // skip diagonals
    const ns = (side+ds+HEX_SIDES)%HEX_SIDES;
    const ni = index+di;
    if (!hexBlocks[ns] || !hexBlocks[ns][ni]) continue;
    const b = hexBlocks[ns][ni];
    if (b.color===color && !b.deleted && !found.some(f=>f[0]===ns&&f[1]===ni)) {
      found.push([ns,ni]);
      hexFloodFill(ns,ni,color,found);
    }
  }
}

function hexConsolidate(side, index) {
  const b = hexBlocks[side][index];
  if (!b || b.deleted) return;
  const found = [[side,index]];
  hexFloodFill(side,index,b.color,found);
  if (found.length < 3) return;

  // Score
  hexCombo++;
  hexComboTimer = 3;
  const pts = found.length * found.length * hexCombo;
  hexScore += pts;
  hexPulse = 0.4 + hexCombo * 0.1;
  hexShake = 0.15 + hexCombo * 0.05;
  const freq = 350 + hexCombo * 60;
  sfx(freq, freq*1.8, 0.15, 0.2);
  if (hexCombo>1) sfx(freq*1.5, freq*2.5, 0.1, 0.12);
  intensityTarget = Math.min(1, intensityTarget+0.12);

  // Mark deleted + spawn particles
  found.forEach(([s,i]) => {
    const bl = hexBlocks[s][i];
    bl.deleted = 1;
    const bAngle = bl.angle*Math.PI/180;
    const bx = W/2 + Math.sin(bAngle)*bl.dist;
    const by = H/2 - Math.cos(bAngle)*bl.dist;
    for (let p=0;p<5;p++) {
      const a=Math.random()*Math.PI*2;
      hexParticles.push({ x:bx,y:by, vx:Math.cos(a)*(2+Math.random()*3), vy:Math.sin(a)*(2+Math.random()*3),
        life:0.5+Math.random()*0.4, color:bl.color, size:3+Math.random()*3 });
    }
  });
}

function hexRemoveDeleted() {
  let anyRemoved = false;
  for (let i=0;i<HEX_SIDES;i++) {
    const before = hexBlocks[i].length;
    hexBlocks[i] = hexBlocks[i].filter(b => !b.deleted);
    if (hexBlocks[i].length < before) anyRemoved = true;
    // Unsettled blocks above gaps need to re-settle
    const innerDist = hexSideLen*Math.sqrt(3)/2;
    hexBlocks[i].forEach((b,j) => {
      const targetDist = innerDist + hexBlockH*j;
      if (Math.abs(b.dist-targetDist) > 0.5) b.settling = true;
      b.targetDist = targetDist;
    });
  }
  // Check for chain reactions after removal
  if (anyRemoved) {
    setTimeout(() => {
      for (let i=0;i<HEX_SIDES;i++) {
        for (let j=0;j<hexBlocks[i].length;j++) {
          hexConsolidate(i,j);
        }
      }
    }, 150);
  }
}

function hexCheckGameOver() {
  for (let i = 0; i < HEX_SIDES; i++) {
    const active = hexBlocks[i].filter(b => !b.deleted).length;
    if (active > HEX_MAX_ROWS) return true;
  }
  return false;
}

function updateHex(dt) {
  hexTime += dt;
  hexFade = Math.max(0, hexFade-dt*2);
  hexPulse *= 0.93;
  hexShake *= 0.9;

  if (hexGameOver) {
    hexGameOverTimer += dt;
    if (hexGameOverTimer>3) { hexFade+=dt*2; if(hexFade>=1) endHex(); }
    return;
  }

  // Smooth rotation with spring physics (like Hextris)
  if (hexRotation < hexTargetRotation) hexRotation += 4*dt*60;
  else if (hexRotation > hexTargetRotation) hexRotation -= 4*dt*60;
  if (Math.abs(hexRotation-hexTargetRotation) < 1) hexRotation = hexTargetRotation;

  // Combo timer
  if (hexCombo>0) { hexComboTimer-=dt; if(hexComboTimer<=0) hexCombo=0; }

  // Spawn
  hexSpawnTimer -= dt;
  if (hexSpawnTimer<=0) {
    hexSpawnWave();
    hexSpawnTimer = hexSpawnRate;
    hexSpawnRate = Math.max(0.5, hexSpawnRate-0.01);
    hexSpeed = Math.min(4.5, hexSpeed+0.015);
  }

  // Update falling blocks
  const innerDist = hexSideLen*Math.sqrt(3)/2;
  hexFalling.forEach(b => {
    if (b.settled) return;
    b.dist -= b.speed*dt*55;
    // Determine which lane this block lands in (accounting for hex rotation)
    const adjustedLane = ((HEX_SIDES-b.lane+hexPosition)+HEX_SIDES)%HEX_SIDES;
    const stack = hexBlocks[adjustedLane];
    const targetDist = innerDist + hexBlockH*stack.length;

    if (b.dist <= targetDist) {
      b.dist = targetDist;
      b.settled = true;
      // Add to stack
      const newBlock = {
        color:b.color, dist:targetDist,
        angle: hexRotation + (adjustedLane*60), targetAngle: hexRotation + (adjustedLane*60),
        opacity:1, deleted:0, tint:0.6, settling:false, targetDist:targetDist,
      };
      stack.push(newBlock);
      hexShake = 0.08;
      sfx(120+stack.length*20, 80+stack.length*15, 0.04, 0.06);
      // Check matches
      hexConsolidate(adjustedLane, stack.length-1);
      // Check game over
      if (hexCheckGameOver()) {
        hexGameOver=true; hexGameOverTimer=0;
        sfx(100,40,0.5,0.2); hexShake=0.5;
      }
    }
  });
  hexFalling = hexFalling.filter(b => !b.settled);

  // Update settled blocks — tint fade, deletion animation, settling
  let needsRemoval = false;
  hexBlocks.forEach(lane => lane.forEach(b => {
    if (b.tint>0) b.tint = Math.max(0, b.tint-dt*2.5);
    if (b.deleted) {
      b.opacity -= dt*3;
      if (b.opacity<=0) needsRemoval=true;
    }
    // Smooth angle rotation (follows hex rotation)
    const aDiff = b.targetAngle-b.angle;
    if (Math.abs(aDiff)>0.5) b.angle += aDiff*dt*10;
    else b.angle = b.targetAngle;
    // Settling (gravity after blocks below are removed)
    if (b.settling && b.targetDist!==undefined) {
      b.dist += (b.targetDist-b.dist)*dt*8;
      if (Math.abs(b.dist-b.targetDist)<0.5) { b.dist=b.targetDist; b.settling=false; }
    }
  }));
  if (needsRemoval) hexRemoveDeleted();

  // Particles
  hexParticles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vx*=0.95; p.vy*=0.95; p.life-=dt; });
  hexParticles = hexParticles.filter(p => p.life>0);

  updateMusic(dt);
}

function drawHex() {
  const cx = W / 2, cy = H / 2;
  const shx = (Math.random() - 0.5) * hexShake * 12;
  const shy = (Math.random() - 0.5) * hexShake * 12;

  // Background — dark with subtle animated gradient
  const bgHue = (hexTime * 8) % 360;
  ctx.fillStyle = `hsl(${bgHue}, 20%, 4%)`;
  ctx.fillRect(0, 0, W, H);

  // Animated background rings
  for (let r = 0; r < 6; r++) {
    const ringR = 100 + r * 60 + Math.sin(hexTime * 0.5 + r) * 10;
    const ringAlpha = 0.02 + hexPulse * 0.02 + Math.sin(hexTime + r * 0.8) * 0.008;
    const ringHue = (bgHue + r * 30) % 360;
    ctx.strokeStyle = `hsla(${ringHue}, 40%, 30%, ${ringAlpha})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx + shx, cy + shy, ringR, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Floating background spores
  for (let i = 0; i < 30; i++) {
    const sx = ((Math.sin(hexTime * 0.2 + i * 4.1) + 1) / 2) * W;
    const sy = ((Math.cos(hexTime * 0.15 + i * 3.3) + 1) / 2) * H;
    const sparkle = Math.sin(hexTime * 2 + i * 1.7) * 0.5 + 0.5;
    const sHue = (bgHue + i * 25) % 360;
    ctx.fillStyle = `hsla(${sHue}, 60%, 50%, ${sparkle * 0.06})`;
    ctx.beginPath();
    ctx.arc(sx, sy, 1.5 + sparkle, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.save();
  ctx.translate(cx + shx, cy + shy);

  // ── Outer boundary hex (max rows indicator) ──
  const outerDist = hexSideLen * Math.sqrt(3) / 2 + hexBlockH * HEX_MAX_ROWS;
  const outerPulse = hexGameOver ? 0.4 + Math.sin(hexTime * 8) * 0.3 : 0.08 + hexPulse * 0.1;
  ctx.strokeStyle = hexGameOver ? `rgba(239,68,68,${outerPulse})` : `rgba(134,239,172,${outerPulse})`;
  ctx.lineWidth = 1.5;
  drawHexShape(0, 0, outerDist * 2 / Math.sqrt(3), hexRotation);

  // ── Combo timer on outer hex edges ──
  if (hexCombo > 0 && hexComboTimer > 0) {
    const comboAlpha = hexComboTimer / 2;
    for (let i = 0; i < HEX_SIDES; i++) {
      const a1 = (hexRotation + i * 60) * Math.PI / 180;
      const a2 = (hexRotation + (i + 1) * 60) * Math.PI / 180;
      const r = outerDist * 2 / Math.sqrt(3);
      ctx.strokeStyle = HEX_COLORS[hexCombo % HEX_COLORS.length];
      ctx.globalAlpha = comboAlpha * 0.5;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a1) * r, Math.sin(a1) * r);
      ctx.lineTo(Math.cos(a2) * r, Math.sin(a2) * r);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ── Settled blocks (proper trapezoid rendering like Hextris) ──
  hexBlocks.forEach((lane, i) => {
    lane.forEach((b, j) => {
      if (b.opacity <= 0) return;
      const bAngle = b.angle * Math.PI / 180;
      const d = b.dist + hexBlockH / 2;
      const bx = Math.sin(bAngle) * d;
      const by = -Math.cos(bAngle) * d;

      const innerW = 2 * b.dist / Math.sqrt(3);
      const outerW = 2 * (b.dist + hexBlockH) / Math.sqrt(3);

      ctx.globalAlpha = b.opacity;

      const p1 = rotateHexPt(-innerW/2, hexBlockH/2, b.angle);
      const p2 = rotateHexPt(innerW/2, hexBlockH/2, b.angle);
      const p3 = rotateHexPt(outerW/2, -hexBlockH/2, b.angle);
      const p4 = rotateHexPt(-outerW/2, -hexBlockH/2, b.angle);

      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.moveTo(bx+p1.x,by+p1.y);
      ctx.lineTo(bx+p2.x,by+p2.y);
      ctx.lineTo(bx+p3.x,by+p3.y);
      ctx.lineTo(bx+p4.x,by+p4.y);
      ctx.closePath();
      ctx.fill();

      // White tint flash on settle
      if (b.tint > 0) {
        ctx.fillStyle = `rgba(255,255,255,${b.tint*0.4})`;
        ctx.fill();
      }

      // Deleted blocks flash
      if (b.deleted) {
        ctx.fillStyle = '#fff';
        ctx.fill();
      }

      // Subtle border
      ctx.strokeStyle = `rgba(255,255,255,0.08)`;
      ctx.lineWidth = 0.5;
      ctx.stroke();

      ctx.globalAlpha = 1;
    });
  });

  // ── Falling blocks (with glow trail) ──
  hexFalling.forEach(b => {
    const bAngle = (90-(30+60*b.lane)) * Math.PI/180;
    const bx = Math.sin(bAngle)*b.dist;
    const by = -Math.cos(bAngle)*b.dist;
    const bw = 2*b.dist/Math.sqrt(3)*0.8;

    // Glow trail
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(bAngle - Math.PI/2);
    ctx.fillStyle = b.color;
    ctx.globalAlpha = 0.06;
    ctx.fillRect(-bw/2, -hexBlockH/2, bw, hexBlockH*4);
    // Block
    ctx.globalAlpha = 0.9;
    ctx.fillRect(-bw/2, -hexBlockH/2, bw, hexBlockH);
    // Inner highlight
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(-bw/2+2, -hexBlockH/2+2, bw-4, hexBlockH/2-2);
    ctx.restore();

    ctx.globalAlpha = 1;
  });

  // ── Center hexagon ──
  const hexFillHue = (hexTime * 10) % 360;
  ctx.fillStyle = `hsl(${hexFillHue}, 15%, 10%)`;
  drawHexShape(0, 0, hexSideLen, hexRotation, true);
  ctx.strokeStyle = `hsla(${hexFillHue}, 40%, 30%, ${0.3 + hexPulse * 0.3})`;
  ctx.lineWidth = 2;
  drawHexShape(0, 0, hexSideLen, hexRotation);
  // Inner glow
  const ig = ctx.createRadialGradient(0, 0, 0, 0, 0, hexSideLen);
  ig.addColorStop(0, `hsla(${hexFillHue}, 50%, 20%, ${0.1 + hexPulse * 0.15})`);
  ig.addColorStop(1, 'transparent');
  ctx.fillStyle = ig;
  ctx.beginPath();
  ctx.arc(0, 0, hexSideLen, 0, Math.PI * 2);
  ctx.fill();

  // ── Particles ──
  hexParticles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x - cx, p.y - cy, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    // Glow
    ctx.globalAlpha = p.life * 0.2;
    ctx.beginPath();
    ctx.arc(p.x - cx, p.y - cy, p.size * p.life * 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  ctx.restore();

  // ── HUD ──
  ctx.fillStyle = `rgba(134,239,172,0.6)`;
  ctx.font = '14px Courier New';
  ctx.fillText('SPORES: ' + hexScore, 20, 30);
  if (hexCombo > 1) {
    ctx.fillStyle = HEX_COLORS[hexCombo % HEX_COLORS.length];
    ctx.font = `${16 + hexCombo * 2}px Courier New`;
    ctx.fillText('x' + hexCombo, 20, 52);
  }

  // Mobile: tap zones hint
  if (isMobile && hexTime < 4) {
    const hintAlpha = Math.max(0, 1 - hexTime / 3) * 0.3;
    ctx.fillStyle = `rgba(134,239,172,${hintAlpha})`;
    ctx.font = '12px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('< TAP LEFT', W * 0.2, H / 2);
    ctx.fillText('TAP RIGHT >', W * 0.8, H / 2);
    ctx.textAlign = 'start';
  }

  // Beat pulse overlay
  if (hexPulse > 0.01) {
    ctx.fillStyle = `rgba(134,239,172,${hexPulse * 0.03})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.65);
  vg.addColorStop(0, 'transparent');
  vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // Game over overlay
  if (hexGameOver) {
    ctx.fillStyle = `rgba(0,0,0,${Math.min(0.6, hexGameOverTimer * 0.3)})`;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(239,68,68,${Math.min(0.8, hexGameOverTimer * 0.4)})`;
    ctx.font = '24px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('OVERFLOW', W / 2, H / 2 - 15);
    ctx.fillStyle = `rgba(134,239,172,${Math.min(0.5, hexGameOverTimer * 0.25)})`;
    ctx.font = '14px Courier New';
    ctx.fillText('Score: ' + hexScore, W / 2, H / 2 + 15);
    ctx.textAlign = 'start';
  }

  // Fade
  if (hexFade > 0) {
    ctx.fillStyle = `rgba(0,0,0,${hexFade})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// Hex drawing helpers
function drawHexShape(x, y, size, angle, fill) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (angle + i * 60) * Math.PI / 180;
    const px = x + Math.cos(a) * size;
    const py = y + Math.sin(a) * size;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (fill) ctx.fill();
  else ctx.stroke();
}

function rotateHexPt(x, y, angle) {
  const rad = angle * Math.PI / 180;
  return {
    x: x * Math.cos(rad) - y * Math.sin(rad),
    y: x * Math.sin(rad) + y * Math.cos(rad),
  };
}

// ─── LOOP ───
let lastTime=0;
function loop(timestamp) {
  const dt=Math.min((timestamp-lastTime)/1000,0.05);
  lastTime=timestamp;

  if (tripActive) {
    updateTrip(dt);
    drawTrip();
  } else if (hexActive) {
    updateHex(dt);
    drawHex();
  } else {
    update(dt);
    draw();
  }

  screenShake *= 0.9;
  requestAnimationFrame(loop);
}

function startGame() {
  document.getElementById('start-screen').style.display='none';
  gameRunning=true;
  initAudio();
  initWorld();
}

// Hex mode input handlers
window.addEventListener('keydown', e => {
  if (!hexActive || hexGameOver) return;
  if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') hexRotate(1);
  if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') hexRotate(-1);
  if (e.key === 'Escape') { hexGameOver = true; hexGameOverTimer = 2; }
});
canvas.addEventListener('touchstart', e => {
  if (!hexActive || hexGameOver) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.clientX < W / 2) hexRotate(1);
    else hexRotate(-1);
  }
}, { passive: false });
canvas.addEventListener('mousedown', e => {
  if (!hexActive || hexGameOver) return;
  if (e.clientX < W / 2) hexRotate(1);
  else hexRotate(-1);
});

// Trip mode input handlers
window.addEventListener('mousedown', e => { if(tripActive) tripShoot(); });
window.addEventListener('keydown', e => {
  if(tripActive && (e.code==='Space'||e.key.toLowerCase()==='e')) tripShoot();
});

// Mobile dual-stick for trip mode
canvas.addEventListener('touchstart', e => {
  if(!tripActive) return;
  e.preventDefault();
  for(const t of e.changedTouches) {
    const x=t.clientX, y=t.clientY;
    // Shoot button (bottom-right circle)
    const shootDist=Math.sqrt(Math.pow(x-(W-60),2)+Math.pow(y-(H-60),2));
    if(shootDist<45) { tripShoot(); continue; }
    // Left half = move stick
    if(x<W*0.45 && tripTouch.moveId===null) {
      tripTouch.moveId=t.identifier;
      tripTouch.moveSX=x; tripTouch.moveSY=y;
      tripTouch.moveDx=0; tripTouch.moveDy=0;
    }
    // Right half = look stick
    else if(x>=W*0.45 && tripTouch.lookId===null) {
      tripTouch.lookId=t.identifier;
      tripTouch.lookSX=x; tripTouch.lookSY=y;
      tripTouch.lookDx=0; tripTouch.lookDy=0;
    }
  }
}, {passive:false});

canvas.addEventListener('touchmove', e => {
  if(!tripActive) return;
  e.preventDefault();
  for(const t of e.changedTouches) {
    if(t.identifier===tripTouch.moveId) {
      let dx=t.clientX-tripTouch.moveSX, dy=t.clientY-tripTouch.moveSY;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d>JOY_DEAD) {
        const c=Math.min(d,JOY_RADIUS);
        tripTouch.moveDx=(dx/d)*(c/JOY_RADIUS);
        tripTouch.moveDy=(dy/d)*(c/JOY_RADIUS);
      } else { tripTouch.moveDx=0; tripTouch.moveDy=0; }
    }
    if(t.identifier===tripTouch.lookId) {
      let dx=t.clientX-tripTouch.lookSX, dy=t.clientY-tripTouch.lookSY;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d>JOY_DEAD) {
        const c=Math.min(d,JOY_RADIUS);
        tripTouch.lookDx=(dx/d)*(c/JOY_RADIUS);
        tripTouch.lookDy=(dy/d)*(c/JOY_RADIUS);
      } else { tripTouch.lookDx=0; tripTouch.lookDy=0; }
    }
  }
}, {passive:false});

canvas.addEventListener('touchend', e => {
  if(!tripActive) return;
  for(const t of e.changedTouches) {
    if(t.identifier===tripTouch.moveId) { tripTouch.moveId=null; tripTouch.moveDx=0; tripTouch.moveDy=0; }
    if(t.identifier===tripTouch.lookId) { tripTouch.lookId=null; tripTouch.lookDx=0; tripTouch.lookDy=0; }
  }
});

requestAnimationFrame(loop);
</script>
