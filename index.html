<!DOCTYPE html>

      text-shadow: 0 0 15px rgba(253,224,71,0.6);

      margin-top: 4px;

      position: fixed; top: 20px; right: 20px;

    #start-screen {

    #start-screen .prompt { color: #3a7a45; font-size: 0.8rem; animation: pulse 2.5s ease-in-out infinite; letter-spacing: 2px; }
    #start-screen .controls { color: #1a3a20; font-size: 0.7rem; margin-top: 40px; line-height: 2; letter-spacing: 1px; }
    #start-screen .controls span { color: #2a5a30; }

<body>

<div id="start-screen" onclick="startGame()">
  <h1>SWAMP</h1>
  <div class="sub">Zone 1 — The Surface Pond</div>
  <div class="prompt">[ click to begin ]</div>
  <div class="controls" id="controls-desktop">
    <span>WASD</span> move &nbsp;&nbsp; <span>MOUSE</span> aim &nbsp;&nbsp; <span>CLICK</span> tongue &nbsp;&nbsp; <span>SPACE</span> belly flop &nbsp;&nbsp; <span>E</span> talk
  </div>
  <div class="controls" id="controls-mobile" style="display:none">
    <span>LEFT</span> drag to move &nbsp;&nbsp; <span>RIGHT</span> tap to tongue &nbsp;&nbsp; <span>FLOP</span> button bottom-right
  </div>
</div>

<div id="ui">
  <div id="score">BUGS: 0</div>
  <div id="combo"></div>
</div>
<div id="title-ui">SWAMP<br>The Surface Pond</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ─── EASING ───
function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -10 * t) * Math.sin((t - 0.075) * (2 * Math.PI) / 0.3) + 1;
}
function easeOutBack(t) { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function lerp(a,b,t) { return a + (b - a) * t; }
function smoothDamp(current, target, velocity, smoothTime, dt) {
  const omega = 2 / smoothTime;
  const x = omega * dt;
  const exp = 1 / (1 + x + 0.48*x*x + 0.235*x*x*x);
  const change = current - target;
  const temp = (velocity + omega * change) * dt;
  velocity = (velocity - omega * temp) * exp;
  return { value: target + (change + temp) * exp, velocity };
}

// ─── AUDIO ───
let audioCtx, masterGain, musicStarted = false;
let layers = {};
let intensityTarget = 0, intensity = 0;
let beatTimer = 0, beatCount = 0;
const BPM = 88;
const beatInterval = 60 / BPM;
let screenPulse = 0, screenShake = 0;
let onBeat = false;

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // Force resume on mobile — iOS/Chrome require this
  if (audioCtx.state === 'suspended') audioCtx.resume();
  // Also resume on any future touch/click (iOS sometimes re-suspends)
  const unlockAudio = () => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    // Play a silent buffer to fully unlock on iOS
    const silentBuf = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
    const src = audioCtx.createBufferSource();
    src.buffer = silentBuf;
    src.connect(audioCtx.destination);
    src.start(0);
  };
  document.addEventListener('touchstart', unlockAudio, { once: false });
  document.addEventListener('touchend', unlockAudio, { once: false });
  document.addEventListener('click', unlockAudio, { once: false });
  unlockAudio();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.7;
  masterGain.connect(audioCtx.destination);
  // Reverb
  const conv = audioCtx.createConvolver();
  const rate = audioCtx.sampleRate, len = rate * 2;
  const imp = audioCtx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) { const d = imp.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len,2.5); }
  conv.buffer = imp;
  const rvG = audioCtx.createGain(); rvG.gain.value = 0.3;
  conv.connect(rvG); rvG.connect(masterGain);
  // Sub bass
  const sub = audioCtx.createOscillator(); sub.type='sine'; sub.frequency.value=45;
  const subG = audioCtx.createGain(); subG.gain.value=0.3;
  sub.connect(subG); subG.connect(masterGain); sub.connect(conv); sub.start();
  layers.sub = {osc:sub,gain:subG};
  // Pad
  const pad = audioCtx.createOscillator(); pad.type='triangle'; pad.frequency.value=110;
  const padG = audioCtx.createGain(); padG.gain.value=0.18;
  const padF = audioCtx.createBiquadFilter(); padF.type='lowpass'; padF.frequency.value=400;
  pad.connect(padF); padF.connect(padG); padG.connect(masterGain); padF.connect(conv); pad.start();
  layers.pad = {osc:pad,gain:padG,filter:padF};
  // Pad 2
  const pad2 = audioCtx.createOscillator(); pad2.type='triangle'; pad2.frequency.value=110.5;
  const pad2G = audioCtx.createGain(); pad2G.gain.value=0.12;
  pad2.connect(pad2G); pad2G.connect(masterGain); pad2.start();
  layers.pad2 = {osc:pad2,gain:pad2G};
  // Pluck
  const pluck = audioCtx.createOscillator(); pluck.type='square'; pluck.frequency.value=220;
  const plkF = audioCtx.createBiquadFilter(); plkF.type='lowpass'; plkF.frequency.value=800;
  const plkG = audioCtx.createGain(); plkG.gain.value=0;
  pluck.connect(plkF); plkF.connect(plkG); plkG.connect(masterGain); pluck.start();
  layers.pluck = {osc:pluck,gain:plkG,filter:plkF};
  // Hi
  const hi = audioCtx.createOscillator(); hi.type='sine'; hi.frequency.value=880;
  const hiG = audioCtx.createGain(); hiG.gain.value=0;
  hi.connect(hiG); hiG.connect(masterGain); hi.start();
  layers.hi = {osc:hi,gain:hiG};
  musicStarted = true;
}

const bassNotes = [45,45,50,45,55,50,45,45,45,50,55,60,55,50,45,45];
const padNotes = [110,130.81,146.83,130.81,110,123.47,146.83,130.81];
const pluckNotes = [220,261.63,293.66,329.63,349.23,329.63,293.66,261.63,220,246.94,293.66,329.63,349.23,392,349.23,329.63];

function updateMusic(dt) {
  if (!musicStarted) return;
  onBeat = false;
  beatTimer += dt;
  if (beatTimer >= beatInterval) {
    beatTimer -= beatInterval;
    beatCount++;
    onBeat = true;
    const t = audioCtx.currentTime;
    layers.sub.osc.frequency.setTargetAtTime(bassNotes[beatCount%bassNotes.length], t, 0.08);
    layers.sub.gain.gain.setValueAtTime(0.5, t);
    layers.sub.gain.gain.setTargetAtTime(0.35, t+0.1, 0.2);
    if (beatCount%4===0) {
      const pn = padNotes[(beatCount/4)%padNotes.length];
      layers.pad.osc.frequency.setTargetAtTime(pn, t, 0.3);
      layers.pad2.osc.frequency.setTargetAtTime(pn*1.003, t, 0.3);
    }
    const pln = pluckNotes[beatCount%pluckNotes.length];
    layers.pluck.osc.frequency.setTargetAtTime(pln, t, 0.01);
    if (intensity>0.2) {
      layers.pluck.gain.gain.setValueAtTime(intensity*0.2, t);
      layers.pluck.gain.gain.setTargetAtTime(0, t+0.05, 0.08);
    }
    if (intensity>0.5 && beatCount%2===1) {
      layers.hi.gain.gain.setValueAtTime(intensity*0.04, t);
      layers.hi.gain.gain.setTargetAtTime(0, t+0.02, 0.03);
    }
    screenPulse = 0.12 + intensity * 0.15;
  }
  intensity += (intensityTarget - intensity) * dt * 2.5;
  intensityTarget = Math.max(0, intensityTarget - dt * 0.08);
  if (musicStarted) {
    layers.pad.filter.frequency.setTargetAtTime(400+intensity*600, audioCtx.currentTime, 0.1);
    layers.pluck.filter.frequency.setTargetAtTime(600+intensity*1200, audioCtx.currentTime, 0.1);
  }
}

function sfx(freq, freqEnd, dur, vol, type='sine') {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freqEnd, t+dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+dur+0.01);
}

function sfxNoise(dur, vol, freq) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*dur, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=1;
  const g = audioCtx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t+dur);
}

// ─── GAME STATE ───
let gameRunning = false, score = 0, combo = 0, comboTimer = 0;
const camera = { x:0, y:0, vx:0, vy:0 };
const WORLD_W = 3000, WORLD_H = 2200;
let globalTime = 0;

// ─── FROG ───
const frog = {
  x: WORLD_W/2, y: WORLD_H/2,
  vx: 0, vy: 0,
  dir: 0, moveAngle: 0, isMoving: false,
  // Animation states
  scaleX: 1, scaleY: 1,
  targetScaleX: 1, targetScaleY: 1,
  rotation: 0, targetRotation: 0,
  // Walk cycle
  walkPhase: 0,
  hopHeight: 0, hopVel: 0, isHopping: false,
  landSquash: 0,
  // Eyes
  eyeBlink: 0, blinkTimer: 3,
  eyeStretch: 0, // surprise stretch
  pupilDilate: 1, // dilate on action
  lookX: 0, lookY: 0, lookTargetX: 0, lookTargetY: 0,
  // Cheeks
  cheekPuff: 0,
  // Breathing
  breathe: 0,
  // Tongue eat animation
  mouthOpen: 0,
  gulpTimer: 0,
  // Belly flop
  isFlopping: false, flopTimer: 0, flopRadius: 0,
  flopWindup: 0, flopAirtime: 0,
  // Landing
  landTimer: 0,
  // Idle anims
  idleTimer: 0, idleAnim: 'none', idleAnimTimer: 0,
  // Trail
  trail: [],
};

const tongue = {
  active: false, progress: 0, returning: false,
  tx: 0, ty: 0, caught: null, length: 210, speed: 11,
  // Curve animation
  wobble: 0,
};

let bugs=[], lilyPads=[], ripples=[], particles=[];
let fireflies=[], reeds=[], bubbles=[], cattails=[];
let waterPlants=[], clouds=[], splashDrops=[];

// ─── ZONE SYSTEM ───
let currentZone = 1;
let gateOpen = false;
let gateConfirmShown = false;
let zoneTransition = { active: false, alpha: 0, phase: 'none', targetZone: 0 };
// Zone palettes
const ZONES = {
  1: {
    name: 'The Surface Pond',
    waterBase: [6,14,8], waterHighlight: [134,239,172],
    fogColor: [134,200,160],
    bgColor: '#060e08',
    requiredBugs: 3,
  },
  2: {
    name: 'The Bog',
    waterBase: [8,4,16], waterHighlight: [180,80,220],
    fogColor: [160,80,200],
    bgColor: '#0a0412',
    requiredBugs: 8,
  },
};

function loadZone(zoneNum) {
  currentZone = zoneNum;
  gateOpen = false;
  gateConfirmShown = false;
  const zone = ZONES[currentZone];
  // Clear entities
  bugs=[]; lilyPads=[]; fireflies=[]; reeds=[]; cattails=[];
  waterPlants=[]; clouds=[]; bubbles=[]; ripples=[]; particles=[]; splashDrops=[];
  npcs.length = 0;
  frog.trail = [];
  // Reset frog position (enter from left)
  frog.x = 120; frog.y = WORLD_H / 2;
  frog.vx = 0; frog.vy = 0;
  camera.x = frog.x - W/2; camera.y = frog.y - H/2;
  // Reinit
  initNPCs();
  initWorldEntities();
  // Update UI
  document.getElementById('title-ui').innerHTML = 'SWAMP<br>' + zone.name;
  // Zone 2 specific music — frog rave
  if (currentZone === 2 && musicStarted) {
    const t = audioCtx.currentTime;
    layers.sub.osc.frequency.setTargetAtTime(55, t, 0.3);
    layers.sub.osc.type = 'sawtooth'; // gritty rave bass
    layers.sub.gain.gain.setTargetAtTime(0.4, t, 0.3);
    layers.pad.osc.frequency.setTargetAtTime(146.83, t, 0.3);
    layers.pad.osc.type = 'sawtooth';
    layers.pad2.osc.frequency.setTargetAtTime(148, t, 0.3);
    layers.pad.filter.frequency.setTargetAtTime(700, t, 0.3);
    layers.pad.gain.gain.setTargetAtTime(0.12, t, 0.3);
    layers.pluck.gain.gain.setTargetAtTime(0.08, t, 0.3);
    masterGain.gain.setTargetAtTime(0.75, t, 0.3);
    // Boost intensity baseline so rave always has energy
    intensityTarget = Math.max(intensityTarget, 0.3);
  }
}

function initWorld() {
  initNPCs();
  initWorldEntities();
}

function initWorldEntities() {
  for (let c=0;c<7;c++) {
    const cx=200+Math.random()*(WORLD_W-400), cy=200+Math.random()*(WORLD_H-400);
    for (let i=0;i<3+Math.floor(Math.random()*4);i++) {
      lilyPads.push({
        x:cx+(Math.random()-0.5)*160, y:cy+(Math.random()-0.5)*130,
        size:20+Math.random()*18, rot:Math.random()*Math.PI*2,
        bobPhase:Math.random()*Math.PI*2,
        hasFlower:Math.random()<0.2,
        flowerColor:Math.random()<0.5?'#f9a8d4':'#fde68a',
        shade:Math.random()*0.15,
        bobAmount: 1.5 + Math.random() * 1.5,
      });
    }
  }
  const bugCount = currentZone === 1 ? 18 : 24;
  for (let i=0;i<bugCount;i++) spawnBug();
  const fireflyCount = currentZone === 1 ? 50 : 25;
  for (let i=0;i<fireflyCount;i++) {
    fireflies.push({
      cx:Math.random()*WORLD_W, cy:Math.random()*WORLD_H,
      x:0, y:0,
      phase:Math.random()*Math.PI*2,
      speed:0.15+Math.random()*0.5,
      radius:20+Math.random()*80,
      angle:Math.random()*Math.PI*2,
      size:1+Math.random()*2,
      pulseSpeed: 0.5 + Math.random() * 1.5,
    });
  }
  for (let i=0;i<65;i++) {
    const edge=Math.random()<0.4;
    reeds.push({
      x:edge?(Math.random()<0.5?Math.random()*120:WORLD_W-Math.random()*120):Math.random()*WORLD_W,
      y:edge?Math.random()*WORLD_H:(Math.random()<0.5?Math.random()*120:WORLD_H-Math.random()*120),
      height:25+Math.random()*40,
      swayPhase:Math.random()*Math.PI*2,
      thickness:1+Math.random()*1.5,
      swaySpeed: 1.2 + Math.random() * 1.2,
    });
  }
  for (let i=0;i<18;i++) {
    cattails.push({ x:Math.random()*WORLD_W, y:Math.random()*WORLD_H,
      height:35+Math.random()*25, swayPhase:Math.random()*Math.PI*2 });
  }
  for (let i=0;i<35;i++) {
    waterPlants.push({ x:Math.random()*WORLD_W, y:Math.random()*WORLD_H,
      segments:3+Math.floor(Math.random()*4), phase:Math.random()*Math.PI*2,
      hue:100+Math.random()*40 });
  }
  for (let i=0;i<25;i++) {
    bubbles.push({ x:Math.random()*WORLD_W, y:Math.random()*WORLD_H,
      speed:0.15+Math.random()*0.4, size:1+Math.random()*3,
      phase:Math.random()*Math.PI*2, wobble:Math.random()*2 });
  }
  for (let i=0;i<10;i++) {
    clouds.push({ x:Math.random()*WORLD_W, y:Math.random()*WORLD_H,
      size:100+Math.random()*250, speed:0.08+Math.random()*0.25,
      alpha:0.015+Math.random()*0.025 });
  }
}

function spawnBug() {
  const types=['fly','fly','dragonfly','beetle','moth'];
  const type=types[Math.floor(Math.random()*types.length)];
  const sizes={fly:4,dragonfly:7,beetle:6,moth:5};
  bugs.push({
    x:100+Math.random()*(WORLD_W-200), y:100+Math.random()*(WORLD_H-200),
    vx:(Math.random()-0.5)*1.5, vy:(Math.random()-0.5)*1.5,
    type, size:sizes[type], alive:true,
    wingPhase:Math.random()*Math.PI*2,
    changeTimer:Math.random()*3,
    hp:type==='beetle'?2:1,
    bobPhase: Math.random()*Math.PI*2,
    bobHeight: 2 + Math.random() * 3,
    trail:[], deathAnim: 0, dying: false,
    scaleAnim: 1, spawnAnim: 1,
    rotation: 0,
  });
}

// ─── NPCs ───
const npcs = [];
const dialogue = {
  active: false,
  npc: null,
  lines: [],
  lineIndex: 0,
  charIndex: 0,
  charTimer: 0,
  charSpeed: 0.03,
  choices: null,
  choiceIndex: 0,
  waitingForInput: false,
  fullLineShown: false,
  onComplete: null,
};

function initNPCs() {
  // Test NPC — Shaman frog near spawn, gives rare bug for DOOM mode
  npcs.push({
    x: WORLD_W/2 + 60, y: WORLD_H/2 + 60,
    type: 'mushroom',
    name: 'Shaman Gorp',
    size: 18,
    color: '#f43f5e',
    eyeColor: '#fda4af',
    bobPhase: Math.random()*Math.PI*2,
    dir: -1,
    talked: false,
    dialogue: [
      { text: "Psst... you.\nYou look like someone\nwho wants to see things.", speaker: "Shaman Gorp" },
      { text: "I have a rare bug.\nA Voidfly. One bite and\nyou'll see the other side.", speaker: "Shaman Gorp" },
      { text: "The swamp has layers,\nkid. Layers most frogs\nnever see.", speaker: "Shaman Gorp" },
      {
        text: "Want to eat the Voidfly?",
        speaker: "Shaman Gorp",
        choices: [
          { text: "Feed me.", response: "*The Voidfly glows purple.\nYou swallow it whole.\nYour vision melts.*\n\n...Here we go.", onSelect: 'trip' },
          { text: "No thanks.", response: "Your loss.\nI'll be here when\nyou change your mind." },
        ]
      },
    ],
    dialogueAfter: [
      {
        text: "Back for more?\nAnother Voidfly?",
        speaker: "Shaman Gorp",
        choices: [
          { text: "Hit me again.", response: "*crunch*\n\n...See you on\nthe other side.", onSelect: 'trip' },
          { text: "I'm good.", response: "Lightweight." },
        ]
      },
    ],
  });

  // Hex puzzle NPC
  npcs.push({
    x: WORLD_W/2 - 150, y: WORLD_H/2 - 80,
    type: 'turtle',
    name: 'Oracle Shell',
    size: 20,
    color: '#0ea5e9',
    eyeColor: '#7dd3fc',
    bobPhase: Math.random()*Math.PI*2,
    dir: 1,
    talked: false,
    dialogue: [
      { text: "The spores are falling.\nFalling, falling, always\nfalling.", speaker: "Oracle Shell" },
      { text: "Someone needs to sort them\nbefore they pile up and\nchoke the pond.", speaker: "Oracle Shell" },
      {
        text: "Will you help me catch\nthe spores?",
        speaker: "Oracle Shell",
        choices: [
          { text: "Let's do it.", response: "Focus your mind.\nMatch the colors.\nDon't let them overflow.", onSelect: 'hex' },
          { text: "Not now.", response: "The spores don't wait\nfor anyone..." },
        ]
      },
    ],
    dialogueAfter: [
      {
        text: "The spores are falling\nagain. Help?",
        speaker: "Oracle Shell",
        choices: [
          { text: "I'm ready.", response: "Good. Focus.", onSelect: 'hex' },
          { text: "Later.", response: "*sighs in turtle*" },
        ]
      },
    ],
  });

  npcs.push({
    x: WORLD_W/2 + 200, y: WORLD_H/2 - 100,
    type: 'oldfrog',
    name: 'Elder Croak',
    size: 22,
    color: '#6b8e23',
    eyeColor: '#daa520',
    bobPhase: Math.random()*Math.PI*2,
    dir: -1,
    talked: false,
    dialogue: [

function startDialogue(npc) {
  // Gatekeeper has dynamic dialogue based on score
  if (npc.isGatekeeper && npc.talked) {
    const needed = ZONES[currentZone].requiredBugs;
    if (score >= needed && !gateOpen) {
      npc.dialogueAfter = [
        { text: `${score} bugs. Not bad.`, speaker: "Grimjaw" },
        {
          text: "The Marsh awaits.\nYou sure about this?",
          speaker: "Grimjaw",
          choices: [
            { text: "Open the gate.", response: "...Don't say I didn't warn you.", onSelect: 'openGate' },
            { text: "Not yet.", response: "Smart. Get stronger first." },
          ]
        },
      ];
    } else if (gateOpen) {
      npc.dialogueAfter = [
        { text: "Gate's open. Go on through.\n...or don't. Your funeral.", speaker: "Grimjaw" },
      ];
    } else {
      const remaining = needed - score;
      npc.dialogueAfter = [
        { text: `You got ${score} bugs.\nNeed ${remaining} more.`, speaker: "Grimjaw" },
        { text: "Come back when you're ready.", speaker: "Grimjaw" },
      ];
    }
  }
  const lines = npc.talked ? npc.dialogueAfter : npc.dialogue;
  dialogue.active = true;
  dialogue.npc = npc;
  dialogue.lines = lines;
  dialogue.lineIndex = 0;
  dialogue.charIndex = 0;
  dialogue.charTimer = 0;
  dialogue.choices = null;
  dialogue.choiceIndex = 0;
  dialogue.waitingForInput = false;
  dialogue.fullLineShown = false;
}

function advanceDialogue() {
  if (!dialogue.active) return;

  const line = dialogue.lines[dialogue.lineIndex];

  // If text is still typing, show full line
  if (!dialogue.fullLineShown) {
    dialogue.charIndex = line.text.length;
    dialogue.fullLineShown = true;
    // If this line has choices, show them now
    if (line.choices) {
      dialogue.choices = line.choices;
      dialogue.choiceIndex = 0;
    }
    return;
  }

  // If showing choices, select current choice
  if (dialogue.choices) {
    const choice = dialogue.choices[dialogue.choiceIndex];
    // Handle special actions
    if (choice.onSelect === 'hex') {
      dialogue.active = false;
      startHex();
      return;
    }
    if (choice.onSelect === 'trip') {
      // Dealer requires 50 bugs, Shaman is free
      const isDealer = dialogue.npc && dialogue.npc.name === '???';
      if (isDealer && score < 50) {
        choice.response = `You only got ${score} bugs.\nCome back with 50.\n\n*fades back into shadow*`;
        choice.onSelect = null;
      } else {
        if (isDealer) { score -= 50; document.getElementById('score').textContent = 'BUGS: ' + score; }
        dialogue.active = false;
        startTrip();
        return;
      }
    }
    if (choice.onSelect === 'enterZone') {
      // Trigger the zone transition
      dialogue.active = false;
      zoneTransition.active = true;
      zoneTransition.phase = 'fadeOut';
      zoneTransition.alpha = 0;
      zoneTransition.targetZone = currentZone + 1;
      return;
    }
    if (choice.onSelect === 'openGate') {
      gateOpen = true;
      screenShake = 0.3;
      // Gate opening ripples
      const gk = npcs.find(n => n.isGatekeeper);
      if (gk) {
        for (let i = 0; i < 3; i++) ripples.push({ x: WORLD_W - 80, y: WORLD_H/2, radius: i*15, maxRadius: 80+i*30, alpha: 0.6, width: 2 });
      }
      sfx(80, 200, 0.5, 0.15);
    }
    // Show response as next line (skip if just "...")
    if (choice.response === '...') {
      dialogue.choices = null;
      dialogue.lineIndex = dialogue.lines.length; // Jump to end
      dialogue.active = false;
      if (dialogue.npc) dialogue.npc.talked = true;
      gateConfirmShown = false;
      return;
    }
    dialogue.lines.splice(dialogue.lineIndex + 1, 0, {
      text: choice.response,
      speaker: dialogue.npc.name,
    });
    dialogue.choices = null;
    dialogue.lineIndex++;
    dialogue.charIndex = 0;
    dialogue.charTimer = 0;
    dialogue.fullLineShown = false;
    return;
  }

  // Next line
  dialogue.lineIndex++;
  if (dialogue.lineIndex >= dialogue.lines.length) {
    // End dialogue
    dialogue.active = false;
    if (dialogue.npc) dialogue.npc.talked = true;
    gateConfirmShown = false; // Reset so player can walk to gate again
    return;
  }
  dialogue.charIndex = 0;
  dialogue.charTimer = 0;
  dialogue.fullLineShown = false;
}

function dialogueChoiceUp() {
  if (dialogue.choices) {
    dialogue.choiceIndex = (dialogue.choiceIndex - 1 + dialogue.choices.length) % dialogue.choices.length;
  }
}
function dialogueChoiceDown() {
  if (dialogue.choices) {
    dialogue.choiceIndex = (dialogue.choiceIndex + 1) % dialogue.choices.length;
  }
}

function getNearestNPC() {
  let nearest = null, nearestDist = 60;
  npcs.forEach(npc => {
    const dx = frog.x - npc.x, dy = frog.y - npc.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if (dist < nearestDist) { nearest = npc; nearestDist = dist; }
  });
  return nearest;
}

const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const keys={};
let mouseX=W/2, mouseY=H/2, mouseWorld={x:0,y:0};

// Touch state
const touch = {
  // Joystick (left side) — dynamic positioning
  joyId: null,
  joyBaseX: 0, joyBaseY: 0,     // base circle center (where you first touched)
  joyKnobX: 0, joyKnobY: 0,     // current knob position
  joyDx: 0, joyDy: 0,           // normalized -1 to 1
  joyForce: 0,                   // 0 to 1 analog force
  joyActive: false,
  joyFadeOut: 0,                 // fade out alpha after release
  joyLastBaseX: 0, joyLastBaseY: 0, // for fade out position
  // Attack (right side tap)
  atkId: null,
  // Flop button
  flopId: null,
};
const JOY_RADIUS = 55;
const JOY_DEAD = 10;
const JOY_FOLLOW_THRESHOLD = JOY_RADIUS * 1.3; // base follows thumb if too far

function shootTongue(targetX, targetY) {
  if (!gameRunning || tongue.active) return;
  tongue.active = true;
  tongue.progress = 0;
  tongue.returning = false;
  tongue.caught = null;
  tongue.wobble = 1;
  const dx = targetX - frog.x;
  const dy = targetY - frog.y;
  const dist = Math.sqrt(dx*dx+dy*dy) || 1;
  tongue.tx = frog.x + (dx/dist) * tongue.length;
  tongue.ty = frog.y + (dy/dist) * tongue.length;
  frog.targetScaleX = 0.8;
  frog.targetScaleY = 1.25;
  frog.mouthOpen = 1;
  frog.pupilDilate = 0.6;
  sfx(500, 150, 0.08, 0.2);
}

function triggerFlop() {
  if (!gameRunning || frog.isFlopping) return;
  frog.isFlopping = true;
  frog.flopWindup = 0.15;
  frog.flopAirtime = 0.25;
  frog.flopTimer = 0.6;
  frog.flopRadius = 0;
  frog.targetScaleX = 1.5;
  frog.targetScaleY = 0.5;
  frog.hopHeight = 0;
  frog.hopVel = -8;

// Desktop
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') e.preventDefault();

  if (!gameRunning) return;

  // Dialogue controls
  if (dialogue.active) {
    if (e.code === 'Space' || e.code === 'Enter' || e.key.toLowerCase() === 'e') {
      e.preventDefault();
      advanceDialogue();
      return;
    }
    if (e.code === 'ArrowUp' || e.key.toLowerCase() === 'w') { dialogueChoiceUp(); return; }
    if (e.code === 'ArrowDown' || e.key.toLowerCase() === 's') { dialogueChoiceDown(); return; }
    return; // Block all other input during dialogue
  }

  // Interact with NPC
  if (e.key.toLowerCase() === 'e') {
    const npc = getNearestNPC();
    if (npc) startDialogue(npc);
    return;
  }

  if (e.code === 'Space') triggerFlop();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()]=false);
window.addEventListener('mousemove', e => { mouseX=e.clientX; mouseY=e.clientY; });
window.addEventListener('mousedown', e => {
  if (!gameRunning) return;

});

// Mobile touch
if (isMobile) {
  document.getElementById('controls-desktop').style.display = 'none';
  document.getElementById('controls-mobile').style.display = 'block';

  function updateJoystick(tx, ty) {
    let dx = tx - touch.joyBaseX;
    let dy = ty - touch.joyBaseY;
    const dist = Math.sqrt(dx*dx+dy*dy);
    // Follow: if thumb drifts beyond threshold, base slides toward thumb
    if (dist > JOY_FOLLOW_THRESHOLD) {
      const overflow = dist - JOY_RADIUS;
      touch.joyBaseX += (dx/dist) * overflow;
      touch.joyBaseY += (dy/dist) * overflow;
      dx = tx - touch.joyBaseX;
      dy = tx - touch.joyBaseX;
      // Recalculate after follow
      dx = tx - touch.joyBaseX;
      dy = ty - touch.joyBaseY;
    }
    const newDist = Math.sqrt(dx*dx+dy*dy);
    if (newDist > JOY_DEAD) {
      const clamped = Math.min(newDist, JOY_RADIUS);
      const norm = (clamped - JOY_DEAD) / (JOY_RADIUS - JOY_DEAD);
      touch.joyDx = (dx/newDist) * norm;
      touch.joyDy = (dy/newDist) * norm;
      touch.joyForce = norm;
      touch.joyKnobX = touch.joyBaseX + (dx/newDist) * clamped;
      touch.joyKnobY = touch.joyBaseY + (dy/newDist) * clamped;
    } else {
      touch.joyDx = 0; touch.joyDy = 0; touch.joyForce = 0;
      touch.joyKnobX = touch.joyBaseX;
      touch.joyKnobY = touch.joyBaseY;
    }
  }

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const x = t.clientX, y = t.clientY;
      if (dialogue.active) {
        if (dialogue.choices && y > H - 180) {
          const choiceY = y - (H - 170);
          dialogue.choiceIndex = choiceY < 60 ? 0 : Math.min(Math.floor(choiceY / 30), dialogue.choices.length - 1);
        }
        advanceDialogue();
        continue;
      }
      if (x < 120 && y > H - 180 && y < H - 100) {
        const npc = getNearestNPC();
        if (npc) startDialogue(npc);
        continue;
      }
      // Flop button — generous zone, bottom-right
      const flopDist = Math.sqrt(Math.pow(x - (W-55), 2) + Math.pow(y - (H-55), 2));
      if (flopDist < 50) {
        touch.flopId = t.identifier;
        triggerFlop();
        continue;
      }
      // Bottom-left quadrant only = joystick (dynamic — appears where you touch)
      if (x < W * 0.4 && y > H * 0.5 && touch.joyId === null) {
        touch.joyId = t.identifier;
        touch.joyBaseX = x;
        touch.joyBaseY = y;
        touch.joyKnobX = x;
        touch.joyKnobY = y;
        touch.joyDx = 0; touch.joyDy = 0; touch.joyForce = 0;
        touch.joyActive = true;
        touch.joyFadeOut = 0;
      }
      // Everything else = aim + tongue
      else if (touch.atkId === null) {
        touch.atkId = t.identifier;
        mouseX = x; mouseY = y;
        shootTongue(x + camera.x, y + camera.y);
      }
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === touch.joyId) updateJoystick(t.clientX, t.clientY);
      if (t.identifier === touch.atkId) { mouseX = t.clientX; mouseY = t.clientY; }
    }
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touch.joyId) {
        touch.joyLastBaseX = touch.joyBaseX; touch.joyLastBaseY = touch.joyBaseY;
        touch.joyFadeOut = 1;
        touch.joyId = null; touch.joyDx = 0; touch.joyDy = 0;
        touch.joyForce = 0; touch.joyActive = false;
      }
      if (t.identifier === touch.atkId) touch.atkId = null;
      if (t.identifier === touch.flopId) touch.flopId = null;
    }
  });

  canvas.addEventListener('touchcancel', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touch.joyId) {
        touch.joyLastBaseX = touch.joyBaseX; touch.joyLastBaseY = touch.joyBaseY;
        touch.joyFadeOut = 1;
        touch.joyId=null; touch.joyDx=0; touch.joyDy=0; touch.joyForce=0; touch.joyActive=false;
      }
      if (t.identifier === touch.atkId) touch.atkId=null;
      if (t.identifier === touch.flopId) touch.flopId=null;
    }
  });
}

    const spd = 2+Math.random()*6;
    splashDrops.push({
      x:frog.x, y:frog.y,
      vx:Math.cos(a)*spd, vy:-3-Math.random()*5,
      life:0.6+Math.random()*0.4, maxLife:1,
      size: 2+Math.random()*3, gravity: 12,
    });
  }
  for (let i=0;i<12;i++) {
    const a = (i/12)*Math.PI*2;
    particles.push({
      x:frog.x+Math.cos(a)*20, y:frog.y+Math.sin(a)*12,
      vx:Math.cos(a)*3, vy:Math.sin(a)*2,
      life:0.5, maxLife:0.5,
      color:`hsl(150,60%,${30+Math.random()*30}%)`,
      size:2+Math.random()*3, type:'ring',
    });
  }
  sfx(100, 30, 0.3, 0.18);
  sfxNoise(0.25, 0.12, 300);
  // Hit bugs
  bugs.forEach(bug => {
    if (!bug.alive) return;
    const dx=bug.x-frog.x, dy=bug.y-frog.y;
    if (Math.sqrt(dx*dx+dy*dy) < 120) killBug(bug);
  });
  intensityTarget = Math.min(intensityTarget+0.25, 1);
}

function killBug(bug) {
  bug.hp--;
  if (bug.hp <= 0) {
    bug.alive = false;
    bug.dying = true;
    bug.deathAnim = 1;
    score++;
    combo++;
    comboTimer = 2.5;
    intensityTarget = Math.min(intensityTarget + 0.12, 1);
    screenShake = Math.max(screenShake, 0.12);
    // Frog gulp
    frog.gulpTimer = 0.3;
    frog.cheekPuff = 1;
    frog.targetScaleX = 1.15;
    frog.targetScaleY = 0.9;
    const colors = {
      fly:['#86efac','#4ade80','#22c55e'],
      dragonfly:['#7dd3fc','#38bdf8','#0ea5e9'],
      beetle:['#fde68a','#fbbf24','#f59e0b'],
      moth:['#e9d5ff','#c084fc','#a855f7'],
    };
    const cols = colors[bug.type]||colors.fly;
    // Burst particles with more variation
    for (let i=0;i<16;i++) {
      const a=Math.random()*Math.PI*2;
      const spd=1+Math.random()*4;
      particles.push({
        x:bug.x, y:bug.y,
        vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-1,
        life:0.4+Math.random()*0.6, maxLife:1,
        color:cols[Math.floor(Math.random()*cols.length)],
        size:1.5+Math.random()*3.5, type:'burst',
        rotSpeed: (Math.random()-0.5)*10,
        rot: 0,
      });
    }
    // Ring particles
    for (let i=0;i<8;i++) {
      const a=(i/8)*Math.PI*2;
      particles.push({
        x:bug.x+Math.cos(a)*8, y:bug.y+Math.sin(a)*8,
        vx:Math.cos(a)*2, vy:Math.sin(a)*2,
        life:0.3, maxLife:0.3,
        color:cols[0], size:1.5, type:'ring',
        rotSpeed:0, rot:0,
      });
    }
    ripples.push({ x:bug.x, y:bug.y, radius:0, maxRadius:40, alpha:0.4, width:1.5 });
    // Rising pitch catch sound
    const freq = 350 + Math.min(combo,12)*50;
    sfx(freq, freq*2, 0.1, 0.25);
    sfx(freq*1.5, freq*3, 0.08, 0.12);
    document.getElementById('score').textContent = 'BUGS: '+score;
    setTimeout(spawnBug, 1500+Math.random()*2500);
  }
}

// ─── UPDATE ───
function update(dt) {
  if (!gameRunning) return;
  globalTime += dt;
  mouseWorld.x = mouseX+camera.x;
  mouseWorld.y = mouseY+camera.y;

  // ── Zone transition (runs before everything, can't be blocked) ──
  if (zoneTransition.active) {
    if (zoneTransition.phase === 'fadeOut') {
      zoneTransition.alpha += dt * 1.5;
      if (zoneTransition.alpha >= 1) {
        zoneTransition.alpha = 1;
        zoneTransition.phase = 'switch';
        loadZone(zoneTransition.targetZone);
      }
    } else if (zoneTransition.phase === 'switch') {
      zoneTransition.phase = 'fadeIn';
    } else if (zoneTransition.phase === 'fadeIn') {
      zoneTransition.alpha -= dt * 1.0;
      if (zoneTransition.alpha <= 0) {
        zoneTransition.alpha = 0;
        zoneTransition.active = false;
        zoneTransition.phase = 'none';
      }
    }
    updateMusic(dt);
    return; // Skip all game logic during transition
  }

  // ── Dialogue update ──
  if (dialogue.active) {
    const line = dialogue.lines[dialogue.lineIndex];
    if (line && dialogue.charIndex < line.text.length) {
      dialogue.charTimer += dt;
      while (dialogue.charTimer >= dialogue.charSpeed && dialogue.charIndex < line.text.length) {
        dialogue.charTimer -= dialogue.charSpeed;
        dialogue.charIndex++;
      }
      if (dialogue.charIndex >= line.text.length) {
        dialogue.fullLineShown = true;
        if (line.choices) {
          dialogue.choices = line.choices;
          dialogue.choiceIndex = 0;
        }
      }
    }
  }

  // ── Frog movement (hop-based) ──
  const speed = isMobile ? 140 : 240;
  let mx=0, my=0;
  if (dialogue.active) {
    mx = 0; my = 0; // Block movement during dialogue
  } else if (isMobile) {
    mx = touch.joyDx * touch.joyForce;
    my = touch.joyDy * touch.joyForce;
  } else {
    if (keys['w']||keys['arrowup']) my-=1;
    if (keys['s']||keys['arrowdown']) my+=1;
    if (keys['a']||keys['arrowleft']) mx-=1;
    if (keys['d']||keys['arrowright']) mx+=1;
  }
  const wasMoving = frog.isMoving;
  const moveLen = Math.sqrt(mx*mx+my*my);
  frog.isMoving = moveLen > 0.05;
  if (frog.isMoving) {
    if (!isMobile && moveLen > 0) { mx/=moveLen; my/=moveLen; }
    frog.moveAngle = Math.atan2(my, mx);
  }

  // Start hopping when movement begins
  if (frog.isMoving && !wasMoving) {
    frog.isHopping = true;
    frog.hopVel = -4;
  }

  if (isMobile) {
    if (frog.isMoving) frog.dir = frog.moveAngle;
    else if (touch.atkId !== null) frog.dir = Math.atan2(mouseWorld.y-frog.y, mouseWorld.x-frog.x);
  } else {
    frog.dir = Math.atan2(mouseWorld.y-frog.y, mouseWorld.x-frog.x);
  }

  frog.vx += mx*speed*dt;
  frog.vy += my*speed*dt;
  const friction = isMobile ? 0.83 : 0.87;
  frog.vx *= friction;
  frog.vy *= friction;
  frog.x += frog.vx;
  frog.y += frog.vy;
  frog.x = Math.max(30, Math.min(WORLD_W-30, frog.x));
  frog.y = Math.max(30, Math.min(WORLD_H-30, frog.y));

  // ── Hop animation ──
  if (frog.isMoving && !frog.isFlopping) {
    frog.walkPhase += dt * 10;
    const hopCycle = Math.sin(frog.walkPhase);
    if (hopCycle > 0.9 && !frog.isHopping) {
      frog.isHopping = true;
      frog.hopVel = -3.5;
      frog.targetScaleX = 0.85;
      frog.targetScaleY = 1.2;
    }
  }

  // Hop physics
  if (frog.isHopping) {
    frog.hopHeight += frog.hopVel;
    frog.hopVel += 0.5; // gravity
    if (frog.hopHeight >= 0) {
      frog.hopHeight = 0;
      frog.hopVel = 0;
      frog.isHopping = false;
      // Land squash
      frog.targetScaleX = 1.2;
      frog.targetScaleY = 0.8;
      frog.landSquash = 0.5;
      frog.landTimer = 0.15;
      // Small ripple on land
      if (frog.isMoving) {
        ripples.push({ x:frog.x, y:frog.y+10, radius:0, maxRadius:18, alpha:0.15, width:1 });
      }
    }
  }

  // ── Belly flop phases ──
  if (frog.isFlopping) {
    frog.flopTimer -= dt;
    // Windup phase
    if (frog.flopWindup > 0) {
      frog.flopWindup -= dt;
      frog.targetScaleX = 0.7;
      frog.targetScaleY = 1.4;
    }
    // Airtime
    else if (frog.flopAirtime > 0) {
      frog.flopAirtime -= dt;
      frog.hopHeight += frog.hopVel;
      frog.hopVel += 0.8;
      frog.targetScaleX = 1.3;
      frog.targetScaleY = 0.75;
      frog.rotation = lerp(frog.rotation, 0.1, dt*10);
      if (frog.hopHeight >= 0 && frog.hopVel > 0) {
        frog.hopHeight = 0;
        frog.flopAirtime = 0;
        doFlopLand();
      }
    }
    // Recovery
    else {
      frog.flopRadius = (1 - frog.flopTimer/0.6) * 160;
    }
    if (frog.flopTimer <= 0) {
      frog.isFlopping = false;
      frog.rotation = 0;
    }
  }

  // ── Scale animation (spring-like) ──
  frog.scaleX += (frog.targetScaleX - frog.scaleX) * dt * 14;
  frog.scaleY += (frog.targetScaleY - frog.scaleY) * dt * 14;
  frog.targetScaleX += (1 - frog.targetScaleX) * dt * 6;
  frog.targetScaleY += (1 - frog.targetScaleY) * dt * 6;

  // Land squash recovery
  if (frog.landTimer > 0) {
    frog.landTimer -= dt;
    frog.landSquash *= 0.9;
  }

  // ── Eye animations ──
  frog.breathe += dt * 1.5;
  frog.blinkTimer -= dt;
  if (frog.blinkTimer <= 0) { frog.eyeBlink = 1; frog.blinkTimer = 2+Math.random()*5; }
  if (frog.eyeBlink > 0) frog.eyeBlink = Math.max(0, frog.eyeBlink-dt*10);
  frog.eyeStretch *= (1 - dt * 5);
  frog.pupilDilate += (1 - frog.pupilDilate) * dt * 4;
  // Smooth eye tracking
  frog.lookTargetX = Math.cos(frog.dir) * 3;
  frog.lookTargetY = Math.sin(frog.dir) * 2;
  frog.lookX += (frog.lookTargetX - frog.lookX) * dt * 8;
  frog.lookY += (frog.lookTargetY - frog.lookY) * dt * 8;
  // Cheek puff
  frog.cheekPuff *= (1 - dt * 4);
  // Mouth
  frog.mouthOpen *= (1 - dt * 8);
  frog.gulpTimer = Math.max(0, frog.gulpTimer - dt);

  // ── Idle animations ──
  if (!frog.isMoving && !tongue.active && !frog.isFlopping) {
    frog.idleTimer += dt;
    if (frog.idleTimer > 3 && frog.idleAnim === 'none') {
      const anims = ['look', 'breatheDeep', 'shift'];
      frog.idleAnim = anims[Math.floor(Math.random()*anims.length)];
      frog.idleAnimTimer = 0;
    }
    if (frog.idleAnim !== 'none') {
      frog.idleAnimTimer += dt;
      if (frog.idleAnim === 'breatheDeep') {
        frog.targetScaleX = 1 + Math.sin(frog.idleAnimTimer*3)*0.08;
        frog.targetScaleY = 1 - Math.sin(frog.idleAnimTimer*3)*0.06;
      } else if (frog.idleAnim === 'shift') {
        frog.targetScaleX = 1 + Math.sin(frog.idleAnimTimer*4)*0.05;
      }
      if (frog.idleAnimTimer > 1.5) {
        frog.idleAnim = 'none';
        frog.idleTimer = 0;
      }
    }
  } else {
    frog.idleTimer = 0;
    frog.idleAnim = 'none';
  }

  // ── Frog trail ──
  if (frog.isMoving && Math.random() < 0.4) {
    frog.trail.push({ x:frog.x, y:frog.y+12, alpha:0.15, size:3+Math.random()*2 });
  }
  frog.trail.forEach(t => { t.alpha -= dt*0.5; t.size += dt*3; });
  frog.trail = frog.trail.filter(t => t.alpha > 0);

  // Movement ripples
  if (frog.isMoving && !frog.isHopping && Math.random()<0.15) {
    ripples.push({ x:frog.x+(Math.random()-0.5)*8, y:frog.y+12, radius:0, maxRadius:10+Math.random()*8, alpha:0.1, width:0.8 });
  }

  // ── Tongue ──
  if (tongue.active) {
    tongue.wobble *= 0.9;
    if (!tongue.returning) {
      tongue.progress += dt * tongue.speed;
      if (tongue.progress >= 1) tongue.returning = true;
      const p = tongue.progress;
      const tipX = frog.x+(tongue.tx-frog.x)*p;
      const tipY = frog.y+(tongue.ty-frog.y)*p;
      bugs.forEach(bug => {
        if (!bug.alive || tongue.caught) return;
        const dx=bug.x-tipX, dy=bug.y-tipY;
        if (Math.sqrt(dx*dx+dy*dy) < bug.size+10) {
          tongue.caught = bug;
          tongue.returning = true;
          frog.eyeStretch = 0.5;
        }
      });
    } else {
      tongue.progress -= dt * tongue.speed * 1.8;
      if (tongue.caught) {
        const p = Math.max(0, tongue.progress);
        tongue.caught.x = frog.x+(tongue.tx-frog.x)*p;
        tongue.caught.y = frog.y+(tongue.ty-frog.y)*p;
        tongue.caught.scaleAnim = 0.7 + tongue.progress * 0.3;
        tongue.caught.rotation += dt * 15;
      }
      if (tongue.progress <= 0) {
        tongue.active = false;
        frog.mouthOpen = 0;
        if (tongue.caught) {
          killBug(tongue.caught);
          tongue.caught = null;
          // Gulp squash
          frog.targetScaleX = 1.2;
          frog.targetScaleY = 0.85;
        } else {
          // Miss - small recoil
          frog.targetScaleX = 1.08;
          frog.targetScaleY = 0.95;
        }
      }
    }
  }

  // ── Bugs ──
  bugs.forEach(bug => {
    if (bug.dying) {
      bug.deathAnim -= dt * 3;
      if (bug.deathAnim <= 0) bug.dying = false;
      return;
    }
    if (!bug.alive) return;
    bug.spawnAnim = Math.min(1, bug.spawnAnim + dt * 2);
    bug.changeTimer -= dt;
    if (bug.changeTimer <= 0) {
      bug.changeTimer = 1+Math.random()*3;
      const spd={dragonfly:2.5,beetle:0.6,fly:1.2,moth:0.8}[bug.type];
      const newVx = (Math.random()-0.5)*spd*2;
      const newVy = (Math.random()-0.5)*spd*2;
      // Smooth direction change
      bug.vx = lerp(bug.vx, newVx, 0.5);
      bug.vy = lerp(bug.vy, newVy, 0.5);
    }
    bug.x += bug.vx;
    bug.y += bug.vy;
    bug.bobPhase += dt * 3;
    bug.wingPhase += dt*(bug.type==='dragonfly'?25:bug.type==='moth'?12:18);
    if (bug.x<40||bug.x>WORLD_W-40) { bug.vx*=-1; bug.x=Math.max(40,Math.min(WORLD_W-40,bug.x)); }
    if (bug.y<40||bug.y>WORLD_H-40) { bug.vy*=-1; bug.y=Math.max(40,Math.min(WORLD_H-40,bug.y)); }
    // Dragonfly trail
    if (bug.type==='dragonfly' && Math.random()<0.4) bug.trail.push({x:bug.x,y:bug.y,life:0.4});
    bug.trail.forEach(t => t.life-=dt);
    bug.trail = bug.trail.filter(t => t.life>0);
  });

  // ── Fireflies ──
  fireflies.forEach(f => {
    f.phase += dt*f.pulseSpeed;
    f.angle += dt*(0.3+Math.sin(f.phase*0.5)*0.2);
    f.x = f.cx + Math.cos(f.angle)*f.radius;
    f.y = f.cy + Math.sin(f.angle)*f.radius + Math.sin(f.phase*2)*5;
  });

  // ── Ripples ──
  ripples.forEach(r => { r.radius+=dt*50; r.alpha-=dt*0.9; });
  ripples = ripples.filter(r => r.alpha>0);

  // ── Particles ──
  particles.forEach(p => {
    p.x+=p.vx; p.y+=p.vy;
    p.vx*=0.95; p.vy*=0.95;
    p.life-=dt;
    if (p.rot !== undefined) p.rot += (p.rotSpeed||0)*dt;
  });
  particles = particles.filter(p => p.life>0);

  // ── Splash drops (arc physics) ──
  splashDrops.forEach(d => {
    d.x += d.vx;
    d.y += d.vy;
    d.vy += d.gravity * dt * 3;
    d.life -= dt;
    // Spawn mini ripple when hitting water
    if (d.vy > 0 && d.y > frog.y + 20 && d.life > 0.1) {
      ripples.push({ x:d.x, y:d.y, radius:0, maxRadius:8, alpha:0.15, width:0.5 });
      d.life = 0;
    }
  });
  splashDrops = splashDrops.filter(d => d.life > 0);

  // ── Bubbles ──
  bubbles.forEach(b => {
    b.y -= b.speed;
    b.x += Math.sin(globalTime*2+b.phase)*b.wobble*dt;
    if (b.y<-10) { b.y=WORLD_H+10; b.x=Math.random()*WORLD_W; }
  });

  // ── Clouds ──
  clouds.forEach(c => { c.x+=c.speed; if(c.x>WORLD_W+c.size) c.x=-c.size; });

  // ── Combo UI ──
  if (combo>0) {
    comboTimer -= dt;
    if (comboTimer<=0) combo=0;
    const el=document.getElementById('combo');
    el.style.opacity = combo>1?1:0;
    el.textContent = 'x'+combo;
    el.style.fontSize = (18+Math.min(combo,12)*2)+'px';
  }

  // ── Camera (smooth damp) ──
  const camTarget = { x:frog.x-W/2, y:frog.y-H/2 };
  const camSmooth = isMobile ? 0.06 : 0.25; // Much tighter on mobile
  const cx = smoothDamp(camera.x, camTarget.x, camera.vx, camSmooth, dt);
  const cy = smoothDamp(camera.y, camTarget.y, camera.vy, camSmooth, dt);
  camera.x = Math.max(0, Math.min(WORLD_W-W, cx.value));
  camera.y = Math.max(0, Math.min(WORLD_H-H, cy.value));
  camera.vx = cx.velocity; camera.vy = cy.velocity;

  screenPulse *= 0.92;

  // Check if frog walks through open gate — show confirmation dialogue
  if (gateOpen && !zoneTransition.active && !dialogue.active && frog.x > WORLD_W - 120 && ZONES[currentZone + 1] && !gateConfirmShown) {
    gateConfirmShown = true;
    const nextZone = ZONES[currentZone + 1];
    // Create a gate confirmation "NPC" dialogue
    dialogue.active = true;
    dialogue.npc = { name: '', talked: false };
    dialogue.lines = [
      {
        text: `You are about to enter\n${nextZone.name}.`,
        speaker: 'Gate',
        choices: [
          { text: `Enter ${nextZone.name}`, response: '...', onSelect: 'enterZone' },
          { text: 'Go back', response: '...' },
        ]
      },
    ];
    dialogue.lineIndex = 0;
    dialogue.charIndex = 0;
    dialogue.charTimer = 0;
    dialogue.choices = null;
    dialogue.choiceIndex = 0;
    dialogue.fullLineShown = false;
    // Push frog back slightly so they don't re-trigger
    frog.x = WORLD_W - 130;
  }
  screenShake *= 0.90;
  updateMusic(dt);
}

// ─── DRAW ───
function draw() {
  const sx=(Math.random()-0.5)*screenShake*18;
  const sy=(Math.random()-0.5)*screenShake*18;
  ctx.save();
  ctx.translate(-camera.x+sx, -camera.y+sy);

  drawWater();

  // Underwater plants
  waterPlants.forEach(wp => {
    ctx.strokeStyle = `hsla(${wp.hue},40%,18%,0.35)`;
    ctx.lineWidth = 1.5;
    let px=wp.x, py=wp.y;
    ctx.beginPath(); ctx.moveTo(px,py);
    for (let s=0;s<wp.segments;s++) {
      const sway=Math.sin(globalTime*1.2+wp.phase+s*0.8)*(6+s*3);
      px+=sway*0.4; py-=10;
      ctx.lineTo(px+sway,py);
    }
    ctx.stroke();
    ctx.fillStyle=`hsla(${wp.hue},35%,22%,0.35)`;
    ctx.beginPath();
    ctx.ellipse(px+Math.sin(globalTime*1.2+wp.phase)*5, py, 4, 2.5, globalTime+wp.phase, 0, Math.PI*2);
    ctx.fill();
  });

  // Bubbles
  bubbles.forEach(b => {
    ctx.strokeStyle='rgba(134,239,172,0.06)';
    ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.size,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='rgba(134,239,172,0.04)';
    ctx.beginPath(); ctx.arc(b.x-b.size*0.3,b.y-b.size*0.3,b.size*0.3,0,Math.PI*2); ctx.fill();
  });

  // Lily pads
  lilyPads.forEach(lp => {
    const bob=Math.sin(globalTime*1.2+lp.bobPhase)*lp.bobAmount;
    ctx.save();
    ctx.translate(lp.x, lp.y+bob);
    ctx.rotate(lp.rot + Math.sin(globalTime*0.5+lp.bobPhase)*0.02);
    // Shadow
    ctx.fillStyle='rgba(0,15,0,0.22)';
    ctx.beginPath(); ctx.ellipse(3,3,lp.size+2,(lp.size+2)*0.75,0,0,Math.PI*2); ctx.fill();
    // Pad
    const g=ctx.createRadialGradient(0,0,0,0,0,lp.size);
    g.addColorStop(0,`hsl(140,50%,${22-lp.shade*100}%)`);
    g.addColorStop(1,`hsl(140,45%,${16-lp.shade*100}%)`);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(0,0,lp.size,lp.size*0.75,0,0.15,Math.PI*2); ctx.fill();
    // Veins
    ctx.strokeStyle='rgba(74,222,128,0.12)';
    ctx.lineWidth=0.5;
    for (let v=0;v<5;v++) {
      const a=(v/5)*Math.PI*1.6+0.3;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*lp.size*0.8,Math.sin(a)*lp.size*0.6); ctx.stroke();
    }
    // Edge highlight
    ctx.strokeStyle='rgba(134,239,172,0.08)';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.ellipse(0,0,lp.size,lp.size*0.75,0,0.15,Math.PI*2); ctx.stroke();
    // Flower
    if (lp.hasFlower) {
      const fSway = Math.sin(globalTime*2+lp.bobPhase)*2;
      for (let p=0;p<5;p++) {
        const pa=(p/5)*Math.PI*2+globalTime*0.2;
        ctx.fillStyle=lp.flowerColor;
        ctx.beginPath(); ctx.ellipse(Math.cos(pa)*5+lp.size*0.3+fSway,Math.sin(pa)*4-2,3,5,pa,0,Math.PI*2); ctx.fill();
      }
      ctx.fillStyle='#fde047';
      ctx.beginPath(); ctx.arc(lp.size*0.3+fSway,-2,2.5,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });

  // Reeds
  reeds.forEach(r => {
    const sway=Math.sin(globalTime*r.swaySpeed+r.swayPhase)*6;
    ctx.strokeStyle='#14371a';
    ctx.lineWidth=r.thickness;
    ctx.beginPath(); ctx.moveTo(r.x,r.y);
    ctx.quadraticCurveTo(r.x+sway*0.5,r.y-r.height*0.5,r.x+sway,r.y-r.height);
    ctx.stroke();
  });

  // Cattails
  cattails.forEach(c => {
    const sway=Math.sin(globalTime*1.5+c.swayPhase)*5;
    ctx.strokeStyle='#1a4020'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(c.x,c.y);
    ctx.quadraticCurveTo(c.x+sway*0.5,c.y-c.height*0.5,c.x+sway,c.y-c.height);
    ctx.stroke();
    ctx.fillStyle='#5c3a1e';
    ctx.beginPath(); ctx.ellipse(c.x+sway,c.y-c.height-6,3,8,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#7a4e2a';
    ctx.beginPath(); ctx.ellipse(c.x+sway,c.y-c.height-6,2.5,7,0,0,Math.PI*2); ctx.fill();
  });

  // Frog trail
  frog.trail.forEach(t => {
    ctx.fillStyle=`rgba(134,239,172,${t.alpha*0.3})`;
    ctx.beginPath(); ctx.arc(t.x,t.y,t.size,0,Math.PI*2); ctx.fill();
  });

  // Ripples
  ripples.forEach(r => {
    ctx.strokeStyle=`rgba(134,239,172,${r.alpha*0.4})`;
    ctx.lineWidth=r.width||1.5;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.radius,0,Math.PI*2); ctx.stroke();
  });

  // Belly flop ring
  if (frog.isFlopping && frog.flopRadius>0) {
    const a=Math.max(0,frog.flopTimer/0.6);
    for (let i=0;i<3;i++) {
      ctx.strokeStyle=`rgba(134,239,172,${a*(0.4-i*0.12)})`;
      ctx.lineWidth=3-i;
      ctx.beginPath(); ctx.arc(frog.x,frog.y,frog.flopRadius*0.7+i*20,0,Math.PI*2); ctx.stroke();
    }
  }

  // Bug trails
  bugs.forEach(bug => {
    bug.trail.forEach(t => {
      ctx.fillStyle=`rgba(125,211,252,${t.life*0.3})`;
      ctx.beginPath(); ctx.arc(t.x,t.y,1.5*t.life,0,Math.PI*2); ctx.fill();
    });
  });

  // Bugs
  bugs.forEach(bug => {
    if (bug.dying) {
      // Death animation - pop and fade
      ctx.save();
      ctx.translate(bug.x, bug.y);
      const s = easeOutBack(1 - bug.deathAnim) * 2;
      ctx.scale(s, s);
      ctx.globalAlpha = bug.deathAnim;
      drawBug(bug);
      ctx.globalAlpha = 1;
      ctx.restore();
      return;
    }
    if (!bug.alive) return;
    const bob = Math.sin(bug.bobPhase)*bug.bobHeight;
    ctx.save();
    ctx.translate(bug.x, bug.y + bob);
    const spawn = easeOutElastic(bug.spawnAnim);
    ctx.scale(bug.scaleAnim * spawn, bug.scaleAnim * spawn);
    ctx.rotate(bug.rotation);
    // Shadow
    ctx.fillStyle = `rgba(0,10,0,${0.1+bob*0.01})`;
    ctx.beginPath(); ctx.ellipse(0,bug.bobHeight+4,bug.size,2,0,0,Math.PI*2); ctx.fill();
    // Moth glow
    if (bug.type==='moth') {
      const glow=ctx.createRadialGradient(0,0,0,0,0,14);
      glow.addColorStop(0,`rgba(192,132,252,${0.08+Math.sin(globalTime*3)*0.04})`);
      glow.addColorStop(1,'transparent');
      ctx.fillStyle=glow;
      ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fill();
    }
    drawBug(bug);
    ctx.restore();
  });

  // ── Path and Gate ──
  const pathX = WORLD_W - 120;
  const pathY = WORLD_H / 2;
  const pathW = 100;
  const pathH = 160;

  // Path ground (lighter area leading right)
  const pathGrad = ctx.createLinearGradient(pathX - 80, pathY, pathX + pathW, pathY);
  pathGrad.addColorStop(0, 'rgba(20,35,20,0)');
  pathGrad.addColorStop(0.3, 'rgba(20,35,20,0.4)');
  pathGrad.addColorStop(1, 'rgba(25,40,25,0.5)');
  ctx.fillStyle = pathGrad;
  ctx.beginPath();
  ctx.moveTo(pathX - 60, pathY - pathH/3);
  ctx.lineTo(WORLD_W, pathY - pathH/2.5);
  ctx.lineTo(WORLD_W, pathY + pathH/2.5);
  ctx.lineTo(pathX - 60, pathY + pathH/3);
  ctx.closePath();
  ctx.fill();

  // Path edge stones
  for (let i = 0; i < 8; i++) {
    const sx = pathX - 40 + i * 22;
    const stoneAlpha = 0.15 + Math.sin(i * 1.3) * 0.05;
    ctx.fillStyle = `rgba(60,80,60,${stoneAlpha})`;
    ctx.beginPath();
    ctx.ellipse(sx, pathY - pathH/3 - 5 + Math.sin(i*2)*3, 6+Math.random()*4, 3+Math.random()*2, i*0.2, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(sx + 5, pathY + pathH/3 + 5 + Math.sin(i*2.5)*3, 6+Math.random()*4, 3+Math.random()*2, i*0.2, 0, Math.PI*2);
    ctx.fill();
  }

  // Gate posts
  const gateX = WORLD_W - 80;
  const gateTopY = pathY - 55;
  const gateBotY = pathY + 55;

  // Left post
  ctx.fillStyle = '#2a3a25';
  ctx.fillRect(gateX - 6, gateTopY - 20, 12, 40);
  ctx.fillRect(gateX - 6, gateBotY - 20, 12, 40);
  // Post tops
  ctx.fillStyle = '#3a4a35';
  ctx.beginPath(); ctx.arc(gateX, gateTopY - 20, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(gateX, gateBotY + 20, 8, 0, Math.PI * 2); ctx.fill();
  // Post glow
  const postGlowColor = gateOpen ? 'rgba(74,222,128,0.15)' : 'rgba(239,68,68,0.1)';
  const pg1 = ctx.createRadialGradient(gateX, gateTopY - 20, 0, gateX, gateTopY - 20, 15);
  pg1.addColorStop(0, postGlowColor); pg1.addColorStop(1, 'transparent');
  ctx.fillStyle = pg1;
  ctx.beginPath(); ctx.arc(gateX, gateTopY - 20, 15, 0, Math.PI * 2); ctx.fill();
  const pg2 = ctx.createRadialGradient(gateX, gateBotY + 20, 0, gateX, gateBotY + 20, 15);
  pg2.addColorStop(0, postGlowColor); pg2.addColorStop(1, 'transparent');
  ctx.fillStyle = pg2;
  ctx.beginPath(); ctx.arc(gateX, gateBotY + 20, 15, 0, Math.PI * 2); ctx.fill();

  // Gate barrier (if closed)
  if (!gateOpen) {
    // Horizontal bars
    ctx.strokeStyle = 'rgba(180,60,60,0.3)';
    ctx.lineWidth = 3;
    for (let i = 0; i < 5; i++) {
      const barY = gateTopY + i * 22 + 5;
      ctx.beginPath();
      ctx.moveTo(gateX - 4, barY);
      ctx.lineTo(gateX + 4, barY);
      ctx.stroke();
    }
    // Energy field
    ctx.fillStyle = `rgba(239,68,68,${0.03 + Math.sin(globalTime * 3) * 0.015})`;
    ctx.fillRect(gateX - 3, gateTopY, 6, gateBotY - gateTopY);
    // Particles floating in field
    for (let i = 0; i < 4; i++) {
      const py = gateTopY + ((globalTime * 30 + i * 30) % (gateBotY - gateTopY));
      ctx.fillStyle = `rgba(239,68,68,${0.3 + Math.sin(globalTime * 4 + i) * 0.2})`;
      ctx.beginPath(); ctx.arc(gateX + Math.sin(globalTime * 2 + i) * 2, py, 1.5, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    // Open gate — green glow
    ctx.fillStyle = `rgba(74,222,128,${0.02 + Math.sin(globalTime * 2) * 0.01})`;
    ctx.fillRect(gateX - 8, gateTopY, 16, gateBotY - gateTopY);
    // Arrow hint pointing right
    const arrowAlpha = 0.2 + Math.sin(globalTime * 3) * 0.1;
    const arrowX = gateX + 20 + Math.sin(globalTime * 3) * 5;
    ctx.fillStyle = `rgba(74,222,128,${arrowAlpha})`;
    ctx.beginPath();
    ctx.moveTo(arrowX, pathY - 8);
    ctx.lineTo(arrowX + 10, pathY);
    ctx.lineTo(arrowX, pathY + 8);
    ctx.closePath();
    ctx.fill();
  }

  // "ZONE 2" text above gate when open
  if (gateOpen) {
    ctx.fillStyle = `rgba(134,239,172,${0.3 + Math.sin(globalTime * 2) * 0.1})`;
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(currentZone === 1 ? 'THE MARSH' : 'THE UNDERGROWTH', gateX, gateTopY - 30);
    ctx.fillText('>>>', gateX, gateTopY - 18);
    ctx.textAlign = 'start';
  }

  // Bug counter near gate when not open
  if (!gateOpen) {
    const needed = ZONES[currentZone].requiredBugs;
    const dx = frog.x - gateX, dy = frog.y - pathY;
    if (Math.sqrt(dx*dx+dy*dy) < 200) {
      ctx.fillStyle = 'rgba(134,239,172,0.35)';
      ctx.font = '10px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(`${Math.min(score, needed)}/${needed} bugs`, gateX, gateTopY - 30);
      ctx.textAlign = 'start';
    }
  }

  // NPCs
  npcs.forEach(npc => {
    const bob = Math.sin(globalTime * 1.5 + npc.bobPhase) * 2;
    ctx.save();
    ctx.translate(npc.x, npc.y + bob);

    // Shadow
    ctx.fillStyle = 'rgba(0,12,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, npc.size * 0.7, npc.size * 0.8, 4, 0, 0, Math.PI * 2); ctx.fill();

    if (npc.type === 'oldfrog') {
      // Old frog - bigger, darker, wrinkled
      const bg = ctx.createRadialGradient(0, -2, 2, 0, 2, npc.size);
      bg.addColorStop(0, '#7a9a30');
      bg.addColorStop(0.5, '#5a7a20');
      bg.addColorStop(1, '#3a5a10');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.ellipse(0, 0, npc.size * 0.7, npc.size * 0.6, 0, 0, Math.PI * 2); ctx.fill();
      // Belly
      ctx.fillStyle = '#8a9a60';
      ctx.beginPath(); ctx.ellipse(0, 3, npc.size * 0.4, npc.size * 0.35, 0, 0, Math.PI * 2); ctx.fill();
      // Warts/bumps
      ctx.fillStyle = 'rgba(50,70,20,0.5)';
      ctx.beginPath(); ctx.arc(-6, -5, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(8, -3, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-4, 2, 1.8, 0, Math.PI * 2); ctx.fill();
      // Eyes (heavy lids, wise)
      ctx.fillStyle = '#4a6a15';
      ctx.beginPath(); ctx.ellipse(-6, -10, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6, -10, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f0e68c';
      ctx.beginPath(); ctx.ellipse(-6, -10, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6, -10, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2a3a08';
      ctx.beginPath(); ctx.ellipse(-6, -10, 2, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6, -10, 2, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      // Heavy eyelids
      ctx.fillStyle = '#3a5a10';
      ctx.beginPath(); ctx.ellipse(-6, -12, 5, 2.5, 0, Math.PI, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6, -12, 5, 2.5, 0, Math.PI, Math.PI * 2); ctx.fill();
      // Mouth - slight frown
      ctx.strokeStyle = '#3a5a10';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, -2, 5, 0.3, Math.PI - 0.3); ctx.stroke();
    } else if (npc.type === 'mushroom') {
      // Mushroom creature
      // Stem
      ctx.fillStyle = '#ddd6fe';
      ctx.fillRect(-4, -2, 8, 12);
      // Cap
      const cg = ctx.createRadialGradient(0, -6, 0, 0, -6, 14);
      cg.addColorStop(0, '#c084fc');
      cg.addColorStop(1, '#7c3aed');
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.ellipse(0, -6, 14, 10, 0, Math.PI, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, -6, 14, 4, 0, 0, Math.PI); ctx.fill();
      // Spots on cap
      ctx.fillStyle = 'rgba(233,213,255,0.5)';
      ctx.beginPath(); ctx.arc(-5, -10, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, -12, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(7, -7, 1.5, 0, Math.PI * 2); ctx.fill();
      // Eyes (on stem)
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.ellipse(-3, 2, 2, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(3, 2, 2, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e9d5ff';
      ctx.beginPath(); ctx.arc(-3.5, 1, 0.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(2.5, 1, 0.8, 0, Math.PI * 2); ctx.fill();
      // Subtle glow
      const gg = ctx.createRadialGradient(0, -4, 0, 0, -4, 20);
      gg.addColorStop(0, 'rgba(192,132,252,0.08)');
      gg.addColorStop(1, 'transparent');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(0, -4, 20, 0, Math.PI * 2); ctx.fill();
    } else if (npc.type === 'turtle') {
      // Turtle
      // Shell
      const sg = ctx.createRadialGradient(0, -2, 0, 0, -2, 16);
      sg.addColorStop(0, '#6b7280');
      sg.addColorStop(1, '#374151');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.ellipse(0, -2, 16, 12, 0, 0, Math.PI * 2); ctx.fill();
      // Shell pattern
      ctx.strokeStyle = 'rgba(55,65,81,0.6)';
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.ellipse(0, -2, 10, 7, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, -2, 5, 3, 0, 0, Math.PI * 2); ctx.stroke();
      // Lines
      for (let i = 0; i < 6; i++) {
        const a = (i/6)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*5, -2+Math.sin(a)*3);
        ctx.lineTo(Math.cos(a)*10, -2+Math.sin(a)*7);
        ctx.stroke();
      }
      // Head poking out
      ctx.fillStyle = '#9ca3af';
      ctx.beginPath(); ctx.ellipse(-14, -2, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
      // Eyes
      ctx.fillStyle = '#f3f4f6';
      ctx.beginPath(); ctx.arc(-16, -4, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1f2937';
      ctx.beginPath(); ctx.arc(-16.5, -4, 1.2, 0, Math.PI * 2); ctx.fill();
      // Legs
      ctx.fillStyle = '#9ca3af';
      ctx.beginPath(); ctx.ellipse(-8, 8, 4, 3, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(8, 8, 4, 3, 0.3, 0, Math.PI * 2); ctx.fill();
    } else if (npc.type === 'gatekeeper') {
      // Big bulky toad guard
      const bg = ctx.createRadialGradient(0, 0, 2, 0, 2, 18);
      bg.addColorStop(0, '#5a6370');
      bg.addColorStop(0.5, '#4a5568');
      bg.addColorStop(1, '#2d3748');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.ellipse(0, 0, 16, 14, 0, 0, Math.PI * 2); ctx.fill();
      // Belly
      ctx.fillStyle = '#718096';
      ctx.beginPath(); ctx.ellipse(0, 4, 10, 8, 0, 0, Math.PI * 2); ctx.fill();
      // Warts
      ctx.fillStyle = 'rgba(45,55,72,0.6)';
      ctx.beginPath(); ctx.arc(-7, -5, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(8, -3, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-3, -8, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(5, 2, 2.2, 0, Math.PI * 2); ctx.fill();
      // Eyes — stern, yellow
      ctx.fillStyle = '#2d3748';
      ctx.beginPath(); ctx.ellipse(-7, -12, 7, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(7, -12, 7, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.ellipse(-7, -12, 5, 4.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(7, -12, 5, 4.5, 0, 0, Math.PI * 2); ctx.fill();
      // Slit pupils
      ctx.fillStyle = '#1a202c';
      ctx.beginPath(); ctx.ellipse(-7, -12, 1.5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(7, -12, 1.5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      // Heavy brow
      ctx.fillStyle = '#2d3748';
      ctx.beginPath(); ctx.ellipse(-7, -15, 6, 2, -0.1, Math.PI, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(7, -15, 6, 2, 0.1, Math.PI, Math.PI * 2); ctx.fill();
      // Frown
      ctx.strokeStyle = '#2d3748';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, -2, 6, 0.4, Math.PI - 0.4); ctx.stroke();
      // Arms crossed
      ctx.fillStyle = '#4a5568';
      ctx.beginPath(); ctx.ellipse(-12, 2, 5, 3, -0.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(12, 2, 5, 3, 0.4, 0, Math.PI * 2); ctx.fill();
    }

    // Interaction prompt
    const dx = frog.x - npc.x, dy = frog.y - npc.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if (dist < 60 && !dialogue.active) {
      const promptAlpha = 0.5 + Math.sin(globalTime * 3) * 0.3;
      ctx.fillStyle = `rgba(134,239,172,${promptAlpha})`;
      ctx.font = '10px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(isMobile ? 'TAP to talk' : '[E] Talk', 0, -npc.size - 12);
      ctx.textAlign = 'start';
    }

    // Name tag when close
    if (dist < 80) {
      ctx.fillStyle = 'rgba(134,239,172,0.4)';
      ctx.font = '9px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(npc.name, 0, npc.size * 0.7 + 14);
      ctx.textAlign = 'start';
    }

    ctx.restore();
  });

  // Tongue
  if (tongue.active) {
    const p=Math.max(0,tongue.progress);
    const tipX=frog.x+(tongue.tx-frog.x)*p;
    const tipY=frog.y+(tongue.ty-frog.y)*p;
    // Wobble curve
    const midX=(frog.x+tipX)/2 + Math.sin(globalTime*20)*tongue.wobble*8;
    const midY=(frog.y+tipY)/2 + Math.cos(globalTime*20)*tongue.wobble*8;
    // Shadow
    ctx.strokeStyle='rgba(0,0,0,0.15)';
    ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(frog.x+1,frog.y+2);
    ctx.quadraticCurveTo(midX+1,midY+2,tipX+1,tipY+2); ctx.stroke();
    // Tongue body
    ctx.strokeStyle='#f87171';
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(frog.x,frog.y);
    ctx.quadraticCurveTo(midX,midY,tipX,tipY); ctx.stroke();
    // Lighter center
    ctx.strokeStyle='#fca5a5';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(frog.x,frog.y);
    ctx.quadraticCurveTo(midX,midY,tipX,tipY); ctx.stroke();
    // Tip
    ctx.fillStyle='#ef4444';
    ctx.beginPath(); ctx.arc(tipX,tipY,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fca5a5';
    ctx.beginPath(); ctx.arc(tipX-1.5,tipY-1.5,2,0,Math.PI*2); ctx.fill();
    ctx.lineCap='butt';
  }

  // Splash drops (arcing water)
  splashDrops.forEach(d => {
    const a = d.life/d.maxLife;
    ctx.fillStyle = `rgba(134,239,172,${a*0.6})`;
    ctx.beginPath(); ctx.arc(d.x,d.y,d.size*a,0,Math.PI*2); ctx.fill();
    // Trailing glow
    ctx.fillStyle = `rgba(134,239,172,${a*0.15})`;
    ctx.beginPath(); ctx.arc(d.x,d.y,d.size*a*3,0,Math.PI*2); ctx.fill();
  });

  // FROG
  drawFrog();

  // Fireflies
  fireflies.forEach(f => {
    const bright = 0.2 + Math.pow(Math.max(0, Math.sin(f.phase)),2) * 0.8 + screenPulse*0.3;
    if (bright<0.05) return;
    const gg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,10+bright*5);
    gg.addColorStop(0,`rgba(253,224,71,${bright*0.3})`);
    gg.addColorStop(1,'rgba(253,224,71,0)');
    ctx.fillStyle=gg;
    ctx.beginPath(); ctx.arc(f.x,f.y,10+bright*5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(253,230,100,${bright})`;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.size*bright,0,Math.PI*2); ctx.fill();
  });

  // Particles
  particles.forEach(p => {
    const a=Math.max(0,p.life/(p.maxLife||1));
    ctx.save();
    ctx.translate(p.x,p.y);
    if (p.rot) ctx.rotate(p.rot);
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    if (p.type==='burst') {
      const s = p.size * (0.5+a*0.5);
      ctx.beginPath(); ctx.arc(0,0,s,0,Math.PI*2); ctx.fill();
      // Glow
      ctx.globalAlpha = a * 0.2;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(0,0,s*2.5,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    }
    ctx.globalAlpha=1;
    ctx.restore();
  });

  // Fog
  clouds.forEach(c => {
    const gg=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.size);
    gg.addColorStop(0,`rgba(134,200,160,${c.alpha})`);
    gg.addColorStop(1,'rgba(134,200,160,0)');
    ctx.fillStyle=gg;
    ctx.beginPath(); ctx.arc(c.x,c.y,c.size,0,Math.PI*2); ctx.fill();
  });

  ctx.restore();

  // Beat overlay
  if (screenPulse>0.01) {
    ctx.fillStyle=`rgba(134,239,172,${screenPulse*0.04})`;
    ctx.fillRect(0,0,W,H);
  }

  // Vignette
  const vg=ctx.createRadialGradient(W/2,H/2,W*0.25,W/2,H/2,W*0.75);
  vg.addColorStop(0,'transparent');
  vg.addColorStop(1,'rgba(2,8,5,0.7)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,W,H);

  // Intensity bar (not on mobile - takes space)
  if (intensity>0.03 && !isMobile) {
    const barH=120, barX=W-16, barY=H-barH-20;
    ctx.fillStyle='rgba(134,239,172,0.05)';
    ctx.fillRect(barX,barY,4,barH);
    const filled=intensity*barH;
    const ig=ctx.createLinearGradient(barX,barY+barH-filled,barX,barY+barH);
    ig.addColorStop(0,'rgba(134,239,172,0.8)');
    ig.addColorStop(1,'rgba(74,222,128,0.4)');
    ctx.fillStyle=ig;
    ctx.fillRect(barX,barY+barH-filled,4,filled);
  }

  // ── Mobile UI ──
  if (isMobile && gameRunning) {
    // Fade out timer
    if (touch.joyFadeOut > 0) touch.joyFadeOut = Math.max(0, touch.joyFadeOut - 0.05);

    // Dynamic joystick — only visible when touching or fading
    const joyVisible = touch.joyActive || touch.joyFadeOut > 0;
    if (joyVisible) {
      const baseX = touch.joyActive ? touch.joyBaseX : touch.joyLastBaseX;
      const baseY = touch.joyActive ? touch.joyBaseY : touch.joyLastBaseY;
      const alpha = touch.joyActive ? 1 : touch.joyFadeOut;

      // Outer base ring
      ctx.fillStyle = `rgba(134,239,172,${0.03 * alpha})`;
      ctx.beginPath(); ctx.arc(baseX, baseY, JOY_RADIUS, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(134,239,172,${0.15 * alpha})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(baseX, baseY, JOY_RADIUS, 0, Math.PI * 2); ctx.stroke();

      // Subtle cross-hair lines inside base
      ctx.strokeStyle = `rgba(134,239,172,${0.06 * alpha})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(baseX - JOY_RADIUS * 0.6, baseY);
      ctx.lineTo(baseX + JOY_RADIUS * 0.6, baseY);
      ctx.moveTo(baseX, baseY - JOY_RADIUS * 0.6);
      ctx.lineTo(baseX, baseY + JOY_RADIUS * 0.6);
      ctx.stroke();

      // Direction line
      const knobX = touch.joyActive ? touch.joyKnobX : baseX;
      const knobY = touch.joyActive ? touch.joyKnobY : baseY;
      if (touch.joyForce > 0.05 && touch.joyActive) {
        ctx.strokeStyle = `rgba(134,239,172,${0.08 * alpha})`;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(baseX, baseY); ctx.lineTo(knobX, knobY); ctx.stroke();
      }

      // Knob
      const knobR = 18 + touch.joyForce * 4;
      const knobAlpha = (0.2 + touch.joyForce * 0.4) * alpha;
      const jg = ctx.createRadialGradient(knobX, knobY, 0, knobX, knobY, knobR);
      jg.addColorStop(0, `rgba(134,239,172,${knobAlpha})`);
      jg.addColorStop(0.6, `rgba(134,239,172,${knobAlpha * 0.4})`);
      jg.addColorStop(1, `rgba(134,239,172,${knobAlpha * 0.05})`);
      ctx.fillStyle = jg;
      ctx.beginPath(); ctx.arc(knobX, knobY, knobR, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(134,239,172,${knobAlpha * 0.7})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(knobX, knobY, knobR, 0, Math.PI * 2); ctx.stroke();
      // Center dot
      ctx.fillStyle = `rgba(134,239,172,${knobAlpha * 0.5})`;
      ctx.beginPath(); ctx.arc(knobX, knobY, 2.5, 0, Math.PI * 2); ctx.fill();
    }

    // "Touch left side to move" hint (only before first touch)
    if (!touch.joyActive && touch.joyFadeOut <= 0 && globalTime < 5) {
      const hintAlpha = Math.max(0, 1 - globalTime / 4) * (0.3 + Math.sin(globalTime * 2) * 0.1);
      ctx.fillStyle = `rgba(134,239,172,${hintAlpha})`;
      ctx.font = '11px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('touch here to move', W * 0.2, H * 0.75);
      ctx.textAlign = 'start';
    }

    // Flop button (bottom-right)
    const flopBtnX = W - 55, flopBtnY = H - 55;
    const flopAlpha = frog.isFlopping ? 0.5 : 0.2;
    ctx.fillStyle = 'rgba(134,239,172,0.04)';
    ctx.beginPath(); ctx.arc(flopBtnX, flopBtnY, 38, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(134,239,172,${flopAlpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(flopBtnX, flopBtnY, 35, 0, Math.PI * 2); ctx.stroke();
    const fg = ctx.createRadialGradient(flopBtnX, flopBtnY, 0, flopBtnX, flopBtnY, 35);
    fg.addColorStop(0, `rgba(134,239,172,${flopAlpha * 0.5})`);
    fg.addColorStop(1, 'rgba(134,239,172,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(flopBtnX, flopBtnY, 35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(134,239,172,${flopAlpha + 0.1})`;
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('FLOP', flopBtnX, flopBtnY + 4);
    ctx.textAlign = 'start';
  }

  // Hide crosshair on mobile
  if (!isMobile) {
    const chPulse = 1 + screenPulse * 2;
    ctx.strokeStyle=`rgba(134,239,172,${0.35+screenPulse})`;
    ctx.lineWidth=1.5;
    const chh=7*chPulse;
    ctx.beginPath();
    ctx.moveTo(mouseX-chh,mouseY); ctx.lineTo(mouseX-3,mouseY);
    ctx.moveTo(mouseX+3,mouseY); ctx.lineTo(mouseX+chh,mouseY);
    ctx.moveTo(mouseX,mouseY-chh); ctx.lineTo(mouseX,mouseY-3);
    ctx.moveTo(mouseX,mouseY+3); ctx.lineTo(mouseX,mouseY+chh);
    ctx.stroke();
    ctx.fillStyle=`rgba(134,239,172,${0.5+screenPulse})`;
    ctx.beginPath(); ctx.arc(mouseX,mouseY,1.5,0,Math.PI*2); ctx.fill();
  }

  // ── Dialogue Box ──
  if (dialogue.active && dialogue.lines[dialogue.lineIndex]) {
    const line = dialogue.lines[dialogue.lineIndex];
    const boxW = Math.min(W - 40, 500);
    const boxH = dialogue.choices && dialogue.fullLineShown ? 160 + dialogue.choices.length * 28 : 130;
    const boxX = (W - boxW) / 2;
    const boxY = H - boxH - 20;

    // Box background
    ctx.fillStyle = 'rgba(5,15,8,0.92)';
    ctx.strokeStyle = 'rgba(134,239,172,0.4)';
    ctx.lineWidth = 2;
    // Rounded rect
    const r = 8;
    ctx.beginPath();
    ctx.moveTo(boxX+r, boxY);
    ctx.lineTo(boxX+boxW-r, boxY);
    ctx.quadraticCurveTo(boxX+boxW, boxY, boxX+boxW, boxY+r);
    ctx.lineTo(boxX+boxW, boxY+boxH-r);
    ctx.quadraticCurveTo(boxX+boxW, boxY+boxH, boxX+boxW-r, boxY+boxH);
    ctx.lineTo(boxX+r, boxY+boxH);
    ctx.quadraticCurveTo(boxX, boxY+boxH, boxX, boxY+boxH-r);
    ctx.lineTo(boxX, boxY+r);
    ctx.quadraticCurveTo(boxX, boxY, boxX+r, boxY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Inner glow line at top
    ctx.strokeStyle = 'rgba(134,239,172,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(boxX+20, boxY+1);
    ctx.lineTo(boxX+boxW-20, boxY+1);
    ctx.stroke();

    // Speaker name
    if (line.speaker) {
      // Name box
      const nameW = ctx.measureText ? line.speaker.length * 8 + 20 : 100;
      ctx.fillStyle = 'rgba(5,15,8,0.95)';
      ctx.strokeStyle = 'rgba(134,239,172,0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(boxX+12+r, boxY-22);
      ctx.lineTo(boxX+12+nameW-r, boxY-22);
      ctx.quadraticCurveTo(boxX+12+nameW, boxY-22, boxX+12+nameW, boxY-22+r);
      ctx.lineTo(boxX+12+nameW, boxY);
      ctx.lineTo(boxX+12, boxY);
      ctx.lineTo(boxX+12, boxY-22+r);
      ctx.quadraticCurveTo(boxX+12, boxY-22, boxX+12+r, boxY-22);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#86efac';
      ctx.font = '12px Courier New';
      ctx.fillText(line.speaker, boxX + 22, boxY - 7);
    }

    // Text (typewriter effect)
    const displayText = line.text.substring(0, Math.floor(dialogue.charIndex));
    const textLines = displayText.split('\n');
    ctx.fillStyle = '#c8e6c9';
    ctx.font = '13px Courier New';
    textLines.forEach((tl, i) => {
      ctx.fillText(tl, boxX + 20, boxY + 30 + i * 20);
    });

    // Blinking cursor at end of text
    if (!dialogue.fullLineShown && Math.sin(globalTime * 6) > 0) {
      const lastLine = textLines[textLines.length - 1] || '';
      const cursorX = boxX + 20 + lastLine.length * 7.8;
      const cursorY = boxY + 18 + (textLines.length - 1) * 20;
      ctx.fillStyle = '#86efac';
      ctx.fillRect(cursorX, cursorY, 7, 14);
    }

    // Choices
    if (dialogue.choices && dialogue.fullLineShown) {
      const choiceStartY = boxY + 30 + (line.text.split('\n').length) * 20 + 10;
      dialogue.choices.forEach((choice, i) => {
        const isSelected = i === dialogue.choiceIndex;
        const cy = choiceStartY + i * 28;

        if (isSelected) {
          // Selection highlight
          ctx.fillStyle = 'rgba(134,239,172,0.08)';
          ctx.fillRect(boxX + 14, cy - 4, boxW - 28, 24);
          ctx.fillStyle = '#86efac';
          ctx.fillText('>', boxX + 20, cy + 12);
        }

        ctx.fillStyle = isSelected ? '#86efac' : '#5a8a60';
        ctx.font = isSelected ? 'bold 13px Courier New' : '13px Courier New';
        ctx.fillText(choice.text, boxX + 36, cy + 12);
      });
    }

    // Continue prompt (bottom-right of box)
    if (dialogue.fullLineShown && !dialogue.choices) {
      const promptAlpha = 0.3 + Math.sin(globalTime * 4) * 0.3;
      ctx.fillStyle = `rgba(134,239,172,${promptAlpha})`;
      ctx.font = '10px Courier New';
      ctx.textAlign = 'right';
      ctx.fillText(isMobile ? 'tap to continue' : 'SPACE / CLICK', boxX + boxW - 16, boxY + boxH - 12);
      ctx.textAlign = 'start';
    }

    // Down arrow for continue
    if (dialogue.fullLineShown && !dialogue.choices) {
      const arrowY = boxY + boxH - 18 + Math.sin(globalTime * 4) * 3;
      ctx.fillStyle = `rgba(134,239,172,${0.4 + Math.sin(globalTime * 4) * 0.2})`;
      ctx.beginPath();
      ctx.moveTo(boxX + boxW / 2 - 5, arrowY);
      ctx.lineTo(boxX + boxW / 2 + 5, arrowY);
      ctx.lineTo(boxX + boxW / 2, arrowY + 5);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Mobile interact button (when near NPC and not in dialogue)
  if (isMobile && gameRunning && !dialogue.active && getNearestNPC()) {
    const ibX = 60, ibY = H - 140;
    ctx.strokeStyle = 'rgba(134,239,172,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ibX, ibY, 28, 0, Math.PI * 2); ctx.stroke();
    const ig = ctx.createRadialGradient(ibX, ibY, 0, ibX, ibY, 28);
    ig.addColorStop(0, 'rgba(134,239,172,0.15)');
    ig.addColorStop(1, 'rgba(134,239,172,0)');
    ctx.fillStyle = ig;
    ctx.beginPath(); ctx.arc(ibX, ibY, 28, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(134,239,172,0.5)';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('TALK', ibX, ibY + 4);
    ctx.textAlign = 'start';
  }

  // ── Zone transition overlay ──
  if (zoneTransition.active) {
    ctx.fillStyle = `rgba(0,0,0,${zoneTransition.alpha})`;
    ctx.fillRect(0, 0, W, H);
    if (zoneTransition.alpha > 0.5) {
      const textAlpha = (zoneTransition.alpha - 0.5) * 2;
      ctx.fillStyle = `rgba(134,239,172,${textAlpha * 0.8})`;
      ctx.font = '24px Courier New';
      ctx.textAlign = 'center';
      const zoneName = ZONES[zoneTransition.targetZone] ? ZONES[zoneTransition.targetZone].name : 'Unknown';
      ctx.fillText(zoneName, W/2, H/2 - 10);
      ctx.font = '11px Courier New';
      ctx.fillStyle = `rgba(134,239,172,${textAlpha * 0.4})`;
      ctx.fillText(`Zone ${zoneTransition.targetZone}`, W/2, H/2 + 20);
      ctx.textAlign = 'start';
    }
  }
}

function drawWater() {
  const zone = ZONES[currentZone];
  ctx.fillStyle = zone.bgColor;
  ctx.fillRect(camera.x-10,camera.y-10,W+20,H+20);
  const cellSize=20;
  const startX=Math.floor(camera.x/cellSize)*cellSize;
  const startY=Math.floor(camera.y/cellSize)*cellSize;
  for (let x=startX;x<camera.x+W+cellSize;x+=cellSize) {
    for (let y=startY;y<camera.y+H+cellSize;y+=cellSize) {
      const w1=Math.sin(x*0.012+globalTime*0.7)*Math.cos(y*0.01+globalTime*0.5);
      const w2=Math.sin(x*0.007-globalTime*0.4)*Math.sin(y*0.009+globalTime*0.25);
      const w3=Math.sin((x+y)*0.005+globalTime*0.3)*0.5;
      const wave=(w1+w2+w3)/3;
      const bright=5+wave*4+screenPulse*10;
      const wb = zone.waterBase;
      const r = Math.floor(wb[0] + bright*0.15);
      const g = Math.floor(wb[1] + bright*(currentZone===1?1:0.5));
      const b = Math.floor(wb[2] + bright*(currentZone===1?0.3:0.8));
      ctx.fillStyle=`rgb(${r},${g},${b})`;
      ctx.fillRect(x,y,2,2);
      const wh = zone.waterHighlight;
      if (wave>0.25) {
        ctx.fillStyle=`rgba(${wh[0]},${wh[1]},${wh[2]},${(wave-0.25)*0.03})`;
        ctx.fillRect(x+1,y,1,1);
      }
    }
  }
  // Caustics
  for (let i=0;i<15;i++) {
    const cx=((Math.sin(globalTime*0.25+i*2.1)+1)/2)*WORLD_W;
    const cy=((Math.cos(globalTime*0.2+i*1.7)+1)/2)*WORLD_H;
    const size=50+Math.sin(globalTime*0.8+i)*25;
    const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,size);
    const wh = zone.waterHighlight;
    cg.addColorStop(0,`rgba(${wh[0]},${wh[1]},${wh[2]},0.012)`);
    cg.addColorStop(1,'transparent');
    ctx.fillStyle=cg;
    ctx.beginPath(); ctx.arc(cx,cy,size,0,Math.PI*2); ctx.fill();
  }

  // ── Zone 2: THE BOG — Frog Rave ──
  if (currentZone === 2) {
    const cx = WORLD_W/2, cy = WORLD_H/2;
    const beatPulse = Math.pow(Math.max(0, Math.sin(globalTime * (BPM/60) * Math.PI)), 4);

    // ── Pulsing floor grid ──
    ctx.globalAlpha = 0.04 + beatPulse * 0.03;
    const gridSize = 40;
    const gridStartX = Math.floor(camera.x/gridSize)*gridSize;
    const gridStartY = Math.floor(camera.y/gridSize)*gridSize;
    for (let gx = gridStartX; gx < camera.x + W + gridSize; gx += gridSize) {
      for (let gy = gridStartY; gy < camera.y + H + gridSize; gy += gridSize) {
        const dist = Math.sqrt(Math.pow(gx-cx,2)+Math.pow(gy-cy,2));
        const wave = Math.sin(dist * 0.02 - globalTime * 3) * 0.5 + 0.5;
        const hue = (dist * 0.1 + globalTime * 40) % 360;
        ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
        ctx.globalAlpha = (0.02 + wave * 0.03) * (1 + beatPulse * 2);
        ctx.fillRect(gx, gy, gridSize - 2, gridSize - 2);
      }
    }
    ctx.globalAlpha = 1;
