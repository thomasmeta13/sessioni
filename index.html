<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ─── EASING ───
function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -10 * t) * Math.sin((t - 0.075) * (2 * Math.PI) / 0.3) + 1;
}
function easeOutBack(t) { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function lerp(a,b,t) { return a + (b - a) * t; }
function smoothDamp(current, target, velocity, smoothTime, dt) {
  const omega = 2 / smoothTime;
  const x = omega * dt;
  const exp = 1 / (1 + x + 0.48*x*x + 0.235*x*x*x);
  const change = current - target;
  const temp = (velocity + omega * change) * dt;
  velocity = (velocity - omega * temp) * exp;
  return { value: target + (change + temp) * exp, velocity };
}

// ─── AUDIO ───
let audioCtx, masterGain, musicStarted = false;
let layers = {};
let intensityTarget = 0, intensity = 0;
let beatTimer = 0, beatCount = 0;
const BPM = 88;
const beatInterval = 60 / BPM;
let screenPulse = 0, screenShake = 0;
let onBeat = false;

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.25;
  masterGain.connect(audioCtx.destination);
  // Reverb
  const conv = audioCtx.createConvolver();
  const rate = audioCtx.sampleRate, len = rate * 2;
  const imp = audioCtx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) { const d = imp.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len,2.5); }
  conv.buffer = imp;
  const rvG = audioCtx.createGain(); rvG.gain.value = 0.15;
  conv.connect(rvG); rvG.connect(masterGain);
  // Sub bass
  const sub = audioCtx.createOscillator(); sub.type='sine'; sub.frequency.value=45;
  const subG = audioCtx.createGain(); subG.gain.value=0.3;
  sub.connect(subG); subG.connect(masterGain); sub.connect(conv); sub.start();
  layers.sub = {osc:sub,gain:subG};
  // Pad
  const pad = audioCtx.createOscillator(); pad.type='triangle'; pad.frequency.value=110;
  const padG = audioCtx.createGain(); padG.gain.value=0.1;
  const padF = audioCtx.createBiquadFilter(); padF.type='lowpass'; padF.frequency.value=400;
  pad.connect(padF); padF.connect(padG); padG.connect(masterGain); padF.connect(conv); pad.start();
  layers.pad = {osc:pad,gain:padG,filter:padF};
  // Pad 2
  const pad2 = audioCtx.createOscillator(); pad2.type='triangle'; pad2.frequency.value=110.5;
  const pad2G = audioCtx.createGain(); pad2G.gain.value=0.06;
  pad2.connect(pad2G); pad2G.connect(masterGain); pad2.start();
  layers.pad2 = {osc:pad2,gain:pad2G};
  // Pluck
  const pluck = audioCtx.createOscillator(); pluck.type='square'; pluck.frequency.value=220;
  const plkF = audioCtx.createBiquadFilter(); plkF.type='lowpass'; plkF.frequency.value=800;
  const plkG = audioCtx.createGain(); plkG.gain.value=0;
  pluck.connect(plkF); plkF.connect(plkG); plkG.connect(masterGain); pluck.start();
  layers.pluck = {osc:pluck,gain:plkG,filter:plkF};
  // Hi
  const hi = audioCtx.createOscillator(); hi.type='sine'; hi.frequency.value=880;
  const hiG = audioCtx.createGain(); hiG.gain.value=0;
  hi.connect(hiG); hiG.connect(masterGain); hi.start();
  layers.hi = {osc:hi,gain:hiG};
  musicStarted = true;
}

const bassNotes = [45,45,50,45,55,50,45,45,45,50,55,60,55,50,45,45];
const padNotes = [110,130.81,146.83,130.81,110,123.47,146.83,130.81];
const pluckNotes = [220,261.63,293.66,329.63,349.23,329.63,293.66,261.63,220,246.94,293.66,329.63,349.23,392,349.23,329.63];

function updateMusic(dt) {
  if (!musicStarted) return;
  onBeat = false;
  beatTimer += dt;
  if (beatTimer >= beatInterval) {
    beatTimer -= beatInterval;
    beatCount++;
    onBeat = true;
    const t = audioCtx.currentTime;
    layers.sub.osc.frequency.setTargetAtTime(bassNotes[beatCount%bassNotes.length], t, 0.08);
    layers.sub.gain.gain.setValueAtTime(0.35, t);
    layers.sub.gain.gain.setTargetAtTime(0.25, t+0.1, 0.2);
    if (beatCount%4===0) {
      const pn = padNotes[(beatCount/4)%padNotes.length];
      layers.pad.osc.frequency.setTargetAtTime(pn, t, 0.3);
      layers.pad2.osc.frequency.setTargetAtTime(pn*1.003, t, 0.3);
    }
    const pln = pluckNotes[beatCount%pluckNotes.length];
    layers.pluck.osc.frequency.setTargetAtTime(pln, t, 0.01);
    if (intensity>0.2) {
      layers.pluck.gain.gain.setValueAtTime(intensity*0.12, t);
      layers.pluck.gain.gain.setTargetAtTime(0, t+0.05, 0.08);
    }
    if (intensity>0.5 && beatCount%2===1) {
      layers.hi.gain.gain.setValueAtTime(intensity*0.04, t);
      layers.hi.gain.gain.setTargetAtTime(0, t+0.02, 0.03);
    }
    screenPulse = 0.12 + intensity * 0.15;
  }
  intensity += (intensityTarget - intensity) * dt * 2.5;
  intensityTarget = Math.max(0, intensityTarget - dt * 0.08);
  if (musicStarted) {
    layers.pad.filter.frequency.setTargetAtTime(400+intensity*600, audioCtx.currentTime, 0.1);
    layers.pluck.filter.frequency.setTargetAtTime(600+intensity*1200, audioCtx.currentTime, 0.1);
  }
}

function sfx(freq, freqEnd, dur, vol, type='sine') {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freqEnd, t+dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+dur+0.01);
}

function sfxNoise(dur, vol, freq) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*dur, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=1;
  const g = audioCtx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t+dur);
}

// ─── NPCs ───
const npcs = [];
const dialogue = {

function startDialogue(npc) {
  const lines = npc.talked ? npc.dialogueAfter : npc.dialogue;
  dialogue.active = true;
  dialogue.npc = npc;
  dialogue.lines = lines;
  dialogue.lineIndex = 0;
  dialogue.charIndex = 0;
  dialogue.charTimer = 0;
  dialogue.choices = null;
  dialogue.choiceIndex = 0;
  dialogue.waitingForInput = false;
  dialogue.fullLineShown = false;
}

function advanceDialogue() {
  if (!dialogue.active) return;

  const line = dialogue.lines[dialogue.lineIndex];

  // If text is still typing, show full line
  if (!dialogue.fullLineShown) {
    dialogue.charIndex = line.text.length;
    dialogue.fullLineShown = true;
    // If this line has choices, show them now
    if (line.choices) {
      dialogue.choices = line.choices;
      dialogue.choiceIndex = 0;
    }
    return;
  }

  // If showing choices, select current choice
  if (dialogue.choices) {
    const choice = dialogue.choices[dialogue.choiceIndex];
    // Show response as next line
    dialogue.lines.splice(dialogue.lineIndex + 1, 0, {
      text: choice.response,
      speaker: dialogue.npc.name,
    });
    dialogue.choices = null;
    dialogue.lineIndex++;
    dialogue.charIndex = 0;
    dialogue.charTimer = 0;
    dialogue.fullLineShown = false;
    return;
  }

  // Next line
  dialogue.lineIndex++;
  if (dialogue.lineIndex >= dialogue.lines.length) {
    // End dialogue
    dialogue.active = false;
    dialogue.npc.talked = true;
    return;
  }
  dialogue.charIndex = 0;
  dialogue.charTimer = 0;
  dialogue.fullLineShown = false;
}

function dialogueChoiceUp() {
  if (dialogue.choices) {
    dialogue.choiceIndex = (dialogue.choiceIndex - 1 + dialogue.choices.length) % dialogue.choices.length;
  }
}
function dialogueChoiceDown() {
  if (dialogue.choices) {
    dialogue.choiceIndex = (dialogue.choiceIndex + 1) % dialogue.choices.length;
  }
}

function getNearestNPC() {
  let nearest = null, nearestDist = 60;
  npcs.forEach(npc => {
    const dx = frog.x - npc.x, dy = frog.y - npc.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if (dist < nearestDist) { nearest = npc; nearestDist = dist; }
  });
  return nearest;
}

const JOY_RADIUS = 50;
const JOY_DEAD = 8;

function shootTongue(targetX, targetY) {
  if (!gameRunning || tongue.active) return;
  tongue.active = true;
  tongue.progress = 0;
  tongue.returning = false;
  tongue.caught = null;
  tongue.wobble = 1;
  const dx = targetX - frog.x;
  const dy = targetY - frog.y;
  const dist = Math.sqrt(dx*dx+dy*dy) || 1;
  tongue.tx = frog.x + (dx/dist) * tongue.length;
  tongue.ty = frog.y + (dy/dist) * tongue.length;
  frog.targetScaleX = 0.8;
  frog.targetScaleY = 1.25;
  frog.mouthOpen = 1;
  frog.pupilDilate = 0.6;
  sfx(500, 150, 0.08, 0.08);
}

function triggerFlop() {
  if (!gameRunning || frog.isFlopping) return;
  frog.isFlopping = true;
  frog.flopWindup = 0.15;
  frog.flopAirtime = 0.25;
  frog.flopTimer = 0.6;
  frog.flopRadius = 0;
  frog.targetScaleX = 1.5;
  frog.targetScaleY = 0.5;
  frog.hopHeight = 0;
  frog.hopVel = -8;
  frog.eyeStretch = 1;
  frog.pupilDilate = 0.4;
}

// Desktop
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') e.preventDefault();

  if (!gameRunning) return;

  // Dialogue controls
  if (dialogue.active) {
    if (e.code === 'Space' || e.code === 'Enter' || e.key.toLowerCase() === 'e') {
      e.preventDefault();
      advanceDialogue();
      return;
    }
    if (e.code === 'ArrowUp' || e.key.toLowerCase() === 'w') { dialogueChoiceUp(); return; }
    if (e.code === 'ArrowDown' || e.key.toLowerCase() === 's') { dialogueChoiceDown(); return; }
    return; // Block all other input during dialogue
  }

  // Interact with NPC
  if (e.key.toLowerCase() === 'e') {
    const npc = getNearestNPC();
    if (npc) startDialogue(npc);
    return;
  }

  if (e.code === 'Space') triggerFlop();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()]=false);
window.addEventListener('mousemove', e => { mouseX=e.clientX; mouseY=e.clientY; });
window.addEventListener('mousedown', e => {
  if (!gameRunning) return;
  if (dialogue.active) { advanceDialogue(); return; }
  shootTongue(mouseWorld.x, mouseWorld.y);
});

// Mobile touch
if (isMobile) {
  document.getElementById('controls-desktop').style.display = 'none';
  document.getElementById('controls-mobile').style.display = 'block';

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const x = t.clientX, y = t.clientY;
      // Dialogue tap
      if (dialogue.active) {
        // Choice selection - top/bottom half of dialogue box
        if (dialogue.choices && y > H - 180) {
          const choiceY = y - (H - 170);
          dialogue.choiceIndex = choiceY < 60 ? 0 : Math.min(Math.floor(choiceY / 30), dialogue.choices.length - 1);
        }
        advanceDialogue();
        continue;
      }

      // Interact button (bottom-left, above joystick area)
      if (x < 120 && y > H - 180 && y < H - 100) {
        const npc = getNearestNPC();
        if (npc) startDialogue(npc);
        continue;
      }

      // Flop button (bottom-right corner)
      if (x > W - 100 && y > H - 100) {
        touch.flopId = t.identifier;
        triggerFlop();
        continue;
      }
      // Left half = joystick (fixed pad at bottom-left)
      if (x < W * 0.45 && touch.joyId === null) {
        touch.joyId = t.identifier;
        touch.joyStartX = 80; // Fixed pad center
        touch.joyStartY = H - 100;
        touch.joyX = x;
        touch.joyY = y;
        touch.joyActive = true;
        // Compute initial offset from pad center
        let dx = x - touch.joyStartX;
        let dy = y - touch.joyStartY;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist > JOY_DEAD) {
          const clamped = Math.min(dist, JOY_RADIUS);
          touch.joyDx = (dx/dist) * (clamped/JOY_RADIUS);
          touch.joyDy = (dy/dist) * (clamped/JOY_RADIUS);
        }
      }
      // Right half = aim + tongue
      else if (x >= W * 0.4 && touch.atkId === null) {
        touch.atkId = t.identifier;
        mouseX = x;
        mouseY = y;
        const wx = x + camera.x;
        const wy = y + camera.y;
        shootTongue(wx, wy);
      }
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === touch.joyId) {
        touch.joyX = t.clientX;
        touch.joyY = t.clientY;
        // Always relative to fixed pad center
        let dx = touch.joyX - 80;
        let dy = touch.joyY - (H - 100);
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist > JOY_DEAD) {
          const clamped = Math.min(dist, JOY_RADIUS);
          touch.joyDx = (dx/dist) * (clamped/JOY_RADIUS);
          touch.joyDy = (dy/dist) * (clamped/JOY_RADIUS);
        } else {
          touch.joyDx = 0;
          touch.joyDy = 0;
        }
      }
      if (t.identifier === touch.atkId) {
        mouseX = t.clientX;
        mouseY = t.clientY;
      }
    }
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touch.joyId) {
        touch.joyId = null;
        touch.joyDx = 0;
        touch.joyDy = 0;
        touch.joyActive = false;
      }
      if (t.identifier === touch.atkId) {
        touch.atkId = null;
      }
      if (t.identifier === touch.flopId) {
        touch.flopId = null;
      }
    }
  });

  canvas.addEventListener('touchcancel', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touch.joyId) { touch.joyId=null; touch.joyDx=0; touch.joyDy=0; touch.joyActive=false; }
      if (t.identifier === touch.atkId) touch.atkId=null;
      if (t.identifier === touch.flopId) touch.flopId=null;
    }
  });
}

function doFlopLand() {
  screenShake = 0.5;
  frog.targetScaleX = 1.6;
  frog.targetScaleY = 0.4;
  frog.landSquash = 1;
  frog.landTimer = 0.3;
  // Multiple ripple waves
  for (let i=0;i<3;i++) {
    ripples.push({ x:frog.x, y:frog.y, radius:i*10, maxRadius:100+i*40, alpha:0.8-i*0.2, width:3-i });
  }
  // Big splash
  for (let i=0;i<25;i++) {
    const a = Math.random()*Math.PI*2;
    const spd = 2+Math.random()*6;
    splashDrops.push({
      x:frog.x, y:frog.y,
      vx:Math.cos(a)*spd, vy:-3-Math.random()*5,
      life:0.6+Math.random()*0.4, maxLife:1,
      size: 2+Math.random()*3, gravity: 12,
    });
  }
  for (let i=0;i<12;i++) {
    const a = (i/12)*Math.PI*2;
    particles.push({
      x:frog.x+Math.cos(a)*20, y:frog.y+Math.sin(a)*12,
      vx:Math.cos(a)*3, vy:Math.sin(a)*2,
      life:0.5, maxLife:0.5,
      color:`hsl(150,60%,${30+Math.random()*30}%)`,
      size:2+Math.random()*3, type:'ring',
    });
  }
  sfx(100, 30, 0.3, 0.18);
  sfxNoise(0.25, 0.12, 300);
  // Hit bugs
  bugs.forEach(bug => {
    if (!bug.alive) return;
    const dx=bug.x-frog.x, dy=bug.y-frog.y;
    if (Math.sqrt(dx*dx+dy*dy) < 120) killBug(bug);
  });
  intensityTarget = Math.min(intensityTarget+0.25, 1);
}

function killBug(bug) {
  bug.hp--;
  if (bug.hp <= 0) {
    bug.alive = false;
    bug.dying = true;
    bug.deathAnim = 1;
    score++;
    combo++;
    comboTimer = 2.5;
    intensityTarget = Math.min(intensityTarget + 0.12, 1);
    screenShake = Math.max(screenShake, 0.12);
    // Frog gulp
    frog.gulpTimer = 0.3;
    frog.cheekPuff = 1;
    frog.targetScaleX = 1.15;
    frog.targetScaleY = 0.9;
    const colors = {
      fly:['#86efac','#4ade80','#22c55e'],
      dragonfly:['#7dd3fc','#38bdf8','#0ea5e9'],
      beetle:['#fde68a','#fbbf24','#f59e0b'],
      moth:['#e9d5ff','#c084fc','#a855f7'],
    };
    const cols = colors[bug.type]||colors.fly;
    // Burst particles with more variation
    for (let i=0;i<16;i++) {
      const a=Math.random()*Math.PI*2;
      const spd=1+Math.random()*4;
      particles.push({
        x:bug.x, y:bug.y,
        vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-1,
        life:0.4+Math.random()*0.6, maxLife:1,
        color:cols[Math.floor(Math.random()*cols.length)],
        size:1.5+Math.random()*3.5, type:'burst',
        rotSpeed: (Math.random()-0.5)*10,
        rot: 0,
      });
    }
    // Ring particles
    for (let i=0;i<8;i++) {
      const a=(i/8)*Math.PI*2;
      particles.push({
        x:bug.x+Math.cos(a)*8, y:bug.y+Math.sin(a)*8,
        vx:Math.cos(a)*2, vy:Math.sin(a)*2,
        life:0.3, maxLife:0.3,
        color:cols[0], size:1.5, type:'ring',
        rotSpeed:0, rot:0,
      });
    }
    ripples.push({ x:bug.x, y:bug.y, radius:0, maxRadius:40, alpha:0.4, width:1.5 });
    // Rising pitch catch sound
    const freq = 350 + Math.min(combo,12)*50;
    sfx(freq, freq*2, 0.1, 0.1);
    sfx(freq*1.5, freq*3, 0.08, 0.05);
    document.getElementById('score').textContent = 'BUGS: '+score;
    setTimeout(spawnBug, 1500+Math.random()*2500);
  }
}

// ─── UPDATE ───
function update(dt) {
  if (!gameRunning) return;
  globalTime += dt;
  mouseWorld.x = mouseX+camera.x;
  mouseWorld.y = mouseY+camera.y;

  // ── Dialogue update ──
  if (dialogue.active) {
    const line = dialogue.lines[dialogue.lineIndex];
    if (line && dialogue.charIndex < line.text.length) {
      dialogue.charTimer += dt;
      while (dialogue.charTimer >= dialogue.charSpeed && dialogue.charIndex < line.text.length) {
        dialogue.charTimer -= dialogue.charSpeed;
        dialogue.charIndex++;
      }
      if (dialogue.charIndex >= line.text.length) {
        dialogue.fullLineShown = true;
        if (line.choices) {
          dialogue.choices = line.choices;
          dialogue.choiceIndex = 0;
        }
      }
    }
  }

  // ── Frog movement (hop-based) ──
  const speed = isMobile ? 140 : 240;
  let mx=0, my=0;
  if (dialogue.active) {
    mx = 0; my = 0; // Block movement during dialogue
  } else if (isMobile) {
    mx = touch.joyDx;
    my = touch.joyDy;
  } else {
    if (keys['w']||keys['arrowup']) my-=1;
    if (keys['s']||keys['arrowdown']) my+=1;
    if (keys['a']||keys['arrowleft']) mx-=1;
    if (keys['d']||keys['arrowright']) mx+=1;
  }
  const wasMoving = frog.isMoving;
  const moveLen = Math.sqrt(mx*mx+my*my);
  frog.isMoving = moveLen > 0.05;
  if (frog.isMoving) {
    if (!isMobile && moveLen > 0) { mx/=moveLen; my/=moveLen; }
    frog.moveAngle = Math.atan2(my, mx);
  }

  // Start hopping when movement begins
  if (frog.isMoving && !wasMoving) {
    frog.isHopping = true;
    frog.hopVel = -4;
  }

  if (isMobile) {
    if (frog.isMoving) frog.dir = frog.moveAngle;
    else if (touch.atkId !== null) frog.dir = Math.atan2(mouseWorld.y-frog.y, mouseWorld.x-frog.x);
  } else {
    frog.dir = Math.atan2(mouseWorld.y-frog.y, mouseWorld.x-frog.x);
  }

  frog.vx += mx*speed*dt;
  frog.vy += my*speed*dt;
  frog.vx *= 0.87;
  frog.vy *= 0.87;
  frog.x += frog.vx;
  frog.y += frog.vy;
  frog.x = Math.max(30, Math.min(WORLD_W-30, frog.x));
  frog.y = Math.max(30, Math.min(WORLD_H-30, frog.y));

  // ── Hop animation ──
  if (frog.isMoving && !frog.isFlopping) {
    frog.walkPhase += dt * 10;
    const hopCycle = Math.sin(frog.walkPhase);
    if (hopCycle > 0.9 && !frog.isHopping) {
      frog.isHopping = true;
      frog.hopVel = -3.5;
      frog.targetScaleX = 0.85;
      frog.targetScaleY = 1.2;
    }
  }

  // Hop physics
  if (frog.isHopping) {
    frog.hopHeight += frog.hopVel;
    frog.hopVel += 0.5; // gravity
    if (frog.hopHeight >= 0) {
      frog.hopHeight = 0;
      frog.hopVel = 0;
      frog.isHopping = false;
      // Land squash
      frog.targetScaleX = 1.2;
      frog.targetScaleY = 0.8;
      frog.landSquash = 0.5;
      frog.landTimer = 0.15;
      // Small ripple on land
      if (frog.isMoving) {
        ripples.push({ x:frog.x, y:frog.y+10, radius:0, maxRadius:18, alpha:0.15, width:1 });
      }
    }
  }

  // ── Belly flop phases ──
  if (frog.isFlopping) {
    frog.flopTimer -= dt;
    // Windup phase
    if (frog.flopWindup > 0) {
      frog.flopWindup -= dt;
      frog.targetScaleX = 0.7;
      frog.targetScaleY = 1.4;
    }
    // Airtime
    else if (frog.flopAirtime > 0) {
      frog.flopAirtime -= dt;
      frog.hopHeight += frog.hopVel;
      frog.hopVel += 0.8;
      frog.targetScaleX = 1.3;
      frog.targetScaleY = 0.75;
      frog.rotation = lerp(frog.rotation, 0.1, dt*10);
      if (frog.hopHeight >= 0 && frog.hopVel > 0) {
        frog.hopHeight = 0;
        frog.flopAirtime = 0;
        doFlopLand();
      }
    }
    // Recovery
    else {
      frog.flopRadius = (1 - frog.flopTimer/0.6) * 160;
    }
    if (frog.flopTimer <= 0) {
      frog.isFlopping = false;
      frog.rotation = 0;
    }
  }

  // ── Scale animation (spring-like) ──
  frog.scaleX += (frog.targetScaleX - frog.scaleX) * dt * 14;
  frog.scaleY += (frog.targetScaleY - frog.scaleY) * dt * 14;
  frog.targetScaleX += (1 - frog.targetScaleX) * dt * 6;
  frog.targetScaleY += (1 - frog.targetScaleY) * dt * 6;

  // Land squash recovery
  if (frog.landTimer > 0) {
    frog.landTimer -= dt;
    frog.landSquash *= 0.9;
  }

  // ── Eye animations ──
  frog.breathe += dt * 1.5;
  frog.blinkTimer -= dt;
  if (frog.blinkTimer <= 0) { frog.eyeBlink = 1; frog.blinkTimer = 2+Math.random()*5; }
  if (frog.eyeBlink > 0) frog.eyeBlink = Math.max(0, frog.eyeBlink-dt*10);
  frog.eyeStretch *= (1 - dt * 5);
  frog.pupilDilate += (1 - frog.pupilDilate) * dt * 4;
  // Smooth eye tracking
  frog.lookTargetX = Math.cos(frog.dir) * 3;
  frog.lookTargetY = Math.sin(frog.dir) * 2;
  frog.lookX += (frog.lookTargetX - frog.lookX) * dt * 8;
  frog.lookY += (frog.lookTargetY - frog.lookY) * dt * 8;
  // Cheek puff
  frog.cheekPuff *= (1 - dt * 4);
  // Mouth
  frog.mouthOpen *= (1 - dt * 8);
  frog.gulpTimer = Math.max(0, frog.gulpTimer - dt);

  // ── Idle animations ──
  if (!frog.isMoving && !tongue.active && !frog.isFlopping) {
    frog.idleTimer += dt;
    if (frog.idleTimer > 3 && frog.idleAnim === 'none') {
      const anims = ['look', 'breatheDeep', 'shift'];
      frog.idleAnim = anims[Math.floor(Math.random()*anims.length)];
      frog.idleAnimTimer = 0;
    }
    if (frog.idleAnim !== 'none') {
      frog.idleAnimTimer += dt;
      if (frog.idleAnim === 'breatheDeep') {
        frog.targetScaleX = 1 + Math.sin(frog.idleAnimTimer*3)*0.08;
        frog.targetScaleY = 1 - Math.sin(frog.idleAnimTimer*3)*0.06;
      } else if (frog.idleAnim === 'shift') {
        frog.targetScaleX = 1 + Math.sin(frog.idleAnimTimer*4)*0.05;
      }
      if (frog.idleAnimTimer > 1.5) {
        frog.idleAnim = 'none';
        frog.idleTimer = 0;
      }
    }
  } else {
    frog.idleTimer = 0;
    frog.idleAnim = 'none';
  }

  // ── Frog trail ──
  if (frog.isMoving && Math.random() < 0.4) {
    frog.trail.push({ x:frog.x, y:frog.y+12, alpha:0.15, size:3+Math.random()*2 });
  }
  frog.trail.forEach(t => { t.alpha -= dt*0.5; t.size += dt*3; });
  frog.trail = frog.trail.filter(t => t.alpha > 0);

  // Movement ripples
  if (frog.isMoving && !frog.isHopping && Math.random()<0.15) {
    ripples.push({ x:frog.x+(Math.random()-0.5)*8, y:frog.y+12, radius:0, maxRadius:10+Math.random()*8, alpha:0.1, width:0.8 });
  }

  // ── Tongue ──
  if (tongue.active) {
    tongue.wobble *= 0.9;
    if (!tongue.returning) {
      tongue.progress += dt * tongue.speed;
      if (tongue.progress >= 1) tongue.returning = true;
      const p = tongue.progress;
      const tipX = frog.x+(tongue.tx-frog.x)*p;
      const tipY = frog.y+(tongue.ty-frog.y)*p;
      bugs.forEach(bug => {
        if (!bug.alive || tongue.caught) return;
        const dx=bug.x-tipX, dy=bug.y-tipY;
        if (Math.sqrt(dx*dx+dy*dy) < bug.size+10) {
          tongue.caught = bug;
          tongue.returning = true;
          frog.eyeStretch = 0.5;
        }
      });
    } else {
      tongue.progress -= dt * tongue.speed * 1.8;
      if (tongue.caught) {
        const p = Math.max(0, tongue.progress);
        tongue.caught.x = frog.x+(tongue.tx-frog.x)*p;
        tongue.caught.y = frog.y+(tongue.ty-frog.y)*p;
        tongue.caught.scaleAnim = 0.7 + tongue.progress * 0.3;
        tongue.caught.rotation += dt * 15;
      }
      if (tongue.progress <= 0) {
        tongue.active = false;
        frog.mouthOpen = 0;
        if (tongue.caught) {
          killBug(tongue.caught);
          tongue.caught = null;
          // Gulp squash
          frog.targetScaleX = 1.2;
          frog.targetScaleY = 0.85;
        } else {
          // Miss - small recoil
          frog.targetScaleX = 1.08;
          frog.targetScaleY = 0.95;
        }
      }
    }
  }

  // ── Bugs ──
  bugs.forEach(bug => {
    if (bug.dying) {
      bug.deathAnim -= dt * 3;
      if (bug.deathAnim <= 0) bug.dying = false;
      return;
    }
    if (!bug.alive) return;
    bug.spawnAnim = Math.min(1, bug.spawnAnim + dt * 2);
    bug.changeTimer -= dt;
    if (bug.changeTimer <= 0) {
      bug.changeTimer = 1+Math.random()*3;
      const spd={dragonfly:2.5,beetle:0.6,fly:1.2,moth:0.8}[bug.type];
      const newVx = (Math.random()-0.5)*spd*2;
      const newVy = (Math.random()-0.5)*spd*2;
      // Smooth direction change
      bug.vx = lerp(bug.vx, newVx, 0.5);
      bug.vy = lerp(bug.vy, newVy, 0.5);
    }
    bug.x += bug.vx;
    bug.y += bug.vy;
    bug.bobPhase += dt * 3;
    bug.wingPhase += dt*(bug.type==='dragonfly'?25:bug.type==='moth'?12:18);
    if (bug.x<40||bug.x>WORLD_W-40) { bug.vx*=-1; bug.x=Math.max(40,Math.min(WORLD_W-40,bug.x)); }
    if (bug.y<40||bug.y>WORLD_H-40) { bug.vy*=-1; bug.y=Math.max(40,Math.min(WORLD_H-40,bug.y)); }
    // Dragonfly trail
    if (bug.type==='dragonfly' && Math.random()<0.4) bug.trail.push({x:bug.x,y:bug.y,life:0.4});
    bug.trail.forEach(t => t.life-=dt);
    bug.trail = bug.trail.filter(t => t.life>0);
  });

  // ── Fireflies ──
  fireflies.forEach(f => {
    f.phase += dt*f.pulseSpeed;
    f.angle += dt*(0.3+Math.sin(f.phase*0.5)*0.2);
    f.x = f.cx + Math.cos(f.angle)*f.radius;
    f.y = f.cy + Math.sin(f.angle)*f.radius + Math.sin(f.phase*2)*5;
  });

  // ── Ripples ──
  ripples.forEach(r => { r.radius+=dt*50; r.alpha-=dt*0.9; });
  ripples = ripples.filter(r => r.alpha>0);

  // ── Particles ──
  particles.forEach(p => {
    p.x+=p.vx; p.y+=p.vy;
    p.vx*=0.95; p.vy*=0.95;
    p.life-=dt;
    if (p.rot !== undefined) p.rot += (p.rotSpeed||0)*dt;
  });
  particles = particles.filter(p => p.life>0);

  // ── Splash drops (arc physics) ──
  splashDrops.forEach(d => {
    d.x += d.vx;
    d.y += d.vy;
    d.vy += d.gravity * dt * 3;
    d.life -= dt;
    // Spawn mini ripple when hitting water
    if (d.vy > 0 && d.y > frog.y + 20 && d.life > 0.1) {
      ripples.push({ x:d.x, y:d.y, radius:0, maxRadius:8, alpha:0.15, width:0.5 });
      d.life = 0;
    }
  });
  splashDrops = splashDrops.filter(d => d.life > 0);

  // ── Bubbles ──
  bubbles.forEach(b => {
    b.y -= b.speed;
    b.x += Math.sin(globalTime*2+b.phase)*b.wobble*dt;
    if (b.y<-10) { b.y=WORLD_H+10; b.x=Math.random()*WORLD_W; }
  });

  // ── Clouds ──
  clouds.forEach(c => { c.x+=c.speed; if(c.x>WORLD_W+c.size) c.x=-c.size; });

  // ── Combo UI ──
  if (combo>0) {
    comboTimer -= dt;
    if (comboTimer<=0) combo=0;
    const el=document.getElementById('combo');
    el.style.opacity = combo>1?1:0;
    el.textContent = 'x'+combo;
    el.style.fontSize = (18+Math.min(combo,12)*2)+'px';
  }

  // ── Camera (smooth damp) ──
  const camTarget = { x:frog.x-W/2, y:frog.y-H/2 };
  const camSmooth = isMobile ? 0.06 : 0.25; // Much tighter on mobile
  const cx = smoothDamp(camera.x, camTarget.x, camera.vx, camSmooth, dt);
  const cy = smoothDamp(camera.y, camTarget.y, camera.vy, camSmooth, dt);
  camera.x = Math.max(0, Math.min(WORLD_W-W, cx.value));
  camera.y = Math.max(0, Math.min(WORLD_H-H, cy.value));
  camera.vx = cx.velocity; camera.vy = cy.velocity;

  screenPulse *= 0.92;
  screenShake *= 0.90;
  updateMusic(dt);
}

// ─── DRAW ───
function draw() {
  const sx=(Math.random()-0.5)*screenShake*18;
  const sy=(Math.random()-0.5)*screenShake*18;
  ctx.save();
  ctx.translate(-camera.x+sx, -camera.y+sy);

  drawWater();

  // Underwater plants
  waterPlants.forEach(wp => {
    ctx.strokeStyle = `hsla(${wp.hue},40%,18%,0.35)`;
    ctx.lineWidth = 1.5;
    let px=wp.x, py=wp.y;
    ctx.beginPath(); ctx.moveTo(px,py);
    for (let s=0;s<wp.segments;s++) {
      const sway=Math.sin(globalTime*1.2+wp.phase+s*0.8)*(6+s*3);
      px+=sway*0.4; py-=10;
      ctx.lineTo(px+sway,py);
    }
    ctx.stroke();
    ctx.fillStyle=`hsla(${wp.hue},35%,22%,0.35)`;
    ctx.beginPath();
    ctx.ellipse(px+Math.sin(globalTime*1.2+wp.phase)*5, py, 4, 2.5, globalTime+wp.phase, 0, Math.PI*2);
    ctx.fill();
  });

  // Bubbles
  bubbles.forEach(b => {
    ctx.strokeStyle='rgba(134,239,172,0.06)';
    ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.size,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='rgba(134,239,172,0.04)';
    ctx.beginPath(); ctx.arc(b.x-b.size*0.3,b.y-b.size*0.3,b.size*0.3,0,Math.PI*2); ctx.fill();
  });

  // Lily pads
  lilyPads.forEach(lp => {
    const bob=Math.sin(globalTime*1.2+lp.bobPhase)*lp.bobAmount;
    ctx.save();
    ctx.translate(lp.x, lp.y+bob);
    ctx.rotate(lp.rot + Math.sin(globalTime*0.5+lp.bobPhase)*0.02);
    // Shadow
    ctx.fillStyle='rgba(0,15,0,0.22)';
    ctx.beginPath(); ctx.ellipse(3,3,lp.size+2,(lp.size+2)*0.75,0,0,Math.PI*2); ctx.fill();
    // Pad
    const g=ctx.createRadialGradient(0,0,0,0,0,lp.size);
    g.addColorStop(0,`hsl(140,50%,${22-lp.shade*100}%)`);
    g.addColorStop(1,`hsl(140,45%,${16-lp.shade*100}%)`);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(0,0,lp.size,lp.size*0.75,0,0.15,Math.PI*2); ctx.fill();
    // Veins
    ctx.strokeStyle='rgba(74,222,128,0.12)';
    ctx.lineWidth=0.5;
    for (let v=0;v<5;v++) {
      const a=(v/5)*Math.PI*1.6+0.3;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*lp.size*0.8,Math.sin(a)*lp.size*0.6); ctx.stroke();
    }
    // Edge highlight
    ctx.strokeStyle='rgba(134,239,172,0.08)';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.ellipse(0,0,lp.size,lp.size*0.75,0,0.15,Math.PI*2); ctx.stroke();
    // Flower
    if (lp.hasFlower) {
      const fSway = Math.sin(globalTime*2+lp.bobPhase)*2;
      for (let p=0;p<5;p++) {
        const pa=(p/5)*Math.PI*2+globalTime*0.2;
        ctx.fillStyle=lp.flowerColor;
        ctx.beginPath(); ctx.ellipse(Math.cos(pa)*5+lp.size*0.3+fSway,Math.sin(pa)*4-2,3,5,pa,0,Math.PI*2); ctx.fill();
      }
      ctx.fillStyle='#fde047';
      ctx.beginPath(); ctx.arc(lp.size*0.3+fSway,-2,2.5,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });

  // Reeds
  reeds.forEach(r => {
    const sway=Math.sin(globalTime*r.swaySpeed+r.swayPhase)*6;
    ctx.strokeStyle='#14371a';
    ctx.lineWidth=r.thickness;
    ctx.beginPath(); ctx.moveTo(r.x,r.y);
    ctx.quadraticCurveTo(r.x+sway*0.5,r.y-r.height*0.5,r.x+sway,r.y-r.height);
    ctx.stroke();
  });

  // Cattails
  cattails.forEach(c => {
    const sway=Math.sin(globalTime*1.5+c.swayPhase)*5;
    ctx.strokeStyle='#1a4020'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(c.x,c.y);
    ctx.quadraticCurveTo(c.x+sway*0.5,c.y-c.height*0.5,c.x+sway,c.y-c.height);
    ctx.stroke();
    ctx.fillStyle='#5c3a1e';
    ctx.beginPath(); ctx.ellipse(c.x+sway,c.y-c.height-6,3,8,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#7a4e2a';
    ctx.beginPath(); ctx.ellipse(c.x+sway,c.y-c.height-6,2.5,7,0,0,Math.PI*2); ctx.fill();
  });

  // Frog trail
  frog.trail.forEach(t => {
    ctx.fillStyle=`rgba(134,239,172,${t.alpha*0.3})`;
    ctx.beginPath(); ctx.arc(t.x,t.y,t.size,0,Math.PI*2); ctx.fill();
  });

  // Ripples
  ripples.forEach(r => {
    ctx.strokeStyle=`rgba(134,239,172,${r.alpha*0.4})`;
    ctx.lineWidth=r.width||1.5;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.radius,0,Math.PI*2); ctx.stroke();
  });

  // Belly flop ring
  if (frog.isFlopping && frog.flopRadius>0) {
    const a=Math.max(0,frog.flopTimer/0.6);
    for (let i=0;i<3;i++) {
      ctx.strokeStyle=`rgba(134,239,172,${a*(0.4-i*0.12)})`;
      ctx.lineWidth=3-i;
      ctx.beginPath(); ctx.arc(frog.x,frog.y,frog.flopRadius*0.7+i*20,0,Math.PI*2); ctx.stroke();
    }
  }

  // Bug trails
  bugs.forEach(bug => {
    bug.trail.forEach(t => {
      ctx.fillStyle=`rgba(125,211,252,${t.life*0.3})`;
      ctx.beginPath(); ctx.arc(t.x,t.y,1.5*t.life,0,Math.PI*2); ctx.fill();
    });
  });

  // Bugs
  bugs.forEach(bug => {
    if (bug.dying) {
      // Death animation - pop and fade
      ctx.save();
      ctx.translate(bug.x, bug.y);
      const s = easeOutBack(1 - bug.deathAnim) * 2;
      ctx.scale(s, s);
      ctx.globalAlpha = bug.deathAnim;
      drawBug(bug);
      ctx.globalAlpha = 1;
      ctx.restore();
      return;
    }
    if (!bug.alive) return;
    const bob = Math.sin(bug.bobPhase)*bug.bobHeight;
    ctx.save();
    ctx.translate(bug.x, bug.y + bob);
    const spawn = easeOutElastic(bug.spawnAnim);
    ctx.scale(bug.scaleAnim * spawn, bug.scaleAnim * spawn);
    ctx.rotate(bug.rotation);
    // Shadow
    ctx.fillStyle = `rgba(0,10,0,${0.1+bob*0.01})`;
    ctx.beginPath(); ctx.ellipse(0,bug.bobHeight+4,bug.size,2,0,0,Math.PI*2); ctx.fill();
    // Moth glow
    if (bug.type==='moth') {
      const glow=ctx.createRadialGradient(0,0,0,0,0,14);
      glow.addColorStop(0,`rgba(192,132,252,${0.08+Math.sin(globalTime*3)*0.04})`);
      glow.addColorStop(1,'transparent');
      ctx.fillStyle=glow;
      ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fill();
    }
    drawBug(bug);
    ctx.restore();
  });

  // NPCs
  npcs.forEach(npc => {
    const bob = Math.sin(globalTime * 1.5 + npc.bobPhase) * 2;
    ctx.save();
    ctx.translate(npc.x, npc.y + bob);

    // Shadow
    ctx.fillStyle = 'rgba(0,12,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, npc.size * 0.7, npc.size * 0.8, 4, 0, 0, Math.PI * 2); ctx.fill();

    if (npc.type === 'oldfrog') {
      // Old frog - bigger, darker, wrinkled
      const bg = ctx.createRadialGradient(0, -2, 2, 0, 2, npc.size);
      bg.addColorStop(0, '#7a9a30');
      bg.addColorStop(0.5, '#5a7a20');
      bg.addColorStop(1, '#3a5a10');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.ellipse(0, 0, npc.size * 0.7, npc.size * 0.6, 0, 0, Math.PI * 2); ctx.fill();
      // Belly
      ctx.fillStyle = '#8a9a60';
      ctx.beginPath(); ctx.ellipse(0, 3, npc.size * 0.4, npc.size * 0.35, 0, 0, Math.PI * 2); ctx.fill();
      // Warts/bumps
      ctx.fillStyle = 'rgba(50,70,20,0.5)';
      ctx.beginPath(); ctx.arc(-6, -5, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(8, -3, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-4, 2, 1.8, 0, Math.PI * 2); ctx.fill();
      // Eyes (heavy lids, wise)
      ctx.fillStyle = '#4a6a15';
      ctx.beginPath(); ctx.ellipse(-6, -10, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6, -10, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f0e68c';
      ctx.beginPath(); ctx.ellipse(-6, -10, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6, -10, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2a3a08';
      ctx.beginPath(); ctx.ellipse(-6, -10, 2, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6, -10, 2, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      // Heavy eyelids
      ctx.fillStyle = '#3a5a10';
      ctx.beginPath(); ctx.ellipse(-6, -12, 5, 2.5, 0, Math.PI, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6, -12, 5, 2.5, 0, Math.PI, Math.PI * 2); ctx.fill();
      // Mouth - slight frown
      ctx.strokeStyle = '#3a5a10';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, -2, 5, 0.3, Math.PI - 0.3); ctx.stroke();
    } else if (npc.type === 'mushroom') {
      // Mushroom creature
      // Stem
      ctx.fillStyle = '#ddd6fe';
      ctx.fillRect(-4, -2, 8, 12);
      // Cap
      const cg = ctx.createRadialGradient(0, -6, 0, 0, -6, 14);
      cg.addColorStop(0, '#c084fc');
      cg.addColorStop(1, '#7c3aed');
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.ellipse(0, -6, 14, 10, 0, Math.PI, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, -6, 14, 4, 0, 0, Math.PI); ctx.fill();
      // Spots on cap
      ctx.fillStyle = 'rgba(233,213,255,0.5)';
      ctx.beginPath(); ctx.arc(-5, -10, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, -12, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(7, -7, 1.5, 0, Math.PI * 2); ctx.fill();
      // Eyes (on stem)
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.ellipse(-3, 2, 2, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(3, 2, 2, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e9d5ff';
      ctx.beginPath(); ctx.arc(-3.5, 1, 0.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(2.5, 1, 0.8, 0, Math.PI * 2); ctx.fill();
      // Subtle glow
      const gg = ctx.createRadialGradient(0, -4, 0, 0, -4, 20);
      gg.addColorStop(0, 'rgba(192,132,252,0.08)');
      gg.addColorStop(1, 'transparent');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(0, -4, 20, 0, Math.PI * 2); ctx.fill();
    } else if (npc.type === 'turtle') {
      // Turtle
      // Shell
      const sg = ctx.createRadialGradient(0, -2, 0, 0, -2, 16);
      sg.addColorStop(0, '#6b7280');
      sg.addColorStop(1, '#374151');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.ellipse(0, -2, 16, 12, 0, 0, Math.PI * 2); ctx.fill();
      // Shell pattern
      ctx.strokeStyle = 'rgba(55,65,81,0.6)';
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.ellipse(0, -2, 10, 7, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, -2, 5, 3, 0, 0, Math.PI * 2); ctx.stroke();
      // Lines
      for (let i = 0; i < 6; i++) {
        const a = (i/6)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*5, -2+Math.sin(a)*3);
        ctx.lineTo(Math.cos(a)*10, -2+Math.sin(a)*7);
        ctx.stroke();
      }
      // Head poking out
      ctx.fillStyle = '#9ca3af';
      ctx.beginPath(); ctx.ellipse(-14, -2, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
      // Eyes
      ctx.fillStyle = '#f3f4f6';
      ctx.beginPath(); ctx.arc(-16, -4, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1f2937';
      ctx.beginPath(); ctx.arc(-16.5, -4, 1.2, 0, Math.PI * 2); ctx.fill();
      // Legs
      ctx.fillStyle = '#9ca3af';
      ctx.beginPath(); ctx.ellipse(-8, 8, 4, 3, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(8, 8, 4, 3, 0.3, 0, Math.PI * 2); ctx.fill();
    }

    // Interaction prompt
    const dx = frog.x - npc.x, dy = frog.y - npc.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if (dist < 60 && !dialogue.active) {
      const promptAlpha = 0.5 + Math.sin(globalTime * 3) * 0.3;
      ctx.fillStyle = `rgba(134,239,172,${promptAlpha})`;
      ctx.font = '10px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(isMobile ? 'TAP to talk' : '[E] Talk', 0, -npc.size - 12);
      ctx.textAlign = 'start';
    }

    // Name tag when close
    if (dist < 80) {
      ctx.fillStyle = 'rgba(134,239,172,0.4)';
      ctx.font = '9px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(npc.name, 0, npc.size * 0.7 + 14);
      ctx.textAlign = 'start';
    }

    ctx.restore();
  });

  // Tongue
  if (tongue.active) {
    const p=Math.max(0,tongue.progress);
    const tipX=frog.x+(tongue.tx-frog.x)*p;
    const tipY=frog.y+(tongue.ty-frog.y)*p;
    // Wobble curve
    const midX=(frog.x+tipX)/2 + Math.sin(globalTime*20)*tongue.wobble*8;
    const midY=(frog.y+tipY)/2 + Math.cos(globalTime*20)*tongue.wobble*8;
    // Shadow
    ctx.strokeStyle='rgba(0,0,0,0.15)';
    ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(frog.x+1,frog.y+2);
    ctx.quadraticCurveTo(midX+1,midY+2,tipX+1,tipY+2); ctx.stroke();
    // Tongue body
    ctx.strokeStyle='#f87171';
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(frog.x,frog.y);
    ctx.quadraticCurveTo(midX,midY,tipX,tipY); ctx.stroke();
    // Lighter center
    ctx.strokeStyle='#fca5a5';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(frog.x,frog.y);
    ctx.quadraticCurveTo(midX,midY,tipX,tipY); ctx.stroke();
    // Tip
    ctx.fillStyle='#ef4444';
    ctx.beginPath(); ctx.arc(tipX,tipY,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fca5a5';
    ctx.beginPath(); ctx.arc(tipX-1.5,tipY-1.5,2,0,Math.PI*2); ctx.fill();
    ctx.lineCap='butt';
  }

  // Splash drops (arcing water)
  splashDrops.forEach(d => {
    const a = d.life/d.maxLife;
    ctx.fillStyle = `rgba(134,239,172,${a*0.6})`;
    ctx.beginPath(); ctx.arc(d.x,d.y,d.size*a,0,Math.PI*2); ctx.fill();
    // Trailing glow
    ctx.fillStyle = `rgba(134,239,172,${a*0.15})`;
    ctx.beginPath(); ctx.arc(d.x,d.y,d.size*a*3,0,Math.PI*2); ctx.fill();
  });

  // FROG
  drawFrog();

  // Fireflies
  fireflies.forEach(f => {
    const bright = 0.2 + Math.pow(Math.max(0, Math.sin(f.phase)),2) * 0.8 + screenPulse*0.3;
    if (bright<0.05) return;
    const gg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,10+bright*5);
    gg.addColorStop(0,`rgba(253,224,71,${bright*0.3})`);
    gg.addColorStop(1,'rgba(253,224,71,0)');
    ctx.fillStyle=gg;
    ctx.beginPath(); ctx.arc(f.x,f.y,10+bright*5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(253,230,100,${bright})`;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.size*bright,0,Math.PI*2); ctx.fill();
  });

  // Particles
  particles.forEach(p => {
    const a=Math.max(0,p.life/(p.maxLife||1));
    ctx.save();
    ctx.translate(p.x,p.y);
    if (p.rot) ctx.rotate(p.rot);
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    if (p.type==='burst') {
      const s = p.size * (0.5+a*0.5);
      ctx.beginPath(); ctx.arc(0,0,s,0,Math.PI*2); ctx.fill();
      // Glow
      ctx.fillStyle=p.color.replace(')',',0.2)').replace('rgb','rgba').replace('hsl','hsla');
      ctx.beginPath(); ctx.arc(0,0,s*2.5,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    }
    ctx.globalAlpha=1;
    ctx.restore();
  });

  // Fog
  clouds.forEach(c => {
    const gg=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.size);
    gg.addColorStop(0,`rgba(134,200,160,${c.alpha})`);
    gg.addColorStop(1,'rgba(134,200,160,0)');
    ctx.fillStyle=gg;
    ctx.beginPath(); ctx.arc(c.x,c.y,c.size,0,Math.PI*2); ctx.fill();
  });

  ctx.restore();

  // Beat overlay
  if (screenPulse>0.01) {
    ctx.fillStyle=`rgba(134,239,172,${screenPulse*0.04})`;
    ctx.fillRect(0,0,W,H);
  }

  // Vignette
  const vg=ctx.createRadialGradient(W/2,H/2,W*0.25,W/2,H/2,W*0.75);
  vg.addColorStop(0,'transparent');
  vg.addColorStop(1,'rgba(2,8,5,0.7)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,W,H);

  // Intensity bar (not on mobile - takes space)
  if (intensity>0.03 && !isMobile) {
    const barH=120, barX=W-16, barY=H-barH-20;
    ctx.fillStyle='rgba(134,239,172,0.05)';
    ctx.fillRect(barX,barY,4,barH);
    const filled=intensity*barH;
    const ig=ctx.createLinearGradient(barX,barY+barH-filled,barX,barY+barH);
    ig.addColorStop(0,'rgba(134,239,172,0.8)');
    ig.addColorStop(1,'rgba(74,222,128,0.4)');
    ctx.fillStyle=ig;
    ctx.fillRect(barX,barY+barH-filled,4,filled);
  }

  // ── Mobile UI ──
  if (isMobile && gameRunning) {
    // Fixed joystick pad (always visible, bottom-left)
    const padX = 80, padY = H - 100;
    const outerR = JOY_RADIUS + 10;

    // Outer base circle
    ctx.fillStyle = 'rgba(134,239,172,0.04)';
    ctx.beginPath(); ctx.arc(padX, padY, outerR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(134,239,172,0.12)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(padX, padY, outerR, 0, Math.PI * 2); ctx.stroke();

    // Directional notches (N/S/E/W ticks)
    ctx.strokeStyle = 'rgba(134,239,172,0.1)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 - Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(padX + Math.cos(a) * (outerR - 6), padY + Math.sin(a) * (outerR - 6));
      ctx.lineTo(padX + Math.cos(a) * (outerR + 2), padY + Math.sin(a) * (outerR + 2));
      ctx.stroke();
    }

    // Inner ring
    ctx.strokeStyle = 'rgba(134,239,172,0.07)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(padX, padY, 20, 0, Math.PI * 2); ctx.stroke();

    // Knob position
    let knobX, knobY;
    if (touch.joyActive) {
      knobX = padX + touch.joyDx * JOY_RADIUS;
      knobY = padY + touch.joyDy * JOY_RADIUS;
      // Update joystick start to always be the fixed pad position
      touch.joyStartX = padX;
      touch.joyStartY = padY;
    } else {
      knobX = padX;
      knobY = padY;
    }

    // Direction line from center to knob
    if (touch.joyActive && (Math.abs(touch.joyDx) > 0.05 || Math.abs(touch.joyDy) > 0.05)) {
      ctx.strokeStyle = 'rgba(134,239,172,0.1)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padX, padY);
      ctx.lineTo(knobX, knobY);
      ctx.stroke();
    }

    // Knob
    const knobActive = touch.joyActive && (Math.abs(touch.joyDx) > 0.05 || Math.abs(touch.joyDy) > 0.05);
    const knobR = knobActive ? 20 : 16;
    const knobAlpha = knobActive ? 0.5 : 0.2;
    const jg = ctx.createRadialGradient(knobX, knobY, 0, knobX, knobY, knobR);
    jg.addColorStop(0, `rgba(134,239,172,${knobAlpha})`);
    jg.addColorStop(0.7, `rgba(134,239,172,${knobAlpha * 0.5})`);
    jg.addColorStop(1, `rgba(134,239,172,${knobAlpha * 0.1})`);
    ctx.fillStyle = jg;
    ctx.beginPath(); ctx.arc(knobX, knobY, knobR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(134,239,172,${knobAlpha * 0.8})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(knobX, knobY, knobR, 0, Math.PI * 2); ctx.stroke();
    // Knob inner dot
    ctx.fillStyle = `rgba(134,239,172,${knobAlpha * 0.6})`;
    ctx.beginPath(); ctx.arc(knobX, knobY, 3, 0, Math.PI * 2); ctx.fill();

    // Flop button (bottom-right)
    const flopBtnX = W - 55, flopBtnY = H - 55;
    const flopAlpha = frog.isFlopping ? 0.5 : 0.2;
    ctx.fillStyle = 'rgba(134,239,172,0.04)';
    ctx.beginPath(); ctx.arc(flopBtnX, flopBtnY, 38, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(134,239,172,${flopAlpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(flopBtnX, flopBtnY, 35, 0, Math.PI * 2); ctx.stroke();
    const fg = ctx.createRadialGradient(flopBtnX, flopBtnY, 0, flopBtnX, flopBtnY, 35);
    fg.addColorStop(0, `rgba(134,239,172,${flopAlpha * 0.5})`);
    fg.addColorStop(1, 'rgba(134,239,172,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(flopBtnX, flopBtnY, 35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(134,239,172,${flopAlpha + 0.1})`;
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('FLOP', flopBtnX, flopBtnY + 4);
    ctx.textAlign = 'start';
  }

  // Hide crosshair on mobile
  if (!isMobile) {
    const chPulse = 1 + screenPulse * 2;
    ctx.strokeStyle=`rgba(134,239,172,${0.35+screenPulse})`;
    ctx.lineWidth=1.5;
    const chh=7*chPulse;
    ctx.beginPath();
    ctx.moveTo(mouseX-chh,mouseY); ctx.lineTo(mouseX-3,mouseY);
    ctx.moveTo(mouseX+3,mouseY); ctx.lineTo(mouseX+chh,mouseY);
    ctx.moveTo(mouseX,mouseY-chh); ctx.lineTo(mouseX,mouseY-3);
    ctx.moveTo(mouseX,mouseY+3); ctx.lineTo(mouseX,mouseY+chh);
    ctx.stroke();
    ctx.fillStyle=`rgba(134,239,172,${0.5+screenPulse})`;
    ctx.beginPath(); ctx.arc(mouseX,mouseY,1.5,0,Math.PI*2); ctx.fill();
  }

  // ── Dialogue Box ──
  if (dialogue.active && dialogue.lines[dialogue.lineIndex]) {
    const line = dialogue.lines[dialogue.lineIndex];
    const boxW = Math.min(W - 40, 500);
    const boxH = dialogue.choices && dialogue.fullLineShown ? 160 + dialogue.choices.length * 28 : 130;
    const boxX = (W - boxW) / 2;
    const boxY = H - boxH - 20;

    // Box background
    ctx.fillStyle = 'rgba(5,15,8,0.92)';
    ctx.strokeStyle = 'rgba(134,239,172,0.4)';
    ctx.lineWidth = 2;
    // Rounded rect
    const r = 8;
    ctx.beginPath();
    ctx.moveTo(boxX+r, boxY);
    ctx.lineTo(boxX+boxW-r, boxY);
    ctx.quadraticCurveTo(boxX+boxW, boxY, boxX+boxW, boxY+r);
    ctx.lineTo(boxX+boxW, boxY+boxH-r);
    ctx.quadraticCurveTo(boxX+boxW, boxY+boxH, boxX+boxW-r, boxY+boxH);
    ctx.lineTo(boxX+r, boxY+boxH);
    ctx.quadraticCurveTo(boxX, boxY+boxH, boxX, boxY+boxH-r);
    ctx.lineTo(boxX, boxY+r);
    ctx.quadraticCurveTo(boxX, boxY, boxX+r, boxY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Inner glow line at top
    ctx.strokeStyle = 'rgba(134,239,172,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(boxX+20, boxY+1);
    ctx.lineTo(boxX+boxW-20, boxY+1);
    ctx.stroke();

    // Speaker name
    if (line.speaker) {
      // Name box
      const nameW = ctx.measureText ? line.speaker.length * 8 + 20 : 100;
      ctx.fillStyle = 'rgba(5,15,8,0.95)';
      ctx.strokeStyle = 'rgba(134,239,172,0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(boxX+12+r, boxY-22);
      ctx.lineTo(boxX+12+nameW-r, boxY-22);
      ctx.quadraticCurveTo(boxX+12+nameW, boxY-22, boxX+12+nameW, boxY-22+r);
      ctx.lineTo(boxX+12+nameW, boxY);
      ctx.lineTo(boxX+12, boxY);
      ctx.lineTo(boxX+12, boxY-22+r);
      ctx.quadraticCurveTo(boxX+12, boxY-22, boxX+12+r, boxY-22);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#86efac';
      ctx.font = '12px Courier New';
      ctx.fillText(line.speaker, boxX + 22, boxY - 7);
    }

    // Text (typewriter effect)
    const displayText = line.text.substring(0, Math.floor(dialogue.charIndex));
    const textLines = displayText.split('\n');
    ctx.fillStyle = '#c8e6c9';
    ctx.font = '13px Courier New';
    textLines.forEach((tl, i) => {
      ctx.fillText(tl, boxX + 20, boxY + 30 + i * 20);
    });

    // Blinking cursor at end of text
    if (!dialogue.fullLineShown && Math.sin(globalTime * 6) > 0) {
      const lastLine = textLines[textLines.length - 1] || '';
      const cursorX = boxX + 20 + lastLine.length * 7.8;
      const cursorY = boxY + 18 + (textLines.length - 1) * 20;
      ctx.fillStyle = '#86efac';
      ctx.fillRect(cursorX, cursorY, 7, 14);
    }

    // Choices
    if (dialogue.choices && dialogue.fullLineShown) {
      const choiceStartY = boxY + 30 + (line.text.split('\n').length) * 20 + 10;
      dialogue.choices.forEach((choice, i) => {
        const isSelected = i === dialogue.choiceIndex;
        const cy = choiceStartY + i * 28;

        if (isSelected) {
          // Selection highlight
          ctx.fillStyle = 'rgba(134,239,172,0.08)';
          ctx.fillRect(boxX + 14, cy - 4, boxW - 28, 24);
          ctx.fillStyle = '#86efac';
          ctx.fillText('>', boxX + 20, cy + 12);
        }

        ctx.fillStyle = isSelected ? '#86efac' : '#5a8a60';
        ctx.font = isSelected ? 'bold 13px Courier New' : '13px Courier New';
        ctx.fillText(choice.text, boxX + 36, cy + 12);
      });
    }

    // Continue prompt (bottom-right of box)
    if (dialogue.fullLineShown && !dialogue.choices) {
      const promptAlpha = 0.3 + Math.sin(globalTime * 4) * 0.3;
      ctx.fillStyle = `rgba(134,239,172,${promptAlpha})`;
      ctx.font = '10px Courier New';
      ctx.textAlign = 'right';
      ctx.fillText(isMobile ? 'tap to continue' : 'SPACE / CLICK', boxX + boxW - 16, boxY + boxH - 12);
      ctx.textAlign = 'start';
    }

    // Down arrow for continue
    if (dialogue.fullLineShown && !dialogue.choices) {
      const arrowY = boxY + boxH - 18 + Math.sin(globalTime * 4) * 3;
      ctx.fillStyle = `rgba(134,239,172,${0.4 + Math.sin(globalTime * 4) * 0.2})`;
      ctx.beginPath();
      ctx.moveTo(boxX + boxW / 2 - 5, arrowY);
      ctx.lineTo(boxX + boxW / 2 + 5, arrowY);
      ctx.lineTo(boxX + boxW / 2, arrowY + 5);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Mobile interact button (when near NPC and not in dialogue)
  if (isMobile && gameRunning && !dialogue.active && getNearestNPC()) {
    const ibX = 60, ibY = H - 140;
    ctx.strokeStyle = 'rgba(134,239,172,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ibX, ibY, 28, 0, Math.PI * 2); ctx.stroke();
    const ig = ctx.createRadialGradient(ibX, ibY, 0, ibX, ibY, 28);
    ig.addColorStop(0, 'rgba(134,239,172,0.15)');
    ig.addColorStop(1, 'rgba(134,239,172,0)');
    ctx.fillStyle = ig;
    ctx.beginPath(); ctx.arc(ibX, ibY, 28, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(134,239,172,0.5)';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('TALK', ibX, ibY + 4);
    ctx.textAlign = 'start';
  }
}

function drawWater() {
  ctx.fillStyle='#060e08';
  ctx.fillRect(camera.x-10,camera.y-10,W+20,H+20);
  const cellSize=20;
  const startX=Math.floor(camera.x/cellSize)*cellSize;
  const startY=Math.floor(camera.y/cellSize)*cellSize;
  for (let x=startX;x<camera.x+W+cellSize;x+=cellSize) {
    for (let y=startY;y<camera.y+H+cellSize;y+=cellSize) {
      const w1=Math.sin(x*0.012+globalTime*0.7)*Math.cos(y*0.01+globalTime*0.5);
      const w2=Math.sin(x*0.007-globalTime*0.4)*Math.sin(y*0.009+globalTime*0.25);
      const w3=Math.sin((x+y)*0.005+globalTime*0.3)*0.5;
      const wave=(w1+w2+w3)/3;
      const bright=5+wave*4+screenPulse*10;
      ctx.fillStyle=`rgb(${Math.floor(bright*0.15)},${Math.floor(bright)},${Math.floor(bright*0.3)})`;
      ctx.fillRect(x,y,2,2);
      if (wave>0.25) {
        ctx.fillStyle=`rgba(134,239,172,${(wave-0.25)*0.03})`;
        ctx.fillRect(x+1,y,1,1);
      }
    }
  }
  // Caustics
  for (let i=0;i<15;i++) {
    const cx=((Math.sin(globalTime*0.25+i*2.1)+1)/2)*WORLD_W;
    const cy=((Math.cos(globalTime*0.2+i*1.7)+1)/2)*WORLD_H;
    const size=50+Math.sin(globalTime*0.8+i)*25;
    const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,size);
    cg.addColorStop(0,`rgba(134,239,172,0.012)`);
    cg.addColorStop(1,'transparent');
    ctx.fillStyle=cg;
    ctx.beginPath(); ctx.arc(cx,cy,size,0,Math.PI*2); ctx.fill();
  }
}

function drawBug(bug) {
  const w=Math.sin(bug.wingPhase);
  if (bug.type==='fly') {
    ctx.fillStyle='#3a3a3a';
    ctx.beginPath(); ctx.arc(0,0,2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#555';
    ctx.beginPath(); ctx.arc(0,-2,1.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(200,220,210,${0.25+Math.abs(w)*0.2})`;
    ctx.beginPath(); ctx.ellipse(-3,-1,3+Math.abs(w),1.5,-0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3,-1,3+Math.abs(w),1.5,0.3,0,Math.PI*2); ctx.fill();
  } else if (bug.type==='dragonfly') {
    ctx.fillStyle='#38bdf8';
    ctx.fillRect(-1,-5,2,10);
    ctx.fillStyle='#7dd3fc';
    ctx.beginPath(); ctx.arc(0,-5,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(125,211,252,${0.2+Math.abs(w)*0.15})`;
    ctx.beginPath(); ctx.ellipse(-5,-2,6+w*2,2,-0.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5,-2,6-w*2,2,0.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-4,1,5-w,1.5,-0.1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4,1,5+w,1.5,0.1,0,Math.PI*2); ctx.fill();
  } else if (bug.type==='beetle') {
    ctx.fillStyle='#92400e';
    ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fbbf24';
    ctx.beginPath(); ctx.arc(-1.5,0,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(1.5,0,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#f59e0b';
    ctx.beginPath(); ctx.arc(0,0,2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#92400e'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(0,-3); ctx.lineTo(0,3); ctx.stroke();
    ctx.strokeStyle='#78350f'; ctx.lineWidth=0.5;
    for (let l=-1;l<=1;l++) {
      ctx.beginPath(); ctx.moveTo(-4,l*2.5); ctx.lineTo(-6,l*3+w); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(4,l*2.5); ctx.lineTo(6,l*3-w); ctx.stroke();
    }
  } else if (bug.type==='moth') {
    ctx.fillStyle='#c084fc';
    ctx.beginPath(); ctx.arc(0,0,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(192,132,252,${0.25+Math.abs(w)*0.2})`;
    ctx.beginPath(); ctx.ellipse(-3,0,4+w*1.5,3,-0.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3,0,4-w*1.5,3,0.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(147,51,234,0.5)';
    ctx.beginPath(); ctx.arc(-4,0,1.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,0,1.5,0,Math.PI*2); ctx.fill();
  }
}

function drawFrog() {
  const bob = frog.isMoving ? Math.sin(frog.walkPhase)*2 : Math.sin(frog.breathe)*0.8;
  const breatheScale = 1 + Math.sin(frog.breathe)*0.015;
  ctx.save();
  ctx.translate(frog.x, frog.y + bob + frog.hopHeight);
  ctx.rotate(frog.rotation);

  // Shadow (moves based on hop height)
  const shadowScale = 1 + frog.hopHeight * 0.02;
  const shadowAlpha = 0.3 + frog.hopHeight * 0.01;
  ctx.fillStyle=`rgba(0,12,0,${Math.max(0.05,shadowAlpha)})`;
  ctx.beginPath();
  ctx.ellipse(0, -frog.hopHeight+14, 14*frog.scaleX*shadowScale, 5*shadowScale, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.scale(frog.scaleX*breatheScale, frog.scaleY/breatheScale);

  // Back legs
  const legPhase = frog.isMoving ? frog.walkPhase : 0;
  const legKick = Math.sin(legPhase*2)*4;
  const legSpread = frog.isFlopping ? 1.3 : 1;
  // Left back leg
  ctx.fillStyle='#15803d';
  ctx.save();
  ctx.translate(-8*legSpread, 6);
  ctx.rotate(Math.sin(legPhase)*0.3);
  ctx.beginPath(); ctx.ellipse(0,0,5,3.5,0,0,Math.PI*2); ctx.fill();
  // Foot with toes
  ctx.fillStyle='#166534';
  ctx.beginPath(); ctx.ellipse(-4,2+legKick*0.3,4,2,-0.5,0,Math.PI*2); ctx.fill();
  // Toes
  ctx.fillStyle='#14532d';
  for (let t=0;t<3;t++) {
    ctx.beginPath(); ctx.ellipse(-6-t*1.5,3+t*1+legKick*0.3,2,1,-0.3-t*0.2,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  // Right back leg
  ctx.fillStyle='#15803d';
  ctx.save();
  ctx.translate(8*legSpread, 6);
  ctx.rotate(-Math.sin(legPhase)*0.3);
  ctx.beginPath(); ctx.ellipse(0,0,5,3.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#166534';
  ctx.beginPath(); ctx.ellipse(4,2-legKick*0.3,4,2,0.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#14532d';
  for (let t=0;t<3;t++) {
    ctx.beginPath(); ctx.ellipse(6+t*1.5,3+t*1-legKick*0.3,2,1,0.3+t*0.2,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Body
  const bodyG=ctx.createRadialGradient(0,-2,2,0,2,16);
  bodyG.addColorStop(0,'#4ade80');
  bodyG.addColorStop(0.5,'#22c55e');
  bodyG.addColorStop(1,'#15803d');
  ctx.fillStyle=bodyG;
  ctx.beginPath(); ctx.ellipse(0,0,13,11+frog.cheekPuff*2,0,0,Math.PI*2); ctx.fill();

  // Belly
  const bellyG=ctx.createRadialGradient(0,3,0,0,3,10);
  bellyG.addColorStop(0,'#bbf7d0');
  bellyG.addColorStop(1,'#86efac');
  ctx.fillStyle=bellyG;
  ctx.beginPath(); ctx.ellipse(0,3,8+frog.cheekPuff,7,0,0,Math.PI*2); ctx.fill();

  // Spots with subtle animation
  ctx.fillStyle='rgba(21,128,61,0.35)';
  ctx.beginPath(); ctx.arc(-5+Math.sin(globalTime*0.5)*0.5,-4,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4,-6,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(7,-1,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-8,1,1.2,0,Math.PI*2); ctx.fill();

  // Body highlight
  ctx.fillStyle='rgba(187,247,208,0.08)';
  ctx.beginPath(); ctx.ellipse(-3,-5,6,4,-0.3,0,Math.PI*2); ctx.fill();

  // Front legs
  ctx.fillStyle='#16a34a';
  ctx.save();
  ctx.translate(-8, 4);
  ctx.rotate(-Math.sin(legPhase)*0.2);
  ctx.beginPath(); ctx.ellipse(0,0,3.5,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#15803d';
  ctx.beginPath(); ctx.ellipse(-2,1,2,1.5,-0.2,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle='#16a34a';
  ctx.save();
  ctx.translate(8, 4);
  ctx.rotate(Math.sin(legPhase)*0.2);
  ctx.beginPath(); ctx.ellipse(0,0,3.5,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#15803d';
  ctx.beginPath(); ctx.ellipse(2,1,2,1.5,0.2,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Eye bumps
  const eyeStretchY = 1 + frog.eyeStretch * 0.3;
  ctx.fillStyle='#22c55e';
  ctx.beginPath(); ctx.ellipse(-7,-11,7.5,6.5*eyeStretchY,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7,-11,7.5,6.5*eyeStretchY,0,0,Math.PI*2); ctx.fill();
  // Bump highlight
  ctx.fillStyle='rgba(74,222,128,0.2)';
  ctx.beginPath(); ctx.ellipse(-8,-13,3,2.5,-0.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6,-13,3,2.5,0.3,0,Math.PI*2); ctx.fill();

  // Eye whites
  const blinkH=1-frog.eyeBlink;
  ctx.fillStyle='#f0fdf4';
  ctx.beginPath(); ctx.ellipse(-7,-12,5.5,5*blinkH*eyeStretchY,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7,-12,5.5,5*blinkH*eyeStretchY,0,0,Math.PI*2); ctx.fill();

  if (blinkH>0.15) {
    const pd = frog.pupilDilate;
    // Iris
    ctx.fillStyle='#166534';
    ctx.beginPath(); ctx.ellipse(-7+frog.lookX,-12+frog.lookY,3.5*pd,3.5*blinkH*pd,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7+frog.lookX,-12+frog.lookY,3.5*pd,3.5*blinkH*pd,0,0,Math.PI*2); ctx.fill();
    // Pupil
    ctx.fillStyle='#052e16';
    ctx.beginPath(); ctx.ellipse(-7+frog.lookX*1.2,-12+frog.lookY,2*pd,2.5*blinkH*pd,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7+frog.lookX*1.2,-12+frog.lookY,2*pd,2.5*blinkH*pd,0,0,Math.PI*2); ctx.fill();
    // Shine
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(-8.5+frog.lookX*0.3,-14,1.8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5.5+frog.lookX*0.3,-14,1.8,0,Math.PI*2); ctx.fill();
    // Secondary shine
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.arc(-5.5+frog.lookX*0.5,-10.5,0.8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8.5+frog.lookX*0.5,-10.5,0.8,0,Math.PI*2); ctx.fill();
  }

  // Eyelids when blinking
  if (frog.eyeBlink > 0.1) {
    ctx.fillStyle='#1a9a4a';
    ctx.beginPath(); ctx.ellipse(-7,-12,5.8,5*frog.eyeBlink,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7,-12,5.8,5*frog.eyeBlink,0,0,Math.PI*2); ctx.fill();
  }

  // Mouth
  if (frog.mouthOpen > 0.1) {
    // Open mouth
    ctx.fillStyle='#1a0505';
    ctx.beginPath(); ctx.ellipse(0,-3,4*frog.mouthOpen,3*frog.mouthOpen,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ef4444';
    ctx.beginPath(); ctx.ellipse(0,-2,3*frog.mouthOpen,1.5*frog.mouthOpen,0,0,Math.PI*2); ctx.fill();
  } else if (frog.gulpTimer > 0) {
    // Gulp expression
    const gp = frog.gulpTimer / 0.3;
    ctx.strokeStyle='#15803d';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(0,-3,4+gp*2,0.3,Math.PI-0.3); ctx.stroke();
    // Throat bulge
    ctx.fillStyle='rgba(187,247,208,0.15)';
    ctx.beginPath(); ctx.ellipse(0,2,6,4+gp*3,0,0,Math.PI*2); ctx.fill();
  } else {
    // Resting smile
    ctx.strokeStyle='#15803d';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(0,-4,5,0.2,Math.PI-0.2); ctx.stroke();
  }

  // Cheeks
  if (combo>2 || frog.cheekPuff > 0.1) {
    const blush = Math.max(frog.cheekPuff*0.4, Math.min(combo*0.04,0.25));
    ctx.fillStyle=`rgba(251,113,133,${blush})`;
    ctx.beginPath(); ctx.ellipse(-10,-5,3.5,2.5,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10,-5,3.5,2.5,0,0,Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

// ─── LOOP ───
let lastTime=0;
function loop(timestamp) {
  const dt=Math.min((timestamp-lastTime)/1000,0.05);
  lastTime=timestamp;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function startGame() {
  document.getElementById('start-screen').style.display='none';
  gameRunning=true;
  initAudio();
  initWorld();
}

requestAnimationFrame(loop);
</script>
