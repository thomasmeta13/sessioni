<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognition OS</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: #0d0d10;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2d2d3a; border-radius: 2px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState } = React;

// ── DATA ────────────────────────────────────────────────────────────────────

const AGENTS = [
  { id: 'scout',       name: 'Scout',       role: 'Explorer',      force: 'Novelty / Breadth',    status: 'idle',   icon: '🔭', color: '#6366f1', runs: 0,  confidence: 0.72 },
  { id: 'analyst',     name: 'Analyst',     role: 'Stress-Tester', force: 'Rigor / Skepticism',   status: 'idle',   icon: '🔬', color: '#06b6d4', runs: 0,  confidence: 0.81 },
  { id: 'synthesizer', name: 'Synthesizer', role: 'Integrator',    force: 'Coherence',            status: 'idle',   icon: '🧬', color: '#10b981', runs: 0,  confidence: 0.68 },
  { id: 'critic',      name: 'Critic',      role: 'Challenger',    force: 'Adversarial Pressure', status: 'idle',   icon: '⚡', color: '#f59e0b', runs: 0,  confidence: 0.75 },
  { id: 'builder',     name: 'Builder',     role: 'Executor',      force: 'Execution',            status: 'active', icon: '🔨', color: '#ec4899', runs: 3,  confidence: 0.90 },
  { id: 'orchestrator',name: 'Orchestrator',role: 'Coordinator',   force: 'Meta-Coordination',    status: 'active', icon: '🧠', color: '#a855f7', runs: 12, confidence: 0.95 },
];

const GOALS = [
  { id: 1, title: 'Build adaptive multi-agent OS', status: 'in-progress', priority: 'high',   progress: 28, agents: ['orchestrator','builder','analyst'] },
  { id: 2, title: 'Define shared artifact schema',  status: 'open',       priority: 'high',   progress: 0,  agents: ['synthesizer','analyst'] },
  { id: 3, title: 'Deploy agent dashboard v1',      status: 'in-progress', priority: 'medium', progress: 80, agents: ['builder'] },
  { id: 4, title: 'Implement persistent memory',    status: 'open',       priority: 'medium', progress: 0,  agents: ['orchestrator'] },
  { id: 5, title: 'Scout: first research run',      status: 'open',       priority: 'low',    progress: 0,  agents: ['scout'] },
];

// ── COMPONENTS ───────────────────────────────────────────────────────────────

function StatusDot({ status }) {
  const colors = { active: '#10b981', idle: '#4b5563', busy: '#f59e0b', error: '#ef4444' };
  return (
    <span style={{
      display: 'inline-block', width: 8, height: 8, borderRadius: '50%',
      background: colors[status] || '#4b5563',
      boxShadow: status === 'active' ? `0 0 6px ${colors.active}` : 'none',
      flexShrink: 0,
    }} />
  );
}

function ConfidenceBar({ value, color }) {
  return (
    <div style={{ background: '#1e1e2e', borderRadius: 4, height: 4, width: '100%', overflow: 'hidden' }}>
      <div style={{ width: `${value * 100}%`, height: '100%', background: color, borderRadius: 4, transition: 'width 0.6s ease' }} />
    </div>
  );
}

function Badge({ children, color = '#6366f1' }) {
  return (
    <span style={{
      background: color + '22', color: color, border: `1px solid ${color}44`,
      borderRadius: 6, padding: '2px 8px', fontSize: 11, fontWeight: 600,
    }}>{children}</span>
  );
}

// ── PAGES ────────────────────────────────────────────────────────────────────

function HomePage() {
  const activeAgents = AGENTS.filter(a => a.status === 'active').length;
  const openGoals = GOALS.filter(g => g.status === 'open' || g.status === 'in-progress').length;
  const avgConf = (AGENTS.reduce((s, a) => s + a.confidence, 0) / AGENTS.length * 100).toFixed(0);

  return (
    <div>
      <div style={{ marginBottom: 32 }}>
        <h1 style={{ fontSize: 26, fontWeight: 800, letterSpacing: -0.5, marginBottom: 6 }}>
          Cognition OS <span style={{ color: '#6366f1' }}>↗</span>
        </h1>
        <p style={{ color: '#64748b', fontSize: 14 }}>Adaptive multi-agent intelligence platform · March 23, 2026</p>
      </div>

      {/* Stats row */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16, marginBottom: 32 }}>
        {[
          { label: 'Active Agents',    value: activeAgents,   unit: `/ ${AGENTS.length}`, color: '#10b981' },
          { label: 'Open Goals',       value: openGoals,      unit: 'goals',              color: '#6366f1' },
          { label: 'Avg Confidence',   value: `${avgConf}%`,  unit: 'system',             color: '#f59e0b' },
          { label: 'Artifact Commits', value: 7,              unit: 'today',              color: '#ec4899' },
        ].map(s => (
          <div key={s.label} style={{ background: '#13131a', border: '1px solid #1e1e2e', borderRadius: 12, padding: '20px 24px' }}>
            <div style={{ fontSize: 28, fontWeight: 800, color: s.color }}>{s.value}</div>
            <div style={{ fontSize: 12, color: '#64748b', marginTop: 4 }}>{s.label}</div>
            <div style={{ fontSize: 11, color: '#374151', marginTop: 2 }}>{s.unit}</div>
          </div>
        ))}
      </div>

      {/* Agent summary */}
      <div style={{ background: '#13131a', border: '1px solid #1e1e2e', borderRadius: 12, padding: 24, marginBottom: 20 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: '#94a3b8', marginBottom: 16, textTransform: 'uppercase', letterSpacing: '0.08em' }}>Agent Fleet</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          {AGENTS.map(a => (
            <div key={a.id} style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <span style={{ fontSize: 18, width: 28 }}>{a.icon}</span>
              <div style={{ flex: 1 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                  <span style={{ fontSize: 13, fontWeight: 600 }}>{a.name}</span>
                  <span style={{ fontSize: 11, color: '#64748b' }}>{(a.confidence * 100).toFixed(0)}%</span>
                </div>
                <ConfidenceBar value={a.confidence} color={a.color} />
              </div>
              <StatusDot status={a.status} />
            </div>
          ))}
        </div>
      </div>

      {/* Activity feed */}
      <div style={{ background: '#13131a', border: '1px solid #1e1e2e', borderRadius: 12, padding: 24 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: '#94a3b8', marginBottom: 16, textTransform: 'uppercase', letterSpacing: '0.08em' }}>Recent Activity</div>
        {[
          { time: '22:10', agent: 'Builder',      msg: 'Dashboard v1 scaffolded — deploying to Netlify',    color: '#ec4899' },
          { time: '22:08', agent: 'Orchestrator', msg: 'Agent schema defined — 6 roles identified',         color: '#a855f7' },
          { time: '21:55', agent: 'Orchestrator', msg: 'System architecture brief ingested',                color: '#a855f7' },
          { time: '21:37', agent: 'Builder',      msg: 'Apartment homepage deployed → casa-thomas-keaton-kyle.netlify.app', color: '#ec4899' },
        ].map((e, i) => (
          <div key={i} style={{ display: 'flex', gap: 12, paddingBottom: 12, borderBottom: i < 3 ? '1px solid #1a1a25' : 'none', marginBottom: i < 3 ? 12 : 0 }}>
            <span style={{ fontSize: 11, color: '#374151', width: 38, flexShrink: 0, paddingTop: 1 }}>{e.time}</span>
            <div>
              <span style={{ fontSize: 11, fontWeight: 700, color: e.color }}>{e.agent}</span>
              <span style={{ fontSize: 12, color: '#94a3b8', marginLeft: 8 }}>{e.msg}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AgentsPage() {
  const [selected, setSelected] = useState(null);
  const agent = selected ? AGENTS.find(a => a.id === selected) : null;

  return (
    <div>
      <div style={{ marginBottom: 28 }}>
        <h1 style={{ fontSize: 22, fontWeight: 800, marginBottom: 4 }}>Agent Fleet</h1>
        <p style={{ color: '#64748b', fontSize: 13 }}>6 cognitive roles · 2 active · persistent memory enabled</p>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16 }}>
        {AGENTS.map(a => (
          <div
            key={a.id}
            onClick={() => setSelected(selected === a.id ? null : a.id)}
            style={{
              background: selected === a.id ? '#1a1a2e' : '#13131a',
              border: `1px solid ${selected === a.id ? a.color + '66' : '#1e1e2e'}`,
              borderRadius: 12, padding: 20, cursor: 'pointer',
              transition: 'all 0.15s',
            }}
          >
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12 }}>
              <span style={{ fontSize: 28 }}>{a.icon}</span>
              <StatusDot status={a.status} />
            </div>
            <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 2 }}>{a.name}</div>
            <div style={{ fontSize: 12, color: '#64748b', marginBottom: 12 }}>{a.role}</div>
            <ConfidenceBar value={a.confidence} color={a.color} />
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8, fontSize: 11, color: '#4b5563' }}>
              <span>Conf: <span style={{ color: a.color }}>{(a.confidence * 100).toFixed(0)}%</span></span>
              <span>Runs: {a.runs}</span>
            </div>
          </div>
        ))}
      </div>

      {agent && (
        <div style={{ background: '#13131a', border: `1px solid ${agent.color}44`, borderRadius: 12, padding: 24, marginTop: 20 }}>
          <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
            <span style={{ fontSize: 36 }}>{agent.icon}</span>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 18, fontWeight: 800, marginBottom: 2 }}>{agent.name}</div>
              <div style={{ fontSize: 12, color: '#64748b', marginBottom: 16 }}>{agent.role} · Status: <span style={{ color: agent.status === 'active' ? '#10b981' : '#64748b' }}>{agent.status}</span></div>
              <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
                <Badge color={agent.color}>{agent.force}</Badge>
                <Badge color="#374151">Runs: {agent.runs}</Badge>
              </div>
              <div style={{ fontSize: 13, color: '#64748b', lineHeight: 1.6 }}>
                <strong style={{ color: '#94a3b8' }}>Memory:</strong> No runs yet — memory will populate after first activation.<br/>
                <strong style={{ color: '#94a3b8' }}>Hands off to:</strong> {agent.id === 'scout' ? 'Analyst' : agent.id === 'analyst' ? 'Synthesizer' : agent.id === 'synthesizer' ? 'Builder' : 'Orchestrator'}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function GoalsPage() {
  const priorityColor = { high: '#ef4444', medium: '#f59e0b', low: '#10b981' };
  const statusColor   = { 'in-progress': '#6366f1', open: '#64748b', done: '#10b981' };

  return (
    <div>
      <div style={{ marginBottom: 28 }}>
        <h1 style={{ fontSize: 22, fontWeight: 800, marginBottom: 4 }}>Goals</h1>
        <p style={{ color: '#64748b', fontSize: 13 }}>{GOALS.length} goals · {GOALS.filter(g => g.status === 'in-progress').length} in progress</p>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        {GOALS.map(g => (
          <div key={g.id} style={{ background: '#13131a', border: '1px solid #1e1e2e', borderRadius: 12, padding: '18px 22px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 }}>
              <div>
                <span style={{ fontSize: 14, fontWeight: 600 }}>{g.title}</span>
                <div style={{ display: 'flex', gap: 6, marginTop: 6 }}>
                  <Badge color={statusColor[g.status]}>{g.status}</Badge>
                  <Badge color={priorityColor[g.priority]}>{g.priority}</Badge>
                  {g.agents.map(id => {
                    const a = AGENTS.find(x => x.id === id);
                    return a ? <Badge key={id} color={a.color}>{a.icon} {a.name}</Badge> : null;
                  })}
                </div>
              </div>
              <span style={{ fontSize: 13, fontWeight: 700, color: g.progress > 0 ? '#6366f1' : '#374151' }}>{g.progress}%</span>
            </div>
            <div style={{ background: '#0d0d10', borderRadius: 4, height: 4, overflow: 'hidden' }}>
              <div style={{ width: `${g.progress}%`, height: '100%', background: 'linear-gradient(90deg, #6366f1, #a855f7)', borderRadius: 4, transition: 'width 0.6s' }} />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── APP SHELL ─────────────────────────────────────────────────────────────────

const NAV = [
  { id: 'home',   label: 'Home',   icon: '⌂' },
  { id: 'agents', label: 'Agents', icon: '◈' },
  { id: 'goals',  label: 'Goals',  icon: '◎' },
];

function App() {
  const [page, setPage] = useState('home');

  const pages = { home: <HomePage />, agents: <AgentsPage />, goals: <GoalsPage /> };

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
      {/* Sidebar */}
      <div style={{ width: 220, background: '#0a0a0f', borderRight: '1px solid #1a1a25', display: 'flex', flexDirection: 'column', flexShrink: 0 }}>
        {/* Logo */}
        <div style={{ padding: '24px 20px 20px', borderBottom: '1px solid #1a1a25' }}>
          <div style={{ fontSize: 15, fontWeight: 800, letterSpacing: -0.5 }}>
            Cognition <span style={{ color: '#6366f1' }}>OS</span>
          </div>
          <div style={{ fontSize: 10, color: '#374151', marginTop: 2, letterSpacing: '0.1em', textTransform: 'uppercase' }}>Alpha · v0.1</div>
        </div>

        {/* Nav */}
        <nav style={{ padding: '12px 10px', flex: 1 }}>
          {NAV.map(n => (
            <button
              key={n.id}
              onClick={() => setPage(n.id)}
              style={{
                width: '100%', textAlign: 'left', background: page === n.id ? '#1a1a2e' : 'transparent',
                border: 'none', borderRadius: 8, padding: '9px 12px',
                color: page === n.id ? '#e2e8f0' : '#4b5563',
                fontSize: 13, fontWeight: page === n.id ? 700 : 400,
                cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 10, marginBottom: 2,
                transition: 'all 0.15s',
              }}
            >
              <span style={{ fontSize: 16 }}>{n.icon}</span>
              {n.label}
              {page === n.id && <span style={{ marginLeft: 'auto', width: 4, height: 4, borderRadius: '50%', background: '#6366f1' }} />}
            </button>
          ))}
        </nav>

        {/* System status */}
        <div style={{ padding: '14px 16px', borderTop: '1px solid #1a1a25' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <StatusDot status="active" />
            <span style={{ fontSize: 11, color: '#374151' }}>System nominal</span>
          </div>
          <div style={{ fontSize: 10, color: '#1e293b', marginTop: 4 }}>2 agents active · 0 errors</div>
        </div>
      </div>

      {/* Main content */}
      <div style={{ flex: 1, overflow: 'auto', padding: '32px 36px', background: '#0d0d10' }}>
        {pages[page]}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
