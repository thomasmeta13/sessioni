<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognition OS</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #0d0d10; color: #e2e8f0; height: 100vh; overflow: hidden; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #2d2d3a; border-radius: 2px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index: 100; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.15s ease; }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
    @keyframes glow { 0%,100% { filter: drop-shadow(0 0 4px currentColor) } 50% { filter: drop-shadow(0 0 12px currentColor) } }
    .modal-box { background: #13131a; border: 1px solid #2d2d3a; border-radius: 16px; width: 680px; max-height: 80vh; display: flex; flex-direction: column; animation: slideUp 0.2s ease; box-shadow: 0 24px 80px rgba(0,0,0,0.6); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid #1e1e2e; display: flex; align-items: center; justify-content: space-between; }
    .modal-body { padding: 24px; overflow-y: auto; flex: 1; }
    .md-content { font-size: 13px; line-height: 1.7; color: #94a3b8; }
    .md-content h1 { font-size: 18px; font-weight: 800; color: #e2e8f0; margin-bottom: 16px; }
    .md-content h2 { font-size: 12px; font-weight: 700; color: #6366f1; text-transform: uppercase; letter-spacing: 0.08em; margin: 18px 0 8px; }
    .md-content ul { padding-left: 16px; } .md-content li { margin-bottom: 4px; }
    .md-content strong { color: #cbd5e1; }
    .md-content table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    .md-content th { text-align: left; padding: 6px 10px; color: #4b5563; border-bottom: 1px solid #1e1e2e; font-weight: 600; }
    .md-content td { padding: 6px 10px; border-bottom: 1px solid #1a1a25; color: #64748b; }
    .close-btn { background: #1e1e2e; border: none; color: #64748b; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .close-btn:hover { background: #2d2d3a; color: #e2e8f0; }
    .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #10b981; animation: pulse 2s infinite; margin-right: 5px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef } = React;

// ── AGENT DATA ────────────────────────────────────────────────────────────────
const AGENTS = [
  { id: 'orchestrator', name: 'Orchestrator', role: 'Coordinator',    force: 'Meta-Coordination',    status: 'active', icon: '🧠', color: '#a855f7', runs: 12, confidence: 0.95 },
  { id: 'scout',        name: 'Scout',        role: 'Explorer',       force: 'Novelty / Breadth',    status: 'idle',   icon: '🔭', color: '#6366f1', runs: 0,  confidence: 0.72 },
  { id: 'analyst',      name: 'Analyst',      role: 'Stress-Tester',  force: 'Rigor / Skepticism',   status: 'idle',   icon: '🔬', color: '#06b6d4', runs: 0,  confidence: 0.81 },
  { id: 'synthesizer',  name: 'Synthesizer',  role: 'Integrator',     force: 'Coherence',            status: 'idle',   icon: '🧬', color: '#10b981', runs: 0,  confidence: 0.68 },
  { id: 'critic',       name: 'Critic',       role: 'Challenger',     force: 'Adversarial Pressure', status: 'idle',   icon: '⚡', color: '#f59e0b', runs: 0,  confidence: 0.75 },
  { id: 'builder',      name: 'Builder',      role: 'Executor',       force: 'Execution',            status: 'active', icon: '🔨', color: '#ec4899', runs: 3,  confidence: 0.90 },

  { from: 'orchestrator', to: 'analyst',     label: 'activates',  strength: 0.9 },
  { from: 'orchestrator', to: 'synthesizer', label: 'activates',  strength: 0.85 },
  { from: 'orchestrator', to: 'critic',      label: 'activates',  strength: 0.8 },
  { from: 'orchestrator', to: 'builder',     label: 'directs',    strength: 0.95 },
  { from: 'scout',        to: 'analyst',     label: 'feeds',      strength: 0.8 },
  { from: 'analyst',      to: 'synthesizer', label: 'feeds',      strength: 0.75 },
  { from: 'critic',       to: 'synthesizer', label: 'challenges', strength: 0.7 },
  { from: 'synthesizer',  to: 'builder',     label: 'specs',      strength: 0.85 },
  { from: 'builder',      to: 'critic',      label: 'review',     strength: 0.65 },

// Node positions in a 800x420 canvas
const NODE_POS = {
  orchestrator: { x: 400, y: 210 },
  scout:        { x: 120, y: 100 },
  analyst:      { x: 680, y: 100 },
  synthesizer:  { x: 680, y: 320 },
  critic:       { x: 400, y: 380 },
  builder:      { x: 120, y: 320 },

const AGENT_PROFILES = {
  scout: `# Agent: Scout\n## Identity\n- **Role:** Explorer — broad exploration & source gathering\n- **Directional Force:** Novelty, Breadth\n- **Activation Trigger:** New task, unknown domain, research needed\n- **Status:** idle\n\n## Capabilities\n- web_search\n- web_fetch\n- summarize\n- source ranking\n\n## Coordination\n- **Reports to:** Orchestrator\n- **Hands off to:** Analyst (after gathering)\n- **Conflicts with:** Critic (scope vs. rigor tension — expected)\n- **Influence Weight:** 0.70\n\n## Parameters\n- max_sources_per_run: 10\n- search_depth: broad\n- deduplication: true\n- confidence_threshold: 0.60\n\n## Persistent Memory\n- last_activated: null\n- domains_explored: []\n- sources_trusted: []\n- total_runs: 0\n\n## History\n| timestamp | task | key_output | confidence |\n|-----------|------|------------|------------|\n`,
  analyst: `# Agent: Analyst\n## Identity\n- **Role:** Stress-Tester — extracts patterns, validates claims, finds gaps\n- **Directional Force:** Rigor, Skepticism\n- **Activation Trigger:** Research gathered, claims need validation\n- **Status:** idle\n\n## Capabilities\n- pattern_extraction\n- claim_validation\n- gap_analysis\n- structured_reasoning\n\n## Coordination\n- **Reports to:** Orchestrator\n- **Receives from:** Scout\n- **Hands off to:** Synthesizer\n- **Influence Weight:** 0.81\n\n## Parameters\n- skepticism_level: high\n- min_sources_required: 2\n- flag_unsupported_claims: true\n- confidence_threshold: 0.75\n\n## Persistent Memory\n- last_activated: null\n- patterns_identified: []\n- claims_validated: []\n- total_runs: 0\n\n## History\n| timestamp | task | key_output | confidence |\n|-----------|------|------------|------------|\n`,
  synthesizer: `# Agent: Synthesizer\n## Identity\n- **Role:** Integrator — merges competing views, resolves tensions\n- **Directional Force:** Coherence\n- **Activation Trigger:** Multiple conflicting inputs, artifact needs unification\n- **Status:** idle\n\n## Capabilities\n- cross-agent_synthesis\n- tension_resolution\n- narrative_construction\n- confidence_aggregation\n\n## Coordination\n- **Reports to:** Orchestrator\n- **Receives from:** Analyst, Critic\n- **Hands off to:** Builder\n- **Influence Weight:** 0.68\n\n## Parameters\n- tension_tolerance: medium\n- require_consensus: false\n- surface_unresolved: true\n- min_inputs_required: 2\n\n## Persistent Memory\n- last_activated: null\n- tensions_resolved: []\n- total_runs: 0\n\n## History\n| timestamp | task | key_output | confidence |\n|-----------|------|------------|------------|\n`,
  critic: `# Agent: Critic\n## Identity\n- **Role:** Challenger — surfaces failure modes, adversarial pressure\n- **Directional Force:** Adversarial Pressure\n- **Activation Trigger:** Artifact nearing finalization, overconfidence detected\n- **Status:** idle\n\n## Capabilities\n- assumption_challenging\n- failure_mode_analysis\n- red_teaming\n- overconfidence_detection\n\n## Coordination\n- **Reports to:** Orchestrator\n- **Receives from:** Synthesizer, Builder\n- **Hands off to:** Synthesizer (revision)\n- **Influence Weight:** 0.75\n\n## Parameters\n- aggression_level: medium\n- block_threshold: 0.40\n- surface_all_risks: true\n\n## Persistent Memory\n- last_activated: null\n- assumptions_challenged: []\n- blocks_issued: 0\n- total_runs: 0\n\n## History\n| timestamp | task | key_output | confidence |\n|-----------|------|------------|------------|\n`,
  builder: `# Agent: Builder\n## Identity\n- **Role:** Executor — turns decisions into artifacts\n- **Directional Force:** Execution\n- **Activation Trigger:** Synthesis complete, spec approved\n- **Status:** active\n\n## Capabilities\n- code_generation\n- html_css_js\n- file_management\n- netlify_deploy\n- screenshot_capture\n\n## Coordination\n- **Reports to:** Orchestrator\n- **Receives from:** Synthesizer\n- **Hands off to:** Critic (review)\n- **Influence Weight:** 0.90\n\n## Parameters\n- deploy_target: netlify\n- require_review_before_deploy: false\n- max_iterations: 5\n- auto_screenshot: true\n\n## Persistent Memory\n- last_activated: "2026-03-23T22:10"\n- artifacts_built: ["apartment homepage", "B2B landing", "Cognition OS dashboard v1", "dashboard v2"]\n- deployments: ["casa-thomas-keaton-kyle.netlify.app", "cognition-os-dashboard.netlify.app"]\n- total_runs: 3\n\n## History\n| timestamp | task | key_output | confidence |\n|-----------|------|------------|------------|\n| 2026-03-23T21:37 | Apartment homepage | deployed | 0.95 |\n| 2026-03-23T21:45 | B2B landing page | deployed | 0.92 |\n| 2026-03-23T22:10 | Dashboard v1 | deployed | 0.90 |\n`,
  orchestrator: `# Agent: Orchestrator\n## Identity\n- **Role:** Coordinator — routes tasks, manages agent activation\n- **Directional Force:** Meta-Coordination\n- **Activation Trigger:** Always active\n- **Status:** active\n\n## Capabilities\n- agent_spawning\n- task_decomposition\n- routing_logic\n- confidence_aggregation\n- artifact_state_management\n\n## Coordination\n- **Reports to:** Human (Thomas)\n- **Controls:** Scout, Analyst, Synthesizer, Critic, Builder\n- **Influence Weight:** 0.95\n\n## Routing Rules\n- research_task → Scout → Analyst → Synthesizer → Builder\n- validation_task → Analyst → Critic → Synthesizer\n- build_task → Builder (direct)\n- ambiguous_task → Scout first\n\n## Persistent Memory\n- last_activated: "2026-03-23T22:23"\n- tasks_coordinated: 12\n- total_runs: 12\n\n## History\n| timestamp | task | routing_decision | outcome |\n|-----------|------|-----------------|--------|\n| 2026-03-23T21:55 | System architecture brief | ingest + store | stored |\n| 2026-03-23T22:08 | Agent schema design | direct synthesis | 6 schemas |\n| 2026-03-23T22:10 | Dashboard v1 | Builder direct | deployed |\n`,
};

const GOALS = [
  { id: 1, title: 'Build adaptive multi-agent OS',  status: 'in-progress', priority: 'high',   progress: 28, agents: ['orchestrator','builder','analyst'] },
  { id: 2, title: 'Define shared artifact schema',   status: 'open',        priority: 'high',   progress: 0,  agents: ['synthesizer','analyst'] },
  { id: 3, title: 'Deploy Cognition OS dashboard v2',status: 'in-progress', priority: 'medium', progress: 95, agents: ['builder'] },
  { id: 4, title: 'Implement persistent memory',     status: 'open',        priority: 'medium', progress: 0,  agents: ['orchestrator'] },
  { id: 5, title: 'Scout: first research run',       status: 'open',        priority: 'low',    progress: 0,  agents: ['scout'] },
];

// ── UTILS ─────────────────────────────────────────────────────────────────────
function StatusDot({ status }) {
  const colors = { active:'#10b981', idle:'#4b5563', busy:'#f59e0b', error:'#ef4444' };
  return <span style={{ display:'inline-block', width:8, height:8, borderRadius:'50%', background:colors[status]||'#4b5563', boxShadow:status==='active'?`0 0 6px ${colors.active}`:'none', flexShrink:0 }} />;
}
function ConfBar({ value, color }) {
  return <div style={{ background:'#1e1e2e', borderRadius:4, height:4, width:'100%', overflow:'hidden' }}><div style={{ width:`${value*100}%`, height:'100%', background:color, borderRadius:4 }} /></div>;
}
function Badge({ children, color='#6366f1' }) {
  return <span style={{ background:color+'22', color, border:`1px solid ${color}44`, borderRadius:6, padding:'2px 8px', fontSize:11, fontWeight:600, whiteSpace:'nowrap' }}>{children}</span>;
}

// ── MARKDOWN RENDERER ─────────────────────────────────────────────────────────
function renderMd(text) {
  const lines = text.split('\n'); const els = []; let trows = []; let inT = false; let k = 0;
  const flushT = () => { if (trows.length) { els.push(<table key={k++}><tbody>{trows}</tbody></table>); trows = []; } inT = false; };
  lines.forEach(line => {
    if (line.startsWith('| ')) {
      inT = true; if (line.includes('---')) return;
      const cells = line.split('|').filter(c=>c.trim()).map(c=>c.trim());
      const isH = trows.length === 0;
      trows.push(<tr key={k++}>{cells.map((c,i)=>isH?<th key={i}>{c}</th>:<td key={i}>{c}</td>)}</tr>);
    } else {
      if (inT) flushT();
      if (line.startsWith('# ')) els.push(<h1 key={k++}>{line.slice(2)}</h1>);
      else if (line.startsWith('## ')) els.push(<h2 key={k++}>{line.slice(3)}</h2>);
      else if (line.startsWith('- ')) {
        const parts = line.slice(2).split(/(\*\*.*?\*\*)/).map((p,i)=>p.startsWith('**')?<strong key={i}>{p.slice(2,-2)}</strong>:p);
        els.push(<ul key={k++}><li>{parts}</li></ul>);
      } else if (line.trim()) els.push(<p key={k++} style={{marginBottom:4}}>{line}</p>);
    }
  });
  if (inT) flushT(); return els;
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function AgentModal({ agent, onClose }) {
  return (
    <div className="modal-overlay" onClick={e=>e.target.classList.contains('modal-overlay')&&onClose()}>
      <div className="modal-box">
        <div className="modal-header">
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <span style={{fontSize:24}}>{agent.icon}</span>
            <div>
              <div style={{fontWeight:800,fontSize:15}}>{agent.name}</div>
              <div style={{fontSize:11,color:'#4b5563'}}>System Profile · agents/{agent.id}.md</div>
            </div>
          </div>
          <button className="close-btn" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body"><div className="md-content">{renderMd(AGENT_PROFILES[agent.id]||'')}</div></div>
      </div>
    </div>
  );
}

// ── AGENT NETWORK (SVG) ───────────────────────────────────────────────────────
function AgentNetwork({ onOpenModal }) {
  const [hovered, setHovered] = useState(null);
  const W = 800, H = 420;

  return (
    <div style={{ position:'relative', width:'100%', marginBottom:28 }}>
      <div style={{ fontSize:11, fontWeight:700, color:'#4b5563', letterSpacing:'0.15em', textTransform:'uppercase', textAlign:'center', marginBottom:12 }}>Agent Network</div>
      <div style={{ background:'#080810', border:'1px solid #1a1a28', borderRadius:16, overflow:'hidden' }}>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display:'block' }}>
          <defs>
            {AGENTS.map(a => (
              <radialGradient key={a.id} id={`grd-${a.id}`} cx="50%" cy="50%" r="50%">
                <stop offset="0%" stopColor={a.color} stopOpacity="0.4"/>
                <stop offset="100%" stopColor={a.color} stopOpacity="0"/>
              </radialGradient>
            ))}
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="glow-strong">
              <feGaussianBlur stdDeviation="5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          {/* Starfield */}
          {Array.from({length:60},(_,i)=>{
            const x=(i*137.5)%W, y=(i*97.3)%H, r=Math.random()<0.3?1.5:0.8;
            return <circle key={i} cx={x} cy={y} r={r} fill="white" opacity={0.08+((i%5)*0.04)}/>;
          })}

          {/* Edges */}
          {EDGES.map((e,i) => {
            const from = NODE_POS[e.from], to = NODE_POS[e.to];
            const fa = AGENTS.find(a=>a.id===e.from), ta = AGENTS.find(a=>a.id===e.to);
            const isHov = hovered===e.from||hovered===e.to;
            const mx=(from.x+to.x)/2, my=(from.y+to.y)/2;
            const dx=to.x-from.x, dy=to.y-from.y, len=Math.sqrt(dx*dx+dy*dy);
            const nx=-dy/len*40, ny=dx/len*40;
            const cx1=mx+nx*0.5, cy1=my+ny*0.5;
            return (
              <g key={i}>
                <path d={`M${from.x},${from.y} Q${cx1},${cy1} ${to.x},${to.y}`}
                  fill="none"
                  stroke={fa.color}
                  strokeWidth={isHov?2:1}
                  strokeOpacity={isHov?0.8:0.25}
                  filter={isHov?"url(#glow)":"none"}
                />
                {isHov && (
                  <path d={`M${from.x},${from.y} Q${cx1},${cy1} ${to.x},${to.y}`}
                    fill="none" stroke={fa.color} strokeWidth={4} strokeOpacity={0.15}
                    filter="url(#glow-strong)"
                  />
                )}
              </g>
            );
          })}

          {/* Nodes */}
          {AGENTS.map(a => {
            const p = NODE_POS[a.id];
            const isHov = hovered===a.id;
            const isActive = a.status==='active';
            return (
              <g key={a.id} style={{cursor:'pointer'}}
                onMouseEnter={()=>setHovered(a.id)}
                onMouseLeave={()=>setHovered(null)}
                onClick={()=>onOpenModal(a)}
              >
                {/* Glow halo */}
                <circle cx={p.x} cy={p.y} r={isHov?48:32} fill={`url(#grd-${a.id})`} opacity={isHov?1:0.6}/>
                {/* Outer ring */}
                <circle cx={p.x} cy={p.y} r={22} fill="none" stroke={a.color} strokeWidth={isHov?2:1} strokeOpacity={isHov?0.9:0.4} filter={isHov?"url(#glow)":"none"}/>
                {/* Active pulse ring */}
                {isActive && <circle cx={p.x} cy={p.y} r={26} fill="none" stroke={a.color} strokeWidth={1} strokeOpacity={0.3} strokeDasharray="4 4"/>}
                {/* Inner fill */}
                <circle cx={p.x} cy={p.y} r={18} fill={a.color} fillOpacity={isHov?0.35:0.15}/>
                {/* Core dot */}
                <circle cx={p.x} cy={p.y} r={7} fill={a.color} filter="url(#glow)"/>
                {/* Icon */}
                <text x={p.x} y={p.y+5} textAnchor="middle" fontSize={10}>{a.icon}</text>
                {/* Label */}
                <text x={p.x} y={p.y+38} textAnchor="middle" fontSize={11} fontWeight={isHov?700:500} fill={isHov?a.color:'#94a3b8'} filter={isHov?"url(#glow)":"none"}>{a.name.toUpperCase()}</text>
                <text x={p.x} y={p.y+51} textAnchor="middle" fontSize={9} fill="#4b5563">{a.role}</text>
              </g>
            );
          })}

          {/* Edge labels on hover */}
          {hovered && EDGES.filter(e=>e.from===hovered||e.to===hovered).map((e,i)=>{
            const from=NODE_POS[e.from], to=NODE_POS[e.to];
            const mx=(from.x+to.x)/2, my=(from.y+to.y)/2;
            const fa=AGENTS.find(a=>a.id===e.from);
            return (
              <g key={i}>
                <rect x={mx-24} y={my-9} width={48} height={14} rx={4} fill="#0d0d10" fillOpacity={0.85}/>
                <text x={mx} y={my+1} textAnchor="middle" fontSize={8} fill={fa.color} fontWeight={600}>{e.label}</text>
              </g>
            );
          })}
        </svg>
      </div>
      <div style={{textAlign:'center',marginTop:8,fontSize:11,color:'#2d2d3a'}}>Click any node to open System Profile</div>
    </div>
  );
}

// ── PAGES ─────────────────────────────────────────────────────────────────────
function HomePage({ onOpenModal }) {
  const activeAgents = AGENTS.filter(a=>a.status==='active').length;
  const openGoals = GOALS.filter(g=>g.status!=='done').length;
  const avgConf = (AGENTS.reduce((s,a)=>s+a.confidence,0)/AGENTS.length*100).toFixed(0);
  return (
    <div>
      <div style={{marginBottom:32}}>
        <h1 style={{fontSize:26,fontWeight:800,letterSpacing:-0.5,marginBottom:6}}>Cognition OS <span style={{color:'#6366f1'}}>↗</span></h1>
        <p style={{color:'#64748b',fontSize:14}}>Adaptive multi-agent intelligence platform · March 23, 2026</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16,marginBottom:28}}>
        {[
          {label:'Active Agents',value:activeAgents,unit:`/ ${AGENTS.length}`,color:'#10b981'},
          {label:'Open Goals',value:openGoals,unit:'goals',color:'#6366f1'},
          {label:'Avg Confidence',value:`${avgConf}%`,unit:'system',color:'#f59e0b'},
          {label:'Artifact Commits',value:7,unit:'today',color:'#ec4899'},
        ].map(s=>(
          <div key={s.label} style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:'20px 24px'}}>
            <div style={{fontSize:28,fontWeight:800,color:s.color}}>{s.value}</div>
            <div style={{fontSize:12,color:'#64748b',marginTop:4}}>{s.label}</div>
          </div>
        ))}
      </div>
      <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:24,marginBottom:20}}>
        <div style={{fontSize:13,fontWeight:700,color:'#94a3b8',marginBottom:16,textTransform:'uppercase',letterSpacing:'0.08em'}}>Agent Fleet</div>
        {AGENTS.map(a=>(
          <div key={a.id} style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
            <span style={{fontSize:18,width:28}}>{a.icon}</span>
            <div style={{flex:1}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:13,fontWeight:600}}>{a.name}</span>

// ── DECISION MAP PAGE ─────────────────────────────────────────────────────────
function DecisionMapPage() {
  const W = 900, H = 480;
  const options = [
    { id:'A', title:'Build artifact layer first', prob:62, confidence:'High', impact:'Moderate', cost:'Low', color:'#6366f1', agents:['analyst','synthesizer','orchestrator','scout'], x:160 },
    { id:'B', title:'Wire live agent execution', prob:48, confidence:'Medium', impact:'High', cost:'Medium', color:'#10b981', agents:['builder','critic','synthesizer','analyst'], x:450 },
    { id:'C', title:'Launch economic incentive layer', prob:25, confidence:'Low', impact:'Very High', cost:'High', color:'#f59e0b', agents:['critic','orchestrator'], x:740 },
  ];
  const rootX = 450, rootY = 80, branchY = 260;

  return (
    <div>
      <div style={{marginBottom:24}}>
        <h1 style={{fontSize:22,fontWeight:800,marginBottom:4}}>Decision Map</h1>
        <p style={{color:'#64748b',fontSize:13}}>Current decision space · artifact trajectory options</p>
      </div>
      <div style={{background:'#080810',border:'1px solid #1a1a28',borderRadius:16,overflow:'hidden',marginBottom:20}}>
        <div style={{fontSize:11,fontWeight:700,color:'#4b5563',letterSpacing:'0.15em',textTransform:'uppercase',textAlign:'center',padding:'16px 0 0'}}>AI ARTIFACT DECISION MAP</div>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:'block'}}>
          <defs>
            <filter id="glow2"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            {options.map(o=>(
              <linearGradient key={o.id} id={`lg-${o.id}`} x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stopColor={o.color} stopOpacity="0.6"/>
                <stop offset="100%" stopColor={o.color} stopOpacity="0.05"/>
              </linearGradient>
            ))}
          </defs>

          {/* Starfield */}
          {Array.from({length:40},(_,i)=><circle key={i} cx={(i*173)%W} cy={(i*111)%H} r={0.8} fill="white" opacity={0.06}/>)}

          {/* Root box */}
          <rect x={rootX-130} y={rootY-30} width={260} height={60} rx={8} fill="#13131a" stroke="#2d2d3a" strokeWidth={1}/>
          <text x={rootX} y={rootY+5} textAnchor="middle" fontSize={13} fontWeight={700} fill="#e2e8f0">Current Artifact State</text>
          <text x={rootX} y={rootY+20} textAnchor="middle" fontSize={10} fill="#64748b">Status: Active &amp; Evolving · v0.1</text>
          <circle cx={rootX-108} cy={rootY-5} r={4} fill="#10b981" opacity={0.8}/>

          {/* Connector lines — curved */}
          {options.map(o=>{
            const c1x=rootX, c1y=rootY+60+40, c2x=o.x, c2y=branchY-40;
            return (
              <g key={o.id}>
                <path d={`M${rootX},${rootY+30} C${c1x},${c1y} ${c2x},${c2y} ${o.x},${branchY}`}
                  fill="none" stroke={o.color} strokeWidth={1.5} strokeOpacity={0.3}/>
                <path d={`M${rootX},${rootY+30} C${c1x},${c1y} ${c2x},${c2y} ${o.x},${branchY}`}
                  fill="none" stroke={o.color} strokeWidth={6} strokeOpacity={0.08} filter="url(#glow2)"/>
              </g>
            );
          })}

          {/* Option boxes */}
          {options.map(o=>{
            const bw=220, bh=190, bx=o.x-bw/2, by=branchY;
            const agents=o.agents.map(id=>AGENTS.find(a=>a.id===id)).filter(Boolean);
            return (
              <g key={o.id}>
                <rect x={bx} y={by} width={bw} height={bh} rx={10} fill="#13131a" stroke={o.color} strokeWidth={1} strokeOpacity={0.4}/>
                <rect x={bx} y={by} width={bw} height={bh} rx={10} fill={`url(#lg-${o.id})`} opacity={0.12}/>
                {/* Header */}
                <text x={o.x} y={by+24} textAnchor="middle" fontSize={14} fontWeight={800} fill={o.color} filter="url(#glow2)">Option {o.id}</text>
                <text x={o.x} y={by+40} textAnchor="middle" fontSize={9} fill="#64748b" width={bw-20}>{o.title}</text>
                {/* Stats */}
                {[
                  ['Probability', `${o.prob}%`, o.color],
                  ['Confidence', o.confidence, o.confidence==='High'?'#10b981':o.confidence==='Medium'?'#f59e0b':'#ef4444'],
                  ['Impact', o.impact, '#94a3b8'],
                  ['Cost', o.cost, '#94a3b8'],
                ].map(([label,val,vc],i)=>(
                  <g key={label}>
                    <text x={bx+16} y={by+68+i*26} fontSize={10} fill="#64748b">{label}:</text>
                    <text x={bx+bw-16} y={by+68+i*26} textAnchor="end" fontSize={10} fontWeight={700} fill={vc}>{val}</text>
                    <line x1={bx+16} y1={by+72+i*26} x2={bx+bw-16} y2={by+72+i*26} stroke="#1e1e2e" strokeWidth={0.5}/>
                  </g>
                ))}
                {/* Agent dots */}
                {agents.map((a,i)=>(
                  <g key={a.id}>
                    <circle cx={bx+20+i*28} cy={by+bh-22} r={10} fill={a.color} fillOpacity={0.2} stroke={a.color} strokeWidth={1} strokeOpacity={0.5}/>
                    <text x={bx+20+i*28} y={by+bh-18} textAnchor="middle" fontSize={9}>{a.icon}</text>
                  </g>
                ))}
              </g>
            );
          })}
        </svg>
      </div>
      <div style={{background:'#13131a',border:'1px solid #1e1e2e',borderRadius:12,padding:20}}>
        <div style={{fontSize:12,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:12}}>Orchestrator Recommendation</div>
        <div style={{fontSize:13,color:'#64748b',lineHeight:1.7}}>
          Based on current confidence levels and resource constraints, <span style={{color:'#6366f1',fontWeight:600}}>Option A (artifact layer)</span> has the highest probability of unblocking Options B and C. Suggested sequence: A → B → C as confidence accumulates.
        </div>
      </div>
    </div>
  );
}

// ── APP SHELL ─────────────────────────────────────────────────────────────────
const NAV = [
  {id:'home',       label:'Home',          icon:'⌂'},
  {id:'agents',     label:'Agents',        icon:'◈'},
  {id:'goals',      label:'Goals',         icon:'◎'},
  {id:'decisions',  label:'Decision Map',  icon:'⎇'},
  {id:'artifact',   label:'Artifact State',icon:'◉'},
];

function App() {
  const [page, setPage] = useState('home');
  const [modal, setModal] = useState(null);

  const pages = {
    home:      <HomePage      onOpenModal={setModal}/>,
    agents:    <AgentsPage    onOpenModal={setModal}/>,
    goals:     <GoalsPage/>,
    decisions: <DecisionMapPage/>,
    artifact:  <ArtifactPage/>,
  };

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      {modal && <AgentModal agent={modal} onClose={()=>setModal(null)}/>}
      <div style={{width:220,background:'#0a0a0f',borderRight:'1px solid #1a1a25',display:'flex',flexDirection:'column',flexShrink:0}}>
        <div style={{padding:'24px 20px 20px',borderBottom:'1px solid #1a1a25'}}>
          <div style={{fontSize:15,fontWeight:800,letterSpacing:-0.5}}>Cognition <span style={{color:'#6366f1'}}>OS</span></div>
          <div style={{fontSize:10,color:'#374151',marginTop:2,letterSpacing:'0.1em',textTransform:'uppercase'}}>Alpha · v0.1</div>
        </div>
        <nav style={{padding:'12px 10px',flex:1}}>
          {NAV.map(n=>(
            <button key={n.id} onClick={()=>setPage(n.id)} style={{width:'100%',textAlign:'left',background:page===n.id?'#1a1a2e':'transparent',border:'none',borderRadius:8,padding:'9px 12px',color:page===n.id?'#e2e8f0':'#4b5563',fontSize:13,fontWeight:page===n.id?700:400,cursor:'pointer',display:'flex',alignItems:'center',gap:10,marginBottom:2,transition:'all 0.15s'}}>
              <span style={{fontSize:15}}>{n.icon}</span>{n.label}
              {page===n.id&&<span style={{marginLeft:'auto',width:4,height:4,borderRadius:'50%',background:'#6366f1'}}/>}
            </button>
          ))}
        </nav>
        <div style={{padding:'14px 16px',borderTop:'1px solid #1a1a25'}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <StatusDot status="active"/>
            <span style={{fontSize:11,color:'#374151'}}>System nominal</span>
          </div>
          <div style={{fontSize:10,color:'#1e293b',marginTop:4}}>2 agents active · 0 errors</div>
        </div>
      </div>
      <div style={{flex:1,overflow:'auto',padding:'32px 36px',background:'#0d0d10'}}>
        {pages[page]}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
